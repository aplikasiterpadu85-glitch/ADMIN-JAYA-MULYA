/* Kontras 3D lebih kuat untuk tab utama pada menu Tugas Admin. */
.task-tabs .tab:not(.active){
  color:#496783;
  background:linear-gradient(145deg,#e4edf6 0%,#d5e3f1 100%);
  border:1px solid #cfdeed;
  box-shadow:inset 2px 2px 5px rgba(115,145,174,.18),inset -2px -2px 5px rgba(255,255,255,.92),0 2px 3px rgba(54,93,130,.06);
  transform:translateY(0);
}
.task-tabs .tab.active{
  position:relative;
  z-index:3;
  color:#fff;
  background:linear-gradient(155deg,#42adff 0%,#2379df 48%,#174d9f 100%);
  border:1px solid #6bc1ff;
  transform:translateY(-5px) scale(1.018);
  box-shadow:0 7px 0 #123f80,0 13px 22px rgba(20,80,151,.34),inset 0 2px 0 rgba(255,255,255,.62),inset 0 -3px 5px rgba(5,40,100,.24);
  outline:2px solid rgba(93,183,255,.42);
  outline-offset:2px;
}
.task-tabs .tab.active>span{color:#fff;text-shadow:0 1px 2px rgba(0,30,80,.32)}
.task-tabs .tab.active .task-count{box-shadow:0 3px 7px rgba(95,22,36,.28),inset 1px 1px 2px #fff;border-color:#ffb4bf}
.task-tabs .tab.active:hover{transform:translateY(-6px) scale(1.022);box-shadow:0 8px 0 #123f80,0 16px 25px rgba(20,80,151,.38),inset 0 2px 0 rgba(255,255,255,.66),inset 0 -3px 5px rgba(5,40,100,.24)}
@media(max-width:760px){
  .task-tabs .tab.active{transform:translateY(-4px) scale(1.01)}
  .task-tabs .tab.active:hover{transform:translateY(-5px) scale(1.015)}
}

  box-shadow:5px 6px 11px rgba(68,117,164,.20),-4px -4px 9px rgba(255,255,255,.98),inset 1px 1px 2px rgba(255,255,255,.9),inset -2px -3px 4px rgba(73,115,155,.10);

const SCRIPT_GS_ONELINE = "function doGet() { return HtmlService.createHtmlOutputFromFile('Index').setTitle('JM Operasional').addMetaTag('viewport','width=device-width, initial-scale=1'); } function init_() { var p=PropertiesService.getScriptProperties(); if(!p.getProperty('DB_ID')) { var ss=SpreadsheetApp.create('JM Operasional — Database'); p.setProperty('DB_ID',ss.getId()); var sh=ss.getSheets()[0]; sh.setName('APP_DATA'); sh.getRange('A1').setValue('JM_OPERASIONAL_DB'); saveState_(emptyState_()); } if(!p.getProperty('ADMIN_HASH')) p.setProperty('ADMIN_HASH',hash_('admin123')); } function hash_(s) { return Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,String(s),Utilities.Charset.UTF_8).map(function(b){var v=(b<0?b+256:b).toString(16);return v.length===1?'0'+v:v;}).join(''); } function emptyState_() { return {settings:{outletName:'JM Operasional',cloudUrl:'',maxBalance:5000000,daysWithoutDeposit:2,visibleMenus:{overview:true,tasks:true,items:true,personnel:true,reports:true}},items:[],personnel:[],orders:[],deposits:[]}; } function db_() { init_(); return SpreadsheetApp.openById(PropertiesService.getScriptProperties().getProperty('DB_ID')).getSheetByName('APP_DATA'); } function readState_() { var sh=db_(), last=sh.getLastColumn(); if(last<2) return emptyState_(); var chunks=sh.getRange(1,2,1,last-1).getValues()[0].filter(function(x){return x!=='';}); if(!chunks.length)return emptyState_(); try{return JSON.parse(chunks.join(''));}catch(e){return emptyState_();} } function saveState_(state) { var sh=db_(), raw=JSON.stringify(state), chunks=[]; for(var i=0;i<raw.length;i+=40000) chunks.push(raw.slice(i,i+40000)); sh.getRange(1,1,1,Math.max(2,chunks.length+1)).clearContent(); sh.getRange(1,1).setValue('JM_OPERASIONAL_DB'); if(chunks.length) sh.getRange(1,2,1,chunks.length).setValues([chunks]); return {ok:true,updatedAt:new Date().toISOString()}; } function cleanState_(){var s=readState_(); if(!s.settings)s.settings=emptyState_().settings; if(!s.items)s.items=[];if(!s.personnel)s.personnel=[];if(!s.orders)s.orders=[];if(!s.deposits)s.deposits=[];return s;} function createSession_(role,personnelId) {var token=Utilities.getUuid()+Utilities.getUuid().replace(/-/g,'');var now=Date.now(),session={role:role,personnelId:personnelId||'',createdAt:now,expiresAt:now+30*24*60*60*1000};var p=PropertiesService.getScriptProperties(),all=p.getProperties();Object.keys(all).forEach(function(k){if(k.indexOf('SESS_')===0){try{var old=JSON.parse(all[k]);if(!old.expiresAt||old.expiresAt<now)p.deleteProperty(k);}catch(e){p.deleteProperty(k);}}});var raw=JSON.stringify(session);p.setProperty('SESS_'+token,raw);CacheService.getScriptCache().put('sess_'+token,raw,21600);return token;} function session_(token) {if(!token)throw new Error('Sesi tidak ditemukan. Silakan login kembali.');var p=PropertiesService.getScriptProperties(),raw=p.getProperty('SESS_'+token);if(!raw)raw=CacheService.getScriptCache().get('sess_'+token);if(!raw)throw new Error('Sesi berakhir. Silakan login kembali.');var s=JSON.parse(raw),now=Date.now();if(s.expiresAt&&now>s.expiresAt){p.deleteProperty('SESS_'+token);CacheService.getScriptCache().remove('sess_'+token);throw new Error('Sesi berakhir. Silakan login kembali.');}s.expiresAt=now+30*24*60*60*1000;var updated=JSON.stringify(s);p.setProperty('SESS_'+token,updated);CacheService.getScriptCache().put('sess_'+token,updated,21600);return s;} function requireAdmin_(token){var a=session_(token);if(a.role!=='admin')throw new Error('Aksi ini hanya untuk admin.');return a;} function requirePerson_(token){var a=session_(token);if(a.role!=='personnel')throw new Error('Sesi personil tidak valid.');return a;} function getBootInfo(){init_();return {ok:true,webAppUrl:ScriptApp.getService().getUrl()};} function stateForRole_(s,a){if(a.role!=='personnel')return s;var id=a.personnelId;return {settings:s.settings,items:s.items,personnel:s.personnel.filter(function(p){return p.id===id;}),orders:s.orders.filter(function(o){return o.personnelId===id;}),deposits:s.deposits.filter(function(d){return d.personnelId===id;})};} function authAdmin(username,password){init_(); if(String(username||'').trim().toLowerCase()!=='admin')return {ok:false,message:'Username admin tidak sesuai.'};var p=PropertiesService.getScriptProperties(),h=p.getProperty('ADMIN_HASH');if(hash_(password||'')!==h)return {ok:false,message:'Sandi admin salah.'};var token=createSession_('admin');return {ok:true,token:token,role:'admin',mustChangePassword:hash_(password||'')===hash_('admin123'),state:cleanState_()};} function changeAdminPassword(token,oldPassword,newPassword){requireAdmin_(token);if(!newPassword||String(newPassword).length<8)throw new Error('Sandi baru minimal 8 karakter.');var p=PropertiesService.getScriptProperties();if(hash_(oldPassword||'')!==p.getProperty('ADMIN_HASH'))throw new Error('Sandi lama tidak cocok.');p.setProperty('ADMIN_HASH',hash_(newPassword));return {ok:true};} function authPersonnel(code){var s=cleanState_(),key=String(code||'').trim().toUpperCase();var person=s.personnel.find(function(p){return String(p.activationCode||'').toUpperCase()===key;});if(!person)return {ok:false,message:'Kode aktivasi tidak ditemukan.'};person.active=true;person.lastLoginAt=new Date().toISOString();saveState_(s);var token=createSession_('personnel',person.id);return {ok:true,token:token,role:'personnel',personnelId:person.id,state:stateForRole_(s,{role:'personnel',personnelId:person.id})};} function getAppState(token){var a=session_(token),s=cleanState_();return {ok:true,role:a.role,personnelId:a.personnelId,state:stateForRole_(s,a),updatedAt:new Date().toISOString(),webAppUrl:ScriptApp.getService().getUrl()};} function adminSaveState(token,state){requireAdmin_(token);if(!state||!state.settings||!Array.isArray(state.items)||!Array.isArray(state.personnel)||!Array.isArray(state.orders)||!Array.isArray(state.deposits))throw new Error('Data aplikasi tidak valid.');saveState_(state);return {ok:true,updatedAt:new Date().toISOString(),state:cleanState_()};} function cloudTest(token){requireAdmin_(token);var s=cleanState_();return {ok:true,message:'Cloud terhubung. Data tersimpan di Google Sheets.',outlet:s.settings.outletName,spreadsheetUrl:SpreadsheetApp.openById(PropertiesService.getScriptProperties().getProperty('DB_ID')).getUrl()};} function personnelCreateOrder(token,payload){var a=requirePerson_(token),s=cleanState_(),person=s.personnel.find(function(p){return p.id===a.personnelId;});if(!person)throw new Error('Data personil tidak ditemukan.');var lines=(payload.items||[]).map(function(x){var item=s.items.find(function(i){return i.id===x.itemId;});var qty=Math.max(1,Math.floor(Number(x.qty)||1));if(!item)throw new Error('Item sudah tidak tersedia.');return {itemId:item.id,name:item.name,price:Number(item.price)||0,qty:qty,subtotal:(Number(item.price)||0)*qty};});if(!lines.length)throw new Error('Pilih minimal satu item.');var order={id:Utilities.getUuid(),personnelId:person.id,date:String(payload.date||today_()),items:lines,total:lines.reduce(function(n,x){return n+x.subtotal;},0),status:'masuk',createdAt:new Date().toISOString()};s.orders.push(order);saveState_(s);return {ok:true,state:stateForRole_(s,a),order:order};} function personnelCreateDeposit(token,payload){var a=requirePerson_(token),s=cleanState_(),person=s.personnel.find(function(p){return p.id===a.personnelId;});if(!person)throw new Error('Data personil tidak ditemukan.');var turnover=Math.max(0,Number(payload.turnover)||0),percentage=Math.min(100,Math.max(0,Number(payload.percentage)||0)),income=Math.round(turnover*percentage/100),amount=turnover-income;var dep={id:Utilities.getUuid(),personnelId:person.id,date:String(payload.date||today_()),turnover:turnover,percentage:percentage,income:income,amount:amount,status:'menunggu',createdAt:new Date().toISOString()};s.deposits.push(dep);saveState_(s);return {ok:true,state:stateForRole_(s,a),deposit:dep};} function personnelLogout(token){var a=session_(token);if(a.role==='personnel'){var s=cleanState_(),p=s.personnel.find(function(x){return x.id===a.personnelId;});if(p)p.active=false;saveState_(s);}PropertiesService.getScriptProperties().deleteProperty('SESS_'+token);CacheService.getScriptCache().remove('sess_'+token);return {ok:true};} function today_(){return Utilities.formatDate(new Date(),'Asia/Jakarta','yyyy-MM-dd');}";

function hasGas(){return typeof google!=='undefined'&&google.script&&google.script.run}

function rupiah(v){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v)||0)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function demoState(){return {settings:{outletName:'JM Operasional',cloudUrl:'',maxBalance:5000000,daysWithoutDeposit:2,visibleMenus:{overview:true,tasks:true,items:true,personnel:true,reports:true}},items:[{id:'it1',name:'Kopi Susu',price:12000},{id:'it2',name:'Teh Lemon',price:8000},{id:'it3',name:'Air Mineral',price:4000},{id:'it4',name:'Roti Cokelat',price:10000}],personnel:[{id:'p1',name:'Andi Pratama',phone:'081234567890',address:'Surabaya',stall:'Lapak Utama',category:'umum',uplineId:'',activationCode:'JM-AND-001',openingBalance:150000,active:false,lastLoginAt:'',createdAt:new Date().toISOString()},{id:'p2',name:'Sari Wulandari',phone:'081298765432',address:'Sidoarjo',stall:'Lapak Selatan',category:'upline',uplineId:'',activationCode:'JM-SAR-002',openingBalance:250000,active:false,lastLoginAt:'',createdAt:new Date().toISOString()},{id:'p3',name:'Bima Saputra',phone:'081377733322',address:'Gresik',stall:'Lapak Pasar',category:'downline',uplineId:'p2',activationCode:'JM-BIM-003',openingBalance:100000,active:false,lastLoginAt:'',createdAt:new Date().toISOString()}],orders:[{id:'o1',personnelId:'p1',date:todayWIB(),items:[{itemId:'it1',name:'Kopi Susu',price:12000,qty:5,subtotal:60000},{itemId:'it2',name:'Teh Lemon',price:8000,qty:3,subtotal:24000}],total:84000,status:'masuk',createdAt:new Date().toISOString()},{id:'o2',personnelId:'p2',date:todayWIB(),items:[{itemId:'it3',name:'Air Mineral',price:4000,qty:20,subtotal:80000}],total:80000,status:'selesai',createdAt:new Date().toISOString()}],deposits:[{id:'d1',personnelId:'p1',date:todayWIB(),turnover:200000,percentage:20,income:40000,amount:160000,status:'menunggu',createdAt:new Date().toISOString()},{id:'d2',personnelId:'p2',date:todayWIB(),turnover:350000,percentage:20,income:70000,amount:280000,status:'diterima',createdAt:new Date().toISOString()}]}}
function loadLocal(){try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}const d=demoState();localStorage.setItem(KEY,JSON.stringify(d));return d}
state=loadLocal();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));if('BroadcastChannel'in window){const ch=new BroadcastChannel('jm-operasional-sync');ch.postMessage({type:'update',at:Date.now()});ch.close()}}catch(e){toast('Penyimpanan lokal penuh atau tidak diizinkan.','bad')}}
function persistSession(){if(!currentUser)return;try{localStorage.setItem(SESSION_KEY,JSON.stringify({currentUser,sessionToken,page,taskType,taskStatus}))}catch(e){try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({currentUser,sessionToken,page,taskType,taskStatus}))}catch(_){}}}
function clearPersistedSession(){try{localStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(SESSION_KEY)}catch(e){}}
function getRememberedLogin(){try{return JSON.parse(localStorage.getItem(LAST_LOGIN_KEY)||'{}')}catch(e){return {}}}
function storeRememberedLogin(role,value,enabled){try{const saved=getRememberedLogin();if(enabled){if(role==='admin')saved.adminUsername=String(value||'admin').trim();else saved.personnelCode=String(value||'').trim().toUpperCase()}else{if(role==='admin')delete saved.adminUsername;else delete saved.personnelCode}localStorage.setItem(LAST_LOGIN_KEY,JSON.stringify(saved))}catch(e){}}
async function restoreSession(){let saved=null;try{saved=JSON.parse(localStorage.getItem(SESSION_KEY)||sessionStorage.getItem(SESSION_KEY)||'null');if(saved&&!localStorage.getItem(SESSION_KEY))localStorage.setItem(SESSION_KEY,JSON.stringify(saved))}catch(e){}if(!saved||!saved.currentUser){render();return}currentUser=saved.currentUser;sessionToken=saved.sessionToken||'';page=saved.page||'overview';taskType=saved.taskType||'orders';taskStatus=saved.taskStatus||(taskType==='orders'?'masuk':'menunggu');if(!hasGas()){state=loadLocal();if(currentUser.role==='personnel'&&!state.personnel.some(p=>p.id===currentUser.id)){clearPersistedSession();currentUser=null;sessionToken='';render();return}render();return}try{if(!sessionToken)throw new Error('Sesi berakhir');const r=await gasCall('getAppState',sessionToken);state=r.state||state;if(r.role==='admin'){currentUser={role:'admin',name:saved.currentUser.name||'Admin'};if(!['overview','tasks','items','personnel','reports','settings'].includes(page))page='overview'}else{const pid=r.personnelId||saved.currentUser.id;const person=state.personnel.find(p=>p.id===pid);if(!person)throw new Error('Profil personil tidak ditemukan');currentUser={role:'personnel',id:pid,name:person.name};if(!['overview','order','deposit'].includes(page))page='overview'}lastCloudPull=Date.now();persistSession();render()}catch(e){clearPersistedSession();currentUser=null;sessionToken='';page='overview';render();toast('Sesi masuk telah berakhir. Silakan login kembali.','bad')}}
window.addEventListener('storage',e=>{if(e.key===KEY){try{state=JSON.parse(e.newValue);render()}catch(_){}}});
if('BroadcastChannel'in window){try{const ch=new BroadcastChannel('jm-operasional-sync');ch.onmessage=e=>{if(e.data&&e.data.type==='update'&&!hasGas()){state=loadLocal();render()}}}catch(e){}}
function balances(p){const orders=state.orders.filter(o=>o.personnelId===p.id).reduce((n,o)=>n+(Number(o.total)||0),0);const deposits=state.deposits.filter(d=>d.personnelId===p.id).reduce((n,d)=>n+(Number(d.amount)||0),0);return Number(p.openingBalance||0)+orders-deposits}
function personName(pid){return state.personnel.find(p=>p.id===pid)?.name||'Personil dihapus'}
function sumOrders(arr=state.orders){return arr.reduce((n,o)=>n+(Number(o.total)||0),0)}
function sumDeposits(arr=state.deposits){return arr.reduce((n,d)=>n+(Number(d.amount)||0),0)}
function isLate(p){const ds=state.deposits.filter(d=>d.personnelId===p.id).map(d=>d.date).sort().reverse();const last=ds[0]||p.createdAt?.slice(0,10)||todayWIB();const age=Math.floor((new Date(todayWIB()+'T12:00:00')-new Date(last+'T12:00:00'))/86400000);return age>Number(state.settings.daysWithoutDeposit||0)}
function notices(){return {late:state.personnel.filter(isLate).length,over:state.personnel.filter(p=>balances(p)>Number(state.settings.maxBalance||Infinity)).length,tasks:state.orders.filter(o=>o.status==='masuk').length+state.deposits.filter(d=>d.status==='menunggu').length,active:state.personnel.filter(p=>p.active).length}}
function toast(msg,type='ok'){const root=document.getElementById('toastRoot');const el=document.createElement('div');el.className='toast'+(type==='bad'?' bad':'');el.textContent=msg;root.appendChild(el);setTimeout(()=>el.remove(),3300)}
async function syncSave(){if(hasGas()){if(!sessionToken)throw new Error('Sesi cloud hilang. Silakan login kembali.');const r=await gasCall('adminSaveState',sessionToken,state);if(r.state)state=r.state;return r}else{saveLocal();return {ok:true}}}
async function cloudRefresh(){if(!hasGas()||!sessionToken)return;const r=await gasCall('getAppState',sessionToken);lastCloudPull=Date.now();if(r.state)state=r.state;if(r.webAppUrl){state.settings.cloudUrl=state.settings.cloudUrl||r.webAppUrl}render()}
function render(){if(!currentUser){renderLogin();return}persistSession();renderApp()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&hasGas()&&sessionToken&&currentUser&&Date.now()-lastCloudPull>15000&&!document.querySelector('.modal-backdrop')){lastCloudPull=Date.now();cloudRefresh().catch(()=>{})}});
function renderLogin(){document.body.classList.add('login-screen-active');document.getElementById('app').innerHTML=`<div class="login-page"><div class="login-fire-wallpaper" aria-hidden="true"></div><section class="login-fire-stage"><div class="login-fire-haze" aria-hidden="true"></div><div class="login-logo-wrap"><img class="login-logo" src="${JM_LOGO_DATA}" alt="Logo JM Jaya Mulya Kaum Tertindas"></div><div class="login-system-label">SISTEM MANAJEMEN OPERASIONAL</div><div class="login-switch login-role-tabs"><button type="button" onclick="setAuthMode('admin')"><span class="role-tab-icon">👑</span><span>ADMIN</span></button><button type="button" onclick="setAuthMode('personnel')"><span class="role-tab-icon">🧑‍💼</span><span>PERSONIL</span></button></div><div class="login-mode-pill"><span class="dot"></span>${hasGas()?'CLOUD AKTIF':'MODE LOKAL'}</div><div class="login-footer login-fire-footer">JM OPERASIONAL · AKSES BERDASARKAN PERAN</div></section></div>`;if(new URLSearchParams(window.location.search).get('role')==='personnel'){setTimeout(()=>openLoginModal('personnel'),80)}}
function setAuthMode(m){authMode=m;openLoginModal(m)}
function openLoginModal(mode){authMode=mode;const remembered=getRememberedLogin();const body=mode==='admin'?`<form autocomplete="on" onsubmit="loginAdmin(event)"><div class="field"><label>Username admin</label><input id="loginUser" name="username" autocomplete="username" value="${esc(remembered.adminUsername||'admin')}" required></div><div class="field"><label>Sandi admin</label><input id="loginPass" name="password" type="password" autocomplete="current-password" placeholder="Masukkan sandi" required></div><label class="remember-line"><input id="rememberLogin" type="checkbox" checked><span>Ingat akun di perangkat ini</span></label><div class="remember-note">Sesi login dipertahankan di perangkat ini. Sandi dapat disimpan oleh pengelola sandi browser.</div><button class="btn btn-primary" type="submit">Masuk ke dashboard <span>→</span></button></form>`:`<form autocomplete="on" onsubmit="loginPersonnel(event)"><div class="field"><label>Kode aktivasi personil</label><input id="loginCode" name="username" autocomplete="username" value="${esc(remembered.personnelCode||'')}" placeholder="Contoh: JM-AND-001" style="text-transform:uppercase" required></div><label class="remember-line"><input id="rememberLogin" type="checkbox" checked><span>Ingat akun di perangkat ini</span></label><div class="remember-note">Kode aktivasi akan diingat pada perangkat ini; sesi login dipertahankan sampai keluar atau kedaluwarsa.</div><button class="btn btn-primary" type="submit">Masuk sebagai personil <span>→</span></button></form>`;openModal(mode==='admin'?'Login Admin':'Login Personil',body);const modal=document.querySelector('#modalRoot .modal');if(modal)modal.classList.add('login-access-modal');setTimeout(()=>document.getElementById(mode==='admin'?'loginUser':'loginCode')?.focus(),60)}
async function loginAdmin(e){e.preventDefault();const username=document.getElementById('loginUser').value,pass=document.getElementById('loginPass').value,remember=document.getElementById('rememberLogin')?.checked!==false;try{if(hasGas()){const r=await gasCall('authAdmin',username,pass);if(!r.ok){toast(r.message||'Gagal masuk.','bad');return}sessionToken=r.token;currentUser={role:'admin',name:'Admin'};state=r.state;mustChange=!!r.mustChangePassword;const bi=await gasCall('getBootInfo');if(bi.webAppUrl&&!state.settings.cloudUrl)state.settings.cloudUrl=bi.webAppUrl;await gasCall('adminSaveState',sessionToken,state);storeRememberedLogin('admin',username,remember);page='overview';persistSession();closeModal();render();if(mustChange){toast('Demi keamanan, ubah sandi admin bawaan.');openSettingModal('password',true,pass)}else toast('Login admin berhasil.')}else{if(username.trim().toLowerCase()!=='admin'||pass!==(state.settings.adminPassword||'admin123')){toast('Username atau sandi salah.','bad');return}currentUser={role:'admin',name:'Admin'};storeRememberedLogin('admin',username,remember);page='overview';saveLocal();persistSession();closeModal();render();toast('Selamat datang, Admin.')}}catch(err){toast(err.message||'Login gagal.','bad')}}
async function loginPersonnel(e){e.preventDefault();const code=document.getElementById('loginCode').value.trim().toUpperCase(),remember=document.getElementById('rememberLogin')?.checked!==false;try{if(hasGas()){const r=await gasCall('authPersonnel',code);if(!r.ok){toast(r.message||'Kode aktivasi tidak valid.','bad');return}sessionToken=r.token;state=r.state;const p=state.personnel.find(x=>x.id===r.personnelId)||state.personnel.find(x=>x.activationCode===code);currentUser={role:'personnel',id:r.personnelId||p?.id,name:p?.name||'Personil'};storeRememberedLogin('personnel',code,remember);page='overview';persistSession();closeModal();render();showPersonnelAlerts()}else{const p=state.personnel.find(x=>String(x.activationCode).toUpperCase()===code);if(!p){toast('Kode aktivasi tidak ditemukan.','bad');return}p.active=true;p.lastLoginAt=new Date().toISOString();currentUser={role:'personnel',id:p.id,name:p.name};storeRememberedLogin('personnel',code,remember);page='overview';saveLocal();persistSession();closeModal();render();showPersonnelAlerts();toast('Login personil berhasil.')}}catch(err){toast(err.message||'Login gagal.','bad')}}
function showPersonnelAlerts(){const p=currentPerson();if(!p)return;const arr=[];if(balances(p)>Number(state.settings.maxBalance||Infinity))arr.push('⚠️ Saldo Anda melewati batas yang ditentukan admin: '+rupiah(balances(p))+'.');if(isLate(p))arr.push('⏰ Anda belum setor sesuai batas waktu. Silakan periksa menu Setor.');if(arr.length)setTimeout(()=>openModal('Peringatan personil',`<div class="danger-box">${arr.map(esc).join('<br><br>')}</div><div class="form-actions"><button class="btn btn-primary" onclick="closeModal()">Saya mengerti</button></div>`),220)}
function currentPerson(){return state.personnel.find(p=>p.id===currentUser?.id)}
async function logout(){try{if(hasGas()&&sessionToken)await gasCall('personnelLogout',sessionToken)}catch(e){}if(currentUser?.role==='personnel'){const p=state.personnel.find(x=>x.id===currentUser.id);if(p)p.active=false;if(!hasGas())saveLocal()}clearPersistedSession();sessionToken='';currentUser=null;page='overview';renderLogin();toast('Anda telah keluar.')}
function renderApp(){document.body.classList.remove('login-screen-active');const admin=currentUser.role==='admin';const subtitle=admin?'Panel pengelolaan outlet':'Ruang kerja personil';const p=currentPerson();const title=admin?(pageTitle(page)):(page==='overview'?'Ringkasan saldo':page==='order'?'Order barang':'Setor penjualan');const menus=admin?[['overview','RINGKASAN','◈'],['tasks','TUGAS','📋'],['items','ITEM','📦'],['personnel','PERSONIL','🧑‍🤝‍🧑'],['reports','LAPORAN','📈'],['settings','PENGATURAN','⚙️']].filter(m=>m[0]==='settings'||state.settings.visibleMenus?.[m[0]]!==false):[['overview','RINGKASAN','◈'],['order','ORDER','🛒'],['deposit','SETOR','💸']];const n=notices();document.getElementById('app').innerHTML=`<div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark"><img src="${JM_LOGO_DATA}" alt="Logo JM"></div><div><div class="brand-name">${esc(state.settings.outletName||'JM Operasional')}</div><div class="brand-sub">OPERASIONAL · ${admin?'ADMIN':'PERSONIL'}</div></div></div><div class="top-actions"><div class="pill"><span class="dot"></span> ${hasGas()?'CLOUD':'MODE LOKAL'}</div><div class="user-chip"><div class="avatar">${admin?'👑':'🧑‍💼'}</div><div><b>${esc(currentUser.name)}</b><small>${admin?'Pengelola':'Personil outlet'}</small></div></div><button class="icon-btn logout-btn" title="Keluar" aria-label="Keluar dari aplikasi" onclick="logout()"><svg class="logout-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path></svg></button></div></header><div class="welcome"><div><h1>${title}</h1><p>${subtitle} · ${admin?'Pantau aktivitas dan proses transaksi.':'Kelola saldo, order barang, dan setor Anda.'}</p></div><div class="date-chip">📅 ${fmtDate(todayWIB())} · ${fmtClockWIB()}</div></div><main class="main-content">${admin?renderAdminPage():renderPersonnelPage()}</main></div><nav class="bottom-nav ${admin?'admin-nav':'personnel-nav'}"><div class="nav-inner">${menus.map(m=>`<button data-page="${m[0]}" class="nav-item ${page===m[0]?'active':''}" onclick="setPage('${m[0]}')"><span class="nav-icon">${m[2]}</span><span class="nav-label">${m[1]}</span>${admin&&m[0]==='tasks'&&n.tasks?`<span class="nav-badge">${n.tasks}</span>`:''}</button>`).join('')}</div></nav>`;scheduleWIBDayRollover()}
function pageTitle(p){return ({overview:'Ringkasan operasional',tasks:'Tugas masuk',items:'Daftar item',personnel:'Manajemen personil',reports:'Laporan transaksi',settings:'Pengaturan aplikasi'})[p]||'Ringkasan operasional'}
function setPage(p){page=p;persistSession();render();window.scrollTo({top:0,behavior:'smooth'})}
function renderAdminPage(){switch(page){case'overview':return renderAdminOverview();case'tasks':return renderTasks();case'items':return renderItems();case'personnel':return renderPersonnel();case'reports':return renderReports();case'settings':return renderSettings();default:return renderAdminOverview()}}
function renderAdminOverview(){const n=notices(),today=todayWIB(),todayOrders=state.orders.filter(o=>String(o.date||'').slice(0,10)===today),todayDeposits=state.deposits.filter(d=>String(d.date||'').slice(0,10)===today);const orderTotal=sumOrders(todayOrders),depositTotal=sumDeposits(todayDeposits),balanceTotal=state.personnel.reduce((s,p)=>s+balances(p),0);return `<div class="metric-grid"><button class="metric primary" onclick="openMetric('balance')"><div class="metric-top"><span class="metric-label">Saldo semua personil</span><span class="metric-emoji">💎</span></div><div class="metric-value">${rupiah(balanceTotal)}</div><div class="metric-foot">Akumulasi saldo akhir seluruh personil · Klik untuk detail</div></button><button class="metric" onclick="openMetric('orders')"><div class="metric-top"><span class="metric-label">Total order hari ini</span><span class="metric-emoji">📦</span></div><div class="metric-value">${rupiah(orderTotal)}</div><div class="metric-foot">${todayOrders.length} transaksi · ${fmtDate(today)} WIB · klik untuk detail</div></button><button class="metric" onclick="openMetric('deposits')"><div class="metric-top"><span class="metric-label">Total setor hari ini</span><span class="metric-emoji">💸</span></div><div class="metric-value">${rupiah(depositTotal)}</div><div class="metric-foot">${todayDeposits.length} transaksi · ${fmtDate(today)} WIB · klik untuk detail</div></button></div><div class="notify-title"><span class="icon-3d">🔔</span><div><h3>Notifikasi</h3><span>Perlu perhatian dari admin</span></div></div><div class="notify-grid"><button class="notice alert" onclick="openNotice('late')"><span class="icon-3d">⏰</span><span class="notice-main"><p class="notice-title">Peringatan tidak setor</p><div class="notice-sub">Melewati batas waktu</div></span><span class="notice-count">${n.late}</span></button><button class="notice alert" onclick="openNotice('over')"><span class="icon-3d">⚠️</span><span class="notice-main"><p class="notice-title">Saldo melebihi batas</p><div class="notice-sub">Periksa saldo personil</div></span><span class="notice-count">${n.over}</span></button><button class="notice" onclick="setPage('tasks')"><span class="icon-3d">📋</span><span class="notice-main"><p class="notice-title">Tugas masuk</p><div class="notice-sub">Order & setor menunggu</div></span><span class="notice-count">${n.tasks}</span></button><button class="notice ok" onclick="openNotice('active')"><span class="icon-3d">🟢</span><span class="notice-main"><p class="notice-title">Personil aktif</p><div class="notice-sub">Sedang login di aplikasi</div></span><span class="notice-count">${n.active}</span></button></div>`}
function recentActivity(){const arr=[...state.orders.map(x=>({...x,type:'order'})),...state.deposits.map(x=>({...x,type:'deposit'}))].sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date))).slice(0,4);if(!arr.length)return emptyBlock('🪄','Belum ada aktivitas','Order dan setor yang masuk akan tampil di sini.');return `<div class="list-grid">${arr.map(x=>`<div class="data-card"><div class="card-top"><span class="card-icon">${x.type==='order'?'📦':'💸'}</span><div style="flex:1"><div class="card-title">${x.type==='order'?'Order':'Setor'} · ${esc(personName(x.personnelId))}</div><div class="card-meta">${fmtDate(x.date)} · #${esc(String(x.id).slice(-6))}</div></div><span class="status ${x.status==='diterima'||x.status==='selesai'?'green':'blue'}">${x.status==='masuk'?'Cek out':x.status==='menunggu'?'Menunggu':x.status==='selesai'?'Selesai':'Diterima'}</span></div><div class="card-total">${rupiah(x.type==='order'?x.total:x.amount)}</div></div>`).join('')}</div>`}
function renderTasks(){const orderMode=taskType==='orders';const arr=orderMode?state.orders.filter(x=>x.status===taskStatus):state.deposits.filter(x=>x.status===taskStatus);const orderWaiting=state.orders.filter(x=>x.status==='masuk').length,depositWaiting=state.deposits.filter(x=>x.status==='menunggu').length;const cardsHTML=arr.map(x=>orderMode?orderCard(x,taskStatus==='masuk'):depositCard(x,taskStatus==='menunggu')).join('');return `<div class="section-head"><div><div class="eyebrow">WORKFLOW</div><h2>Proses transaksi masuk</h2><p>Periksa, ubah, terima, atau selesaikan transaksi personil.</p></div></div><div class="tabs task-tabs"><button class="tab ${orderMode?'active':''}" onclick="setTaskType('orders')"><span>📦 Order masuk</span><b class="task-count">${orderWaiting}</b></button><button class="tab ${!orderMode?'active':''}" onclick="setTaskType('deposits')"><span>💸 Setor masuk</span><b class="task-count">${depositWaiting}</b></button></div>${orderMode?`<div class="subtabs task-subtabs"><button class="subtab ${taskStatus==='masuk'?'active':''}" onclick="setTaskStatus('masuk')">Cek out <b>${state.orders.filter(x=>x.status==='masuk').length}</b></button><button class="subtab ${taskStatus==='selesai'?'active':''}" onclick="setTaskStatus('selesai')">Selesai</button></div>`:`<div class="subtabs task-subtabs"><button class="subtab ${taskStatus==='menunggu'?'active':''}" onclick="setTaskStatus('menunggu')">Menunggu diterima <b>${state.deposits.filter(x=>x.status==='menunggu').length}</b></button><button class="subtab ${taskStatus==='diterima'?'active':''}" onclick="setTaskStatus('diterima')">Sudah diterima</button></div>`}${arr.length?`<div class="task-person-cards task-person-cards-flat">${cardsHTML}</div>`:emptyBlock(orderMode?'📦':'💸',orderMode?'Tidak ada order di tab ini':'Tidak ada setor di tab ini','Transaksi baru dari personil akan tampil di sini.')}`}
function setTaskType(t){taskType=t;taskStatus=t==='orders'?'masuk':'menunggu';persistSession();render()}
function setTaskStatus(s){taskStatus=s;persistSession();render()}
function orderCard(o,canComplete){return `<article class="data-card task-order-card"><div class="card-top task-compact-head"><div class="task-card-heading"><div class="card-title task-order-date">${fmtDate(o.date)}</div><div class="card-meta task-person-name">${esc(personName(o.personnelId))}</div><div class="task-order-amount"><span>Total order</span><b>${rupiah(o.total)}</b></div></div></div><div class="task-order-actions"><button class="btn btn-soft task-icon-action" title="Detail dan edit order" aria-label="Detail dan edit order" onclick="event.stopPropagation();openOrderModal('${o.id}')">✏️</button><button class="btn btn-ghost task-icon-action" title="Bagikan nota" aria-label="Bagikan nota" onclick="event.stopPropagation();shareRecord('order','${o.id}')">↗️</button>${canComplete?`<button class="btn btn-green task-icon-action" title="Tandai selesai" aria-label="Tandai selesai" onclick="event.stopPropagation();completeOrder('${o.id}')">✓</button>`:''}<button class="btn btn-ghost task-icon-action" title="Cetak nota" aria-label="Cetak nota" onclick="event.stopPropagation();printRecord('order','${o.id}')">🖨️</button><button class="btn btn-danger task-icon-action" title="Hapus order" aria-label="Hapus order" onclick="event.stopPropagation();deleteRecord('order','${o.id}')">🗑️</button></div></article>`}
function depositCard(d,waiting){return `<article class="data-card deposit-task-card"><div class="card-top task-compact-head"><div class="task-card-heading"><div class="card-title task-order-date">${fmtDate(d.date)}</div><div class="card-meta task-person-name">${esc(personName(d.personnelId))}</div></div></div><div class="deposit-card-summary"><div class="deposit-card-total"><span>Total setor</span><b>${rupiah(d.amount)}</b></div><div class="deposit-card-mini"><span>Omset</span><b>${rupiah(d.turnover)}</b></div><div class="deposit-card-mini"><span>Penghasilan (${d.percentage}%)</span><b>${rupiah(d.income)}</b></div></div><div class="deposit-task-actions"><button class="btn btn-soft task-icon-action" title="Detail dan edit setor" aria-label="Detail dan edit setor" onclick="event.stopPropagation();openDepositModal('${d.id}')">✏️</button><button class="btn btn-ghost task-icon-action" title="Bagikan nota setor" aria-label="Bagikan nota setor" onclick="event.stopPropagation();shareRecord('deposit','${d.id}')">↗️</button>${waiting?`<button class="btn btn-green task-icon-action" title="Terima setor" aria-label="Terima setor" onclick="event.stopPropagation();acceptDeposit('${d.id}')">✓</button>`:`<button class="btn btn-danger task-icon-action" title="Hapus setor" aria-label="Hapus setor" onclick="event.stopPropagation();deleteRecord('deposit','${d.id}')">🗑️</button>`}</div></article>`}
function renderItems(){return `<div class="section-head"><div><div class="eyebrow">INVENTORY</div><h2>Item / barang</h2><p>Atur daftar barang dan harga order personil.</p></div><button class="btn btn-primary" onclick="openItemModal()">＋ Tambah item</button></div>${state.items.length?`<div class="list-grid item-grid">${state.items.map(i=>`<article class="data-card item-card"><div class="card-top item-card-head"><span class="card-icon">📦</span><div class="item-card-main"><div class="card-title item-name">${esc(i.name)}</div><div class="card-total item-price">${rupiah(i.price)}</div></div></div><div class="item-card-actions"><button class="btn btn-soft btn-xs" onclick="openItemModal('${i.id}')">✏️ Edit</button><button class="btn btn-danger btn-xs" onclick="deleteRecord('item','${i.id}')">Hapus</button></div></article>`).join('')}</div>`:emptyBlock('📦','Daftar item masih kosong','Tambahkan item pertama untuk mulai menerima order.')}`}
function renderPersonnel(){const q=String(personnelSearch||'').trim().toLowerCase();const maxBalance=Number(state.settings.maxBalance)||0;const orderedPersonnel=[...state.personnel].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'id',{sensitivity:'base'}));const filtered=orderedPersonnel.filter(p=>[p.name,p.phone,p.address,p.stall,p.category,p.activationCode,p.uplineId?personName(p.uplineId):''].filter(Boolean).join(' ').toLowerCase().includes(q));return `<div class="section-head"><div><div class="eyebrow">TEAM</div><h2>Personil outlet</h2><p>${state.personnel.length} personil terdaftar</p></div><button class="btn btn-primary" onclick="openPersonModal()">＋ Personil</button></div><div class="personnel-search"><span>🔎</span><input id="personnelSearchInput" type="search" value="${esc(personnelSearch)}" placeholder="Cari nama, lapak, kategori, atau kode aktivasi..." autocomplete="off" oninput="filterPersonnelCards(this.value)"><button type="button" class="search-clear ${q?'':'hidden'}" onclick="clearPersonnelSearch()" aria-label="Hapus pencarian">×</button></div><div id="personnelSearchCount" class="search-count">Menampilkan ${filtered.length} dari ${state.personnel.length} personil</div>${state.personnel.length?`<div class="list-grid personnel-grid" id="personnelListGrid">${orderedPersonnel.map(p=>`<article class="data-card clickable personnel-card ${maxBalance>0&&balances(p)>maxBalance?'over-limit':''} ${[p.name,p.phone,p.address,p.stall,p.category,p.activationCode,p.uplineId?personName(p.uplineId):''].filter(Boolean).join(' ').toLowerCase().includes(q)?'':'hidden'}" data-personnel-search="${esc([p.name,p.phone,p.address,p.stall,p.category,p.activationCode,p.uplineId?personName(p.uplineId):''].filter(Boolean).join(' ').toLowerCase())}" onclick="openPersonDetail('${p.id}')"><div class="card-top"><span class="card-icon">${p.category==='downline'?'🧑‍🤝‍🧑':p.category==='upline'?'🧑‍💼':'👤'}</span><div style="flex:1;min-width:0"><div class="card-title">${esc(p.name)}</div><div class="card-meta">${esc(p.stall||'Lapak belum diisi')} · ${esc(p.category||'umum')}</div></div><span class="status ${p.active?'green':'blue'}">${p.active?'Aktif':'Offline'}</span></div><div class="personnel-balance ${maxBalance>0&&balances(p)>maxBalance?'limit-exceeded':''}"><span>Saldo akhir</span><b>${rupiah(balances(p))}</b></div>${maxBalance>0&&balances(p)>maxBalance?'<div class="personnel-limit-warning">⚠️ Saldo akhir melewati batas admin</div>':''}<div class="card-footer" onclick="event.stopPropagation()"><button class="btn btn-primary btn-xs" onclick="openPersonModal('${p.id}')">✏️ Edit</button><button class="btn btn-ghost btn-xs" onclick="copyText('${esc(p.activationCode)}','Kode aktivasi disalin')">▣ Copy kode</button><button class="btn btn-danger btn-xs" onclick="deleteRecord('person','${p.id}')">Hapus</button></div></article>`).join('')}</div><div id="personnelSearchEmpty" class="empty ${filtered.length?'hidden':''}"><span class="big">🔎</span><b>Personil tidak ditemukan</b><span>Coba kata kunci nama, lapak, atau kode aktivasi lain.</span></div>`:emptyBlock('🧑‍🤝‍🧑','Belum ada personil','Tambahkan personil dan buat kode aktivasi untuk login.')}`}
function filterPersonnelCards(value){personnelSearch=String(value||'');const q=personnelSearch.trim().toLowerCase();let shown=0;document.querySelectorAll('.personnel-card').forEach(card=>{const match=(card.dataset.personnelSearch||'').includes(q);card.classList.toggle('hidden',!match);if(match)shown++});const total=state.personnel.length;const count=document.getElementById('personnelSearchCount');if(count)count.textContent=`Menampilkan ${shown} dari ${total} personil`;const empty=document.getElementById('personnelSearchEmpty');if(empty)empty.classList.toggle('hidden',shown>0);const clear=document.querySelector('.search-clear');if(clear)clear.classList.toggle('hidden',!q)}
function clearPersonnelSearch(){personnelSearch='';const input=document.getElementById('personnelSearchInput');if(input){input.value='';input.focus()}filterPersonnelCards('')}
function renderReports(){const filteredOrders=state.orders.filter(x=>(!reportFrom||x.date>=reportFrom)&&(!reportTo||x.date<=reportTo)&&(reportPerson==='all'||x.personnelId===reportPerson));const filteredDeps=state.deposits.filter(x=>(!reportFrom||x.date>=reportFrom)&&(!reportTo||x.date<=reportTo)&&(reportPerson==='all'||x.personnelId===reportPerson));return `<div class="section-head"><div><div class="eyebrow">ANALYTICS</div><h2>Laporan transaksi</h2><p>Ringkas order dan setor berdasarkan periode dan personil.</p></div><button class="btn btn-soft" onclick="exportReport()">⇩ Export CSV</button></div><div class="panel"><div class="report-filters"><div class="field"><label>Dari tanggal</label><input type="date" value="${reportFrom}" onchange="reportFrom=this.value;render()"></div><div class="field"><label>Sampai tanggal</label><input type="date" value="${reportTo}" onchange="reportTo=this.value;render()"></div><div class="field"><label>Personil</label><select onchange="reportPerson=this.value;render()"><option value="all">Semua personil</option>${state.personnel.map(p=>`<option value="${p.id}" ${reportPerson===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><button class="btn btn-primary" onclick="render()">Terapkan</button></div><div class="total-strip"><div class="total-mini"><span>Akumulasi order (${filteredOrders.length})</span><b>${rupiah(sumOrders(filteredOrders))}</b></div><div class="total-mini"><span>Akumulasi setor (${filteredDeps.length})</span><b>${rupiah(sumDeposits(filteredDeps))}</b></div></div></div><div class="panel"><div class="panel-title"><h3>Order</h3><small>${filteredOrders.length} transaksi</small></div>${filteredOrders.length?`<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Personil</th><th>Item</th><th>Status</th><th>Total</th></tr></thead><tbody>${filteredOrders.map(o=>`<tr><td>${fmtDate(o.date)}</td><td>${esc(personName(o.personnelId))}</td><td>${(o.items||[]).map(i=>esc(i.name)+' × '+i.qty).join(', ')}</td><td>${o.status==='selesai'?'Selesai':'Cek out'}</td><td><b>${rupiah(o.total)}</b></td></tr>`).join('')}</tbody></table></div>`:emptyBlock('📦','Tidak ada order pada periode ini','Ubah filter tanggal atau personil.')}</div><div class="panel"><div class="panel-title"><h3>Setor</h3><small>${filteredDeps.length} transaksi</small></div>${filteredDeps.length?`<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Personil</th><th>Omset</th><th>Penghasilan</th><th>Setor</th><th>Status</th></tr></thead><tbody>${filteredDeps.map(d=>`<tr><td>${fmtDate(d.date)}</td><td>${esc(personName(d.personnelId))}</td><td>${rupiah(d.turnover)}</td><td>${rupiah(d.income)}</td><td><b>${rupiah(d.amount)}</b></td><td>${d.status==='diterima'?'Diterima':'Menunggu'}</td></tr>`).join('')}</tbody></table></div>`:emptyBlock('💸','Tidak ada setor pada periode ini','Ubah filter tanggal atau personil.')}</div>`}
function renderSettings(){return `<div class="section-head"><div><div class="eyebrow">PREFERENCES</div><h2>Pengaturan aplikasi</h2><p>Setiap kartu membuka panel pengaturan sesuai fungsinya.</p></div></div><div class="settings-grid"><button class="setting-card" onclick="openSettingModal('outlet')"><span class="icon-3d">🏪</span><span><b>Pengaturan outlet</b><small>Nama outlet dan identitas aplikasi</small></span><span class="setting-arrow">›</span></button><button class="setting-card" onclick="openSettingModal('cloud')"><span class="icon-3d">☁️</span><span><b>Cloud & backup</b><small>URL Web App, tes/kirim/tarik cloud, JSON</small></span><span class="setting-arrow">›</span></button><button class="setting-card" onclick="openSettingModal('navigation')"><span class="icon-3d">🧭</span><span><b>Navigasi menu</b><small>Pilih menu admin yang ditampilkan</small></span><span class="setting-arrow">›</span></button><button class="setting-card" onclick="openSettingModal('limits')"><span class="icon-3d">🚦</span><span><b>Batas personil</b><small>Batas saldo akhir dan waktu setor</small></span><span class="setting-arrow">›</span></button><button class="setting-card" onclick="openSettingModal('password')"><span class="icon-3d">🔐</span><span><b>Ubah sandi admin</b><small>Ganti sandi masuk panel admin</small></span><span class="setting-arrow">›</span></button><button class="setting-card" onclick="openModal('Info aplikasi',infoHTML())"><span class="icon-3d">✨</span><span><b>Info aplikasi</b><small>Mode penyimpanan dan versi aplikasi</small></span><span class="setting-arrow">›</span></button></div><div class="panel"><div class="panel-title"><h3>Status sistem</h3><span class="status ${hasGas()?'green':'blue'}">${hasGas()?'Cloud terpasang':'Mode lokal'}</span></div><div class="card-meta" style="line-height:1.8">${hasGas()?'Data utama disimpan melalui Google Apps Script ke Google Sheets. Perubahan cloud diproses saat ada aksi pengguna.':'Demo berjalan dengan localStorage di browser ini. Gunakan Apps Script untuk penyimpanan lintas perangkat.'}<br>Sinkronisasi push real-time lintas perangkat membutuhkan layanan realtime tambahan; Apps Script sendiri tidak menyediakan koneksi push ke browser.</div></div>`}
function renderPersonnelPage(){const p=currentPerson();if(!p)return emptyBlock('👤','Profil tidak ditemukan','Silakan keluar lalu login kembali.');switch(page){case'overview':return renderPersonOverview(p);case'order':return renderPersonOrder(p);case'deposit':return renderPersonDeposit(p);default:return renderPersonOverview(p)}}
function renderPersonOverview(p){const oo=state.orders.filter(o=>o.personnelId===p.id),dd=state.deposits.filter(d=>d.personnelId===p.id);const late=isLate(p),over=balances(p)>Number(state.settings.maxBalance||Infinity),ordersProcess=oo.filter(o=>o.status!=='selesai').length,ordersDone=oo.filter(o=>o.status==='selesai').length,depositsProcess=dd.filter(d=>d.status!=='diterima').length,depositsDone=dd.filter(d=>d.status==='diterima').length;return `${over||late?`<div class="${over?'danger-box':'warning-box'}" style="margin-bottom:14px">${over?'⚠️ Saldo akhir melewati batas admin.':'⏰ '}${over?'Saldo Anda saat ini '+rupiah(balances(p))+'. ':''}${late?'Anda terlambat setor. Segera buka menu Setor untuk mencatat transaksi.':''}</div>`:''}<div class="person-summary-name"><span>PERSONIL</span><strong>${esc(p.name)}</strong></div><div class="balance-banner"><div class="label">💎 Saldo akhir Anda</div><div class="value">${rupiah(balances(p))}</div><div class="sub">Saldo awal ${rupiah(p.openingBalance)} + order ${rupiah(sumOrders(oo))} − setor ${rupiah(sumDeposits(dd))}</div></div><div class="person-metrics"><button class="mini-metric" onclick="openPersonMetric('orders')"><div class="top"><span>📦 Total order</span><span>↗</span></div><div class="val">${rupiah(sumOrders(oo))}</div></button><button class="mini-metric" onclick="openPersonMetric('deposits')"><div class="top"><span>💸 Total setor</span><span>↗</span></div><div class="val">${rupiah(sumDeposits(dd))}</div></button></div><div class="status-summary-grid"><button class="status-summary-card order-status-card" onclick="openPersonStatusList('orders')"><span class="status-summary-icon">📦</span><span class="status-summary-main"><b>Status Order</b><small>${oo.length} transaksi · ${ordersProcess} proses · ${ordersDone} selesai</small></span><span class="status-summary-arrow">›</span></button><button class="status-summary-card deposit-status-card" onclick="openPersonStatusList('deposits')"><span class="status-summary-icon">💸</span><span class="status-summary-main"><b>Status Setor</b><small>${dd.length} transaksi · ${depositsProcess} proses · ${depositsDone} selesai</small></span><span class="status-summary-arrow">›</span></button></div>`}
function openPersonStatusList(kind){const p=currentPerson();if(!p)return;const isOrder=kind==='orders',title=isOrder?'Status Order':'Status Setor',rows=(isOrder?state.orders:state.deposits).filter(x=>x.personnelId===p.id).sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date)));const body=rows.length?`<div class="status-detail-list">${rows.map(x=>{const done=isOrder?x.status==='selesai':x.status==='diterima';const meta=isOrder?(x.items||[]).map(i=>esc(i.name)+' × '+Number(i.qty||0)).join(', '):'Omset '+rupiah(x.turnover)+' · Penghasilan '+rupiah(x.income);return `<button type="button" class="data-card clickable status-transaction-card" onclick="openPersonTransactionDetail('${isOrder?'orders':'deposits'}','${x.id}')"><div class="card-top"><span class="card-icon">${isOrder?'📦':'💸'}</span><div style="flex:1;min-width:0"><div class="card-title">${fmtDate(x.date)}</div><div class="card-meta">${meta}</div></div><span class="status ${done?'green':'blue'}">${done?'Selesai':'Proses'}</span></div><div class="card-total">${rupiah(isOrder?x.total:x.amount)}</div><div class="status-card-tap">Ketuk untuk melihat detail ›</div></button>`}).join('')}</div>`:emptyBlock(isOrder?'📦':'💸','Belum ada transaksi',isOrder?'Order akan tampil di sini.':'Setoran akan tampil di sini.');openModal(title,body,true)}
function openPersonTransactionDetail(kind,rid){const isOrder=kind==='orders',x=(isOrder?state.orders:state.deposits).find(r=>r.id===rid);if(!x)return;const done=isOrder?x.status==='selesai':x.status==='diterima',status=`<span class="status ${done?'green':'blue'}">${done?'Selesai':'Proses'}</span>`;let body='';if(isOrder){const items=(x.items||[]).map(i=>`<div class="detail-line person-readonly-item"><span><b>${esc(i.name||'Item')}</b><small>Qty ${Number(i.qty)||0} × Harga ${rupiah(i.price)}</small></span><strong>${rupiah(i.subtotal??(Number(i.price||0)*Number(i.qty||0)))}</strong></div>`).join('');body=`<div class="transaction-detail-head"><div><span class="detail-kicker">TANGGAL ORDER</span><h3>${fmtDate(x.date)}</h3></div>${status}</div><div class="panel detail-lines-panel"><div class="panel-title"><h3>Rincian barang</h3></div>${items||'<div class="muted">Tidak ada rincian barang.</div>'}<div class="detail-grand-total order-detail-grand-total"><span>Total order</span><b>${rupiah(x.total)}</b></div></div>`}else{body=`<div class="transaction-detail-head"><div><span class="detail-kicker">TANGGAL SETOR</span><h3>${fmtDate(x.date)}</h3></div>${status}</div><div class="panel detail-lines-panel"><div class="detail-line"><span>Omset penjualan</span><strong>${rupiah(x.turnover)}</strong></div><div class="detail-line"><span>Persentase penghasilan</span><strong>${Number(x.percentage)||0}%</strong></div><div class="detail-line income-detail-line"><span>Penghasilan</span><strong>${rupiah(x.income)}</strong></div><div class="detail-grand-total"><span>Nominal setor</span><b>${rupiah(x.amount)}</b></div></div>`}openModal(isOrder?'Detail Order':'Detail Setor',body,true)}
function recentPersonActivity(p){const arr=[...state.orders.filter(o=>o.personnelId===p.id).map(x=>({...x,type:'order'})),...state.deposits.filter(d=>d.personnelId===p.id).map(x=>({...x,type:'deposit'}))].sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date))).slice(0,4);if(!arr.length)return emptyBlock('🪄','Belum ada transaksi','Order atau setor baru akan muncul di sini.');return `<div class="list-grid">${arr.map(x=>`<div class="data-card"><div class="card-top"><span class="card-icon">${x.type==='order'?'📦':'💸'}</span><div style="flex:1"><div class="card-title">${x.type==='order'?'Order':'Setor'}</div><div class="card-meta">${fmtDate(x.date)}</div></div><span class="status ${x.status==='diterima'||x.status==='selesai'?'green':'blue'}">${x.status==='masuk'?'Terkirim':x.status==='menunggu'?'Menunggu':x.status==='selesai'?'Selesai':'Diterima'}</span></div><div class="card-total">${rupiah(x.type==='order'?x.total:x.amount)}</div></div>`).join('')}</div>`}
function renderPersonOrder(p){const total=selectedOrderItems.reduce((n,x)=>n+x.price*x.qty,0),qty=selectedOrderItems.reduce((n,x)=>n+x.qty,0);return `<div class="section-head"><div><div class="eyebrow">ORDER BARANG</div><h2>Buat order</h2><p>Order akan dikirim ke admin untuk diperiksa.</p></div></div><div class="panel"><form onsubmit="submitOrder(event)"><div class="field" style="margin-bottom:14px"><label>Tanggal order</label><input id="orderDateInput" type="date" value="${orderDate}" required onchange="orderDate=this.value"></div><div class="field search-pop"><label>Cari item barang</label><input id="itemSearchInput" placeholder="Ketik nama item..." value="${esc(itemSearch)}" autocomplete="off" oninput="handleItemSearch(this.value)"><div id="suggestions" class="suggestions hidden"></div></div><div class="line-divider"></div><div class="panel-title"><h3>Item terpilih</h3><small>${qty} unit</small></div>${selectedOrderItems.length?selectedOrderItems.map((x,idx)=>`<div class="order-row"><div><strong>${esc(x.name)}</strong></div><input class="qty-input" aria-label="Qty" type="number" min="1" value="${x.qty}" onchange="changeQty(${idx},this.value)"><button type="button" class="btn btn-danger btn-xs" onclick="removeOrderItem(${idx})">×</button></div>`).join(''):emptyBlock('🛒','Belum ada item dipilih','Cari item di kolom atas, lalu pilih hasilnya.')}<div class="total-strip"><div class="total-mini"><span>Jumlah item</span><b>${qty} unit</b></div><div class="total-mini"><span>Total order</span><b>${rupiah(total)}</b></div></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="resetOrder()">↺ Reset order</button><button type="submit" class="btn btn-primary" ${selectedOrderItems.length?'':'disabled'}>Kirim order →</button></div></form></div><div class="hint">Catatan: harga menggunakan daftar item yang ditetapkan admin. Setelah dikirim, status order akan tampil sebagai “Cek out”.</div>`}
function handleItemSearch(v){itemSearch=v;const box=document.getElementById('suggestions');if(!box)return;const matches=state.items.filter(i=>i.name.toLowerCase().includes(v.toLowerCase())).slice(0,8);if(!v.trim()||!matches.length){box.classList.add('hidden');box.innerHTML='';return}box.classList.remove('hidden');box.innerHTML=matches.map(i=>`<button type="button" class="suggestion" onclick="addOrderItem('${i.id}')"><span>${esc(i.name)}<br><small>${rupiah(i.price)}</small></span><b>＋ Pilih</b></button>`).join('')}
function addOrderItem(iid){const item=state.items.find(i=>i.id===iid);if(!item)return;const existing=selectedOrderItems.find(x=>x.itemId===iid);if(existing)existing.qty++;else selectedOrderItems.push({itemId:item.id,name:item.name,price:Number(item.price)||0,qty:1});itemSearch='';render();toast('Item ditambahkan ke order.')}
function changeQty(idx,v){selectedOrderItems[idx].qty=Math.max(1,Math.floor(Number(v)||1));render()}
function removeOrderItem(idx){selectedOrderItems.splice(idx,1);render()}
function resetOrder(){selectedOrderItems=[];itemSearch='';orderDate=todayWIB();render()}
async function submitOrder(e){e.preventDefault();if(!selectedOrderItems.length)return toast('Pilih item terlebih dahulu.','bad');orderDate=document.getElementById('orderDateInput').value||todayWIB();try{if(hasGas()){const r=await gasCall('personnelCreateOrder',sessionToken,{date:orderDate,items:selectedOrderItems.map(x=>({itemId:x.itemId,qty:x.qty}))});state=r.state}else{const lines=selectedOrderItems.map(x=>({...x,subtotal:x.price*x.qty}));state.orders.push({id:id(),personnelId:currentUser.id,date:orderDate,items:lines,total:lines.reduce((s,x)=>s+x.subtotal,0),status:'masuk',createdAt:new Date().toISOString()});saveLocal()}selectedOrderItems=[];itemSearch='';page='overview';render();toast('Order berhasil dikirim ke admin.')}catch(err){toast(err.message||'Order gagal disimpan.','bad')}}
function renderPersonDeposit(p){const turnoverInput=Number(modalData.turnover||0),pct=Number(modalData.percentage??lastPct??0),income=Math.round(turnoverInput*pct/100),amount=turnoverInput-income;return `<div class="section-head"><div><div class="eyebrow">SETOR PENJUALAN</div><h2>Catat setor</h2><p>Penghasilan dan nominal setor dihitung otomatis.</p></div></div><div class="panel"><form onsubmit="submitDeposit(event)"><div class="form-grid"><div class="field"><label>Tanggal setor</label><input id="depositDateInput" type="date" value="${depositDate}" required onchange="depositDate=this.value"></div><div class="field full"><label>Omset penjualan (Rp)</label><input id="turnover" inputmode="numeric" type="number" min="0" step="1" value="${turnoverInput||''}" placeholder="Contoh: 250000" required oninput="updateDepositPreview(this.value,document.getElementById('percentage').value)"></div><div class="field percentage-field"><label>Persentase (%)</label><input class="percentage-input" id="percentage" type="number" min="0" max="100" step="0.1" value="${pct}" required oninput="updateDepositPreview(document.getElementById('turnover').value,this.value)"></div><div class="field income-field"><label>Penghasilan</label><input class="income-preview" id="incomePreview" value="${rupiah(income)}" disabled></div><div class="field full"><div class="balance-banner" style="margin:0;background:linear-gradient(125deg,#20a879,#56d9af)"><div class="label">💸 Nominal setor</div><div class="value" id="depositPreview">${rupiah(amount)}</div><div class="sub">Omset − penghasilan</div></div></div></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="resetDeposit()">↺ Reset</button><button type="submit" class="btn btn-green">Kirim setor →</button></div></form></div><div class="panel"><div class="panel-title"><h3>Setor terakhir</h3><small>${state.deposits.filter(d=>d.personnelId===p.id).length} transaksi</small></div>${recentPersonDeposits(p)}</div>`}
function updateDepositPreview(turn,pct){const t=Math.max(0,Number(turn)||0),p=Math.min(100,Math.max(0,Number(pct)||0)),income=Math.round(t*p/100);const a=document.getElementById('incomePreview'),b=document.getElementById('depositPreview');if(a)a.value=rupiah(income);if(b)b.textContent=rupiah(t-income);modalData.turnover=t;modalData.percentage=p}
function resetDeposit(){modalData={turnover:0,percentage:lastPct};depositDate=todayWIB();render()}
function recentPersonDeposits(p){const arr=state.deposits.filter(d=>d.personnelId===p.id).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);return arr.length?`<div class="list-grid">${arr.map(d=>`<div class="data-card"><div class="card-top"><span class="card-icon">💸</span><div style="flex:1"><div class="card-title">${fmtDate(d.date)}</div><div class="card-meta">Omset ${rupiah(d.turnover)} · Penghasilan ${d.percentage}%</div></div><span class="status ${d.status==='diterima'?'green':'blue'}">${d.status==='diterima'?'Diterima':'Menunggu'}</span></div><div class="card-total">${rupiah(d.amount)}</div></div>`).join('')}</div>`:emptyBlock('💸','Belum ada setoran','Setoran yang Anda kirim akan muncul di sini.')}
async function submitDeposit(e){e.preventDefault();const turnover=Number(document.getElementById('turnover').value),percentage=Number(document.getElementById('percentage').value);if(turnover<0||percentage<0||percentage>100)return toast('Periksa omset atau persentase.','bad');depositDate=document.getElementById('depositDateInput').value||todayWIB();try{if(hasGas()){const r=await gasCall('personnelCreateDeposit',sessionToken,{date:depositDate,turnover,percentage});state=r.state}else{const income=Math.round(turnover*percentage/100);state.deposits.push({id:id(),personnelId:currentUser.id,date:depositDate,turnover,percentage,income,amount:turnover-income,status:'menunggu',createdAt:new Date().toISOString()});saveLocal()}lastPct=percentage;localStorage.setItem('jm_last_pct',String(percentage));modalData={turnover:0,percentage:lastPct};page='overview';render();toast('Setor berhasil dikirim untuk diterima admin.')}catch(err){toast(err.message||'Setor gagal disimpan.','bad')}}
function emptyBlock(icon,title,sub){return `<div class="empty"><span class="big">${icon}</span><b>${title}</b><span>${sub}</span></div>`}
function openModal(title,body,wide=false){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal ${wide?'wide':''}"><div class="modal-head"><div><h3>${title}</h3><p>JM Operasional · Kelola data dengan mudah</p></div><button class="close-btn" onclick="closeModal()">×</button></div>${body}</section></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML='';modalData={}}
function openMetric(type){metricFilterDate=todayWIB();const all=type==='balance'?state.personnel.map(p=>({name:p.name,date:todayWIB(),total:balances(p),id:p.id,personnelId:p.id})):type==='orders'?state.orders:state.deposits;const label=type==='balance'?'Saldo akhir personil':type==='orders'?'Transaksi order':'Transaksi setor';const body=()=>{const arr=type==='balance'?state.personnel.map(p=>({name:p.name,date:todayWIB(),total:balances(p),personnelId:p.id})):all.filter(x=>!metricFilterDate||String(x.date||'').slice(0,10)===metricFilterDate);const dayTotal=type==='orders'?sumOrders(arr):type==='deposits'?sumDeposits(arr):null;const dailyStrip=type==='balance'?'':`<div class="total-strip" style="margin:0 0 14px"><div class="total-mini"><span>Total ${type==='orders'?'order':'setor'} · ${fmtDate(metricFilterDate)} WIB (${arr.length} transaksi)</span><b>${rupiah(dayTotal||0)}</b></div></div>`;return `<div class="field" style="max-width:230px;margin-bottom:14px"><label>Tanggal transaksi (WIB)</label><input type="date" value="${metricFilterDate}" onchange="metricFilterDate=this.value;refreshMetricModal('${type}')"></div>${dailyStrip}${arr.length?`<div class="table-wrap"><table><thead><tr><th>${type==='balance'?'Personil':'Tanggal / waktu WIB'}</th><th>Personil</th><th>Nominal</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${type==='balance'?'Saldo kini':fmtDateTimeWIB(x.date,x.createdAt)}</td><td>${esc(type==='balance'?x.name:personName(x.personnelId))}</td><td><b>${rupiah(type==='balance'?x.total:type==='orders'?x.total:x.amount)}</b></td></tr>`).join('')}</tbody></table></div>`:emptyBlock('🔎','Tidak ada transaksi','Total untuk tanggal ini Rp 0 dan tidak ada transaksi tercatat.')}`};modalData.metricBody=body;modalData.metricType=type;openModal(label,body(),true)}
function refreshMetricModal(type){if(modalData.metricBody)openModal(type==='balance'?'Saldo akhir personil':type==='orders'?'Transaksi order':'Transaksi setor',modalData.metricBody(),true)}
function openNotice(type){let people=type==='late'?state.personnel.filter(isLate):type==='over'?state.personnel.filter(p=>balances(p)>Number(state.settings.maxBalance||Infinity)):state.personnel.filter(p=>p.active);const title=type==='late'?'Peringatan tidak setor':type==='over'?'Saldo melebihi batas':'Personil aktif';openModal(title,people.length?`<div class="list-grid">${people.map(p=>`<div class="data-card"><div class="card-top"><span class="card-icon">${type==='late'?'⏰':type==='over'?'⚠️':'🟢'}</span><div style="flex:1"><div class="card-title">${esc(p.name)}</div><div class="card-meta">${esc(p.stall||'Lapak belum diisi')} · ${type==='active'?'Login aktif':'Saldo akhir: '+rupiah(balances(p))}</div></div></div>${type==='late'?`<div class="card-meta" style="margin-top:10px">Batas setor: setiap ${state.settings.daysWithoutDeposit} hari</div>`:''}</div>`).join('')}</div>`:emptyBlock('✅','Tidak ada personil di kategori ini','Status diperbarui ketika data personil berubah.') ,true)}
function openItemModal(itemId=''){const it=state.items.find(i=>i.id===itemId);modalData.itemId=itemId;openModal(it?'Edit item':'Tambah item',`<form onsubmit="saveItem(event)"><div class="form-grid"><div class="field full"><label>Nama item / barang *</label><input id="itemName" value="${esc(it?.name||'')}" required placeholder="Contoh: Kopi Susu"></div><div class="field full"><label>Harga (Rp) *</label><input id="itemPrice" type="number" min="0" step="1" value="${Number(it?.price)||''}" required placeholder="Contoh: 12000"></div></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button type="submit" class="btn btn-primary">Simpan item</button></div></form>`)}
async function saveItem(e){e.preventDefault();const name=document.getElementById('itemName').value.trim(),price=Number(document.getElementById('itemPrice').value);if(!name||price<0)return toast('Isi nama item dan harga dengan benar.','bad');if(modalData.itemId){const it=state.items.find(x=>x.id===modalData.itemId);if(it){it.name=name;it.price=price}}else state.items.push({id:id(),name,price});try{await syncSave();closeModal();render();toast('Item berhasil disimpan.')}catch(err){toast(err.message,'bad')}}
function openPersonModal(pid=''){const p=state.personnel.find(x=>x.id===pid);modalData.personId=pid;openModal(p?'Edit personil':'Tambah personil',`<form onsubmit="savePerson(event)"><div class="form-grid"><div class="field full"><label>Nama personil *</label><input id="personName" value="${esc(p?.name||'')}" required placeholder="Nama lengkap"></div><div class="field"><label>No. telepon</label><input id="personPhone" value="${esc(p?.phone||'')}" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Lokasi lapak</label><input id="personStall" value="${esc(p?.stall||'')}" placeholder="Nama / lokasi lapak"></div><div class="field full"><label>Alamat</label><input id="personAddress" value="${esc(p?.address||'')}" placeholder="Alamat personil"></div><div class="field"><label>Kategori</label><select id="personCategory" onchange="toggleUpline(this.value)"><option value="umum" ${(p?.category||'umum')==='umum'?'selected':''}>Umum</option><option value="upline" ${p?.category==='upline'?'selected':''}>Upline</option><option value="downline" ${p?.category==='downline'?'selected':''}>Downline</option></select></div><div class="field ${p?.category==='downline'?'':'hidden'}" id="uplineField"><label>Pilih upline</label><select id="personUpline"><option value="">Pilih upline terdaftar</option>${state.personnel.filter(x=>x.id!==pid&&x.category!=='downline').map(x=>`<option value="${x.id}" ${p?.uplineId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field full"><label>Kode aktivasi * (JM-3HURUF-3ANGKA)</label><input id="personCode" value="${esc(p?.activationCode||'')}" required placeholder="JM-ABC-123" pattern="JM-[A-Za-z]{3}-[0-9]{3}" style="text-transform:uppercase"><div class="hint">Contoh format: JM-AND-001. Kode harus unik.</div></div><div class="field full"><label>Saldo awal (Rp) *</label><input id="personOpening" type="number" min="0" step="1" value="${p?Number(p.openingBalance)||0:''}" required placeholder="0"></div></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button type="submit" class="btn btn-primary">Simpan personil</button></div></form>`,true)}
function toggleUpline(v){document.getElementById('uplineField')?.classList.toggle('hidden',v!=='downline')}
async function savePerson(e){e.preventDefault();const id0=modalData.personId,name=document.getElementById('personName').value.trim(),activationCode=document.getElementById('personCode').value.trim().toUpperCase(),cat=document.getElementById('personCategory').value,old=state.personnel.find(p=>p.id===id0);if(!name)return toast('Nama wajib diisi.','bad');if(!/^JM-[A-Z]{3}-\d{3}$/.test(activationCode))return toast('Format kode harus JM-3HURUF-3ANGKA.','bad');if(state.personnel.some(p=>p.activationCode===activationCode&&p.id!==id0))return toast('Kode aktivasi sudah digunakan.','bad');const openingBalance=Number(document.getElementById('personOpening').value);if(!Number.isFinite(openingBalance)||openingBalance<0)return toast('Saldo awal wajib diisi dan tidak boleh negatif.','bad');const p={...(old||{}),id:id0||id(),name,phone:document.getElementById('personPhone').value.trim(),address:document.getElementById('personAddress').value.trim(),stall:document.getElementById('personStall').value.trim(),category:cat,uplineId:cat==='downline'?(document.getElementById('personUpline')?.value||''):'',activationCode,openingBalance,active:old?.active||false,createdAt:old?.createdAt||new Date().toISOString()};if(cat==='downline'&&!p.uplineId)return toast('Pilih upline untuk kategori downline.','bad');if(old)state.personnel=state.personnel.map(x=>x.id===old.id?p:x);else state.personnel.push(p);try{await syncSave();closeModal();render();toast(old?'Data personil diperbarui.':'Personil berhasil ditambahkan.')}catch(err){toast(err.message,'bad')}}
function openPersonDetail(pid){personDetailId=pid;personDetailTab='orders';detailFilterDate='';refreshPersonDetail()}
function refreshPersonDetail(){const p=state.personnel.find(x=>x.id===personDetailId);if(!p)return;const oo=state.orders.filter(o=>o.personnelId===p.id&&(!detailFilterDate||o.date===detailFilterDate)),dd=state.deposits.filter(d=>d.personnelId===p.id&&(!detailFilterDate||d.date===detailFilterDate));openModal('Detail personil',`<div class="card-top" style="margin-bottom:14px"><span class="card-icon">👤</span><div style="flex:1"><div class="card-title" style="font-size:16px">${esc(p.name)}</div><div class="card-meta">${esc(p.stall||'Lapak belum diisi')} · ${esc(p.category||'umum')}<br>Kode: ${esc(p.activationCode)}</div></div><span class="status ${p.active?'green':'blue'}">${p.active?'Aktif':'Offline'}</span></div><div class="balance-banner" style="margin-bottom:12px"><div class="label">Saldo akhir</div><div class="value">${rupiah(balances(p))}</div><div class="sub">Saldo awal ${rupiah(p.openingBalance)}</div></div><div class="field" style="margin-bottom:12px"><label>Tanggal transaksi</label><input type="date" value="${detailFilterDate}" onchange="detailFilterDate=this.value;refreshPersonDetail()"></div><div class="tabs"><button class="tab ${personDetailTab==='orders'?'active':''}" onclick="personDetailTab='orders';refreshPersonDetail()">Order (${oo.length})</button><button class="tab ${personDetailTab==='deposits'?'active':''}" onclick="personDetailTab='deposits';refreshPersonDetail()">Setor (${dd.length})</button></div>${personDetailTab==='orders'?(oo.length?`<div class="list-grid">${oo.map(o=>`<div class="data-card"><div class="card-title">Order · ${fmtDate(o.date)}</div><div class="card-meta">${(o.items||[]).map(i=>esc(i.name)+' × '+i.qty).join(', ')}</div><div class="card-total">${rupiah(o.total)}</div><span class="status ${o.status==='selesai'?'green':'blue'}">${o.status==='selesai'?'Selesai':'Cek out'}</span></div>`).join('')}</div>`:emptyBlock('📦','Tidak ada order','Tidak ada order pada tanggal tersebut.')):(dd.length?`<div class="list-grid">${dd.map(d=>`<div class="data-card"><div class="card-title">Setor · ${fmtDate(d.date)}</div><div class="card-meta">Omset ${rupiah(d.turnover)} · ${d.percentage}%</div><div class="card-total">${rupiah(d.amount)}</div><span class="status ${d.status==='diterima'?'green':'blue'}">${d.status==='diterima'?'Diterima':'Menunggu'}</span></div>`).join('')}</div>`:emptyBlock('💸','Tidak ada setor','Tidak ada setor pada tanggal tersebut.'))}`,true)}
function orderEditItemsHTML(items){if(!items.length)return `<div class="order-edit-empty">Belum ada item pada order ini.</div>`;return items.map((i,idx)=>`<div class="order-edit-row"><div class="order-edit-item"><b>${esc(i.name||'Item')}</b><span>Harga ${rupiah(i.price)}</span></div><div class="order-edit-qty"><label for="editOrderQty${idx}">Qty</label><input id="editOrderQty${idx}" class="qty-input compact-qty" type="number" inputmode="numeric" min="1" value="${Math.max(1,Number(i.qty)||1)}" oninput="calcOrderEdit()"></div><div class="order-edit-sub"><small>Subtotal</small><b id="editOrderSub${idx}">${rupiah(i.subtotal??((Number(i.price)||0)*(Number(i.qty)||0)))}</b></div><button type="button" class="order-item-delete" title="Hapus item" aria-label="Hapus ${esc(i.name||'item')} dari order" onclick="removeOrderEditItem(${idx})">×</button></div>`).join('')}
function openOrderModal(oid){const o=state.orders.find(x=>x.id===oid);if(!o)return;modalData.orderId=oid;modalData.orderEditItems=(o.items||[]).map(i=>({...i}));openModal('Detail / edit order',`<form class="task-order-edit-form" onsubmit="saveOrderEdit(event)"><div class="form-grid"><div class="field full"><label>Personil</label><input value="${esc(personName(o.personnelId))}" disabled></div><div class="field"><label>Tanggal</label><input id="editOrderDate" type="date" value="${o.date}" required></div><div class="field full"><label>Daftar item · ubah Qty atau hapus item</label><div id="editOrderItemList" class="order-edit-list">${orderEditItemsHTML(modalData.orderEditItems)}</div></div><div class="field"><label>Status</label><select id="editOrderStatus"><option value="masuk" ${o.status==='masuk'?'selected':''}>Cek out</option><option value="selesai" ${o.status==='selesai'?'selected':''}>Selesai</option></select></div><div class="field"><label>Total order</label><input id="editOrderTotalPreview" value="${rupiah(o.total)}" disabled></div></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Tutup</button><button type="submit" class="btn btn-primary">Simpan perubahan</button></div></form>`,true)}
function removeOrderEditItem(index){const items=modalData.orderEditItems||[];if(items.length<=1)return toast('Minimal satu item harus tersisa pada order.','bad');items.splice(index,1);const list=document.getElementById('editOrderItemList');if(list)list.innerHTML=orderEditItemsHTML(items);calcOrderEdit()}
function calcOrderEdit(){const items=modalData.orderEditItems||[];let total=0;items.forEach((it,idx)=>{const qty=Math.max(1,Math.floor(Number(document.getElementById('editOrderQty'+idx)?.value)||1)),sub=qty*(Number(it.price)||0),cell=document.getElementById('editOrderSub'+idx);total+=sub;if(cell)cell.textContent=rupiah(sub)});const el=document.getElementById('editOrderTotalPreview');if(el)el.value=rupiah(total)}
async function saveOrderEdit(e){e.preventDefault();const o=state.orders.find(x=>x.id===modalData.orderId);if(!o)return;const items=modalData.orderEditItems||[];if(!items.length)return toast('Order harus memiliki minimal satu item.','bad');o.date=document.getElementById('editOrderDate').value;o.status=document.getElementById('editOrderStatus').value;o.items=items.map((it,idx)=>{const qty=Math.max(1,Math.floor(Number(document.getElementById('editOrderQty'+idx)?.value)||1));return {...it,qty,subtotal:(Number(it.price)||0)*qty}});o.total=o.items.reduce((n,it)=>n+(Number(it.subtotal)||0),0);try{await syncSave();closeModal();render();toast('Order diperbarui.')}catch(err){toast(err.message,'bad')}}
function openDepositModal(did){const d=state.deposits.find(x=>x.id===did);if(!d)return;modalData.depositId=did;openModal('Detail / edit setor',`<form class="deposit-edit-form" onsubmit="saveDepositEdit(event)"><div class="form-grid"><div class="field full"><label>Personil</label><input value="${esc(personName(d.personnelId))}" disabled></div><div class="field"><label>Tanggal</label><input id="editDepositDate" type="date" value="${d.date}" required></div><div class="field"><label>Status</label><select id="editDepositStatus"><option value="menunggu" ${d.status==='menunggu'?'selected':''}>Menunggu diterima</option><option value="diterima" ${d.status==='diterima'?'selected':''}>Sudah diterima</option></select></div></div><div class="deposit-edit-summary"><div class="deposit-edit-minis"><div class="deposit-edit-mini"><span>OMSET</span><b id="editDepositTurnoverSummary">${rupiah(d.turnover)}</b></div><div class="deposit-edit-mini"><span id="editDepositIncomeLabel">PENGHASILAN (${Number(d.percentage)||0}%)</span><b id="editDepositIncomeSummary">${rupiah(d.income)}</b></div></div><div class="deposit-edit-grand"><span>TOTAL SETOR</span><strong id="editDepositAmountHero">${rupiah(d.amount)}</strong></div></div><div class="form-grid deposit-edit-grid"><div class="field"><label>Omset penjualan (Rp)</label><input id="editDepositTurnover" type="number" min="0" inputmode="numeric" value="${d.turnover}" required oninput="calcEditDeposit()"></div><div class="field"><label>Persentase (%)</label><input id="editDepositPct" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="${d.percentage}" required oninput="calcEditDeposit()"></div></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Tutup</button><button type="submit" class="btn btn-primary">Simpan perubahan</button></div></form>`)}
function calcEditDeposit(){const t=Number(document.getElementById('editDepositTurnover')?.value)||0,p=Math.max(0,Math.min(100,Number(document.getElementById('editDepositPct')?.value)||0)),inc=Math.round(t*p/100),income=document.getElementById('editDepositIncomeSummary'),incomeLabel=document.getElementById('editDepositIncomeLabel'),turnover=document.getElementById('editDepositTurnoverSummary'),amount=document.getElementById('editDepositAmountHero');if(turnover)turnover.textContent=rupiah(t);if(income)income.textContent=rupiah(inc);if(incomeLabel)incomeLabel.textContent='PENGHASILAN ('+p+'%)';if(amount)amount.textContent=rupiah(t-inc)}
async function saveDepositEdit(e){e.preventDefault();const d=state.deposits.find(x=>x.id===modalData.depositId);if(!d)return;d.date=document.getElementById('editDepositDate').value;d.status=document.getElementById('editDepositStatus').value;d.turnover=Number(document.getElementById('editDepositTurnover').value)||0;d.percentage=Math.max(0,Math.min(100,Number(document.getElementById('editDepositPct').value)||0));d.income=Math.round(d.turnover*d.percentage/100);d.amount=d.turnover-d.income;try{await syncSave();closeModal();render();toast('Setor diperbarui.')}catch(err){toast(err.message,'bad')}}
async function completeOrder(oid){const o=state.orders.find(x=>x.id===oid);if(!o)return;o.status='selesai';try{await syncSave();render();toast('Order ditandai selesai.')}catch(err){toast(err.message,'bad')}}
async function acceptDeposit(did){const d=state.deposits.find(x=>x.id===did);if(!d)return;d.status='diterima';try{await syncSave();render();toast('Setor diterima.')}catch(err){toast(err.message,'bad')}}
async function deleteRecord(kind,rid){const labels={order:'order',deposit:'setor',item:'item',person:'personil'};if(!confirm(`Hapus ${labels[kind]||'data'} ini? Tindakan ini tidak dapat dibatalkan.`))return;try{if(kind==='order')state.orders=state.orders.filter(x=>x.id!==rid);if(kind==='deposit')state.deposits=state.deposits.filter(x=>x.id!==rid);if(kind==='item')state.items=state.items.filter(x=>x.id!==rid);if(kind==='person'){state.personnel=state.personnel.filter(x=>x.id!==rid);state.orders=state.orders.filter(x=>x.personnelId!==rid);state.deposits=state.deposits.filter(x=>x.personnelId!==rid)}await syncSave();if(document.getElementById('modalRoot').innerHTML)closeModal();render();toast(`${labels[kind]} dihapus.`)}catch(err){toast(err.message,'bad')}}
async function shareRecord(type,rid){const x=type==='order'?state.orders.find(t=>t.id===rid):state.deposits.find(t=>t.id===rid);if(!x)return;const message=receiptText(type,x).trimEnd();try{if(navigator.share)await navigator.share({title:type==='order'?'Nota order':'Nota setor',text:message});else if(navigator.clipboard){await navigator.clipboard.writeText(message);toast('Teks nota disalin untuk dibagikan.')}else openModal('Teks nota',`<textarea class="input" rows="10" readonly>${esc(message)}</textarea><div class="form-actions"><button class="btn btn-primary" onclick="copyText(${JSON.stringify(message)},'Teks nota disalin')">Salin teks nota</button></div>`)}catch(e){if(e.name!=='AbortError')toast('Tidak dapat membagikan nota.','bad')}}
const BT_PRINTER_SERVICES=[
 '0000ffe0-0000-1000-8000-00805f9b34fb',
 '000018f0-0000-1000-8000-00805f9b34fb',
 '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
 '49535343-fe7d-4ae5-8fa9-9fafd205e455'
];
