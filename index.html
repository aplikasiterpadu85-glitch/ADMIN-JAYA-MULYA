function shareReceiptText(type,x){const lines=[];const person=receiptAscii(personName(x.personnelId));const dateBits=String(x.date||todayWIB()).slice(0,10).split('-').map(Number);const dt=x.createdAt?new Date(x.createdAt):new Date();const timeParts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(dt);const hh=timeParts.find(v=>v.type==='hour')?.value||'00',mm=timeParts.find(v=>v.type==='minute')?.value||'00',ss=timeParts.find(v=>v.type==='second')?.value||'00';const day=String(dateBits[2]||dt.getDate()).padStart(2,'0'),month=String(dateBits[1]||dt.getMonth()+1).padStart(2,'0'),year=String(dateBits[0]||dt.getFullYear());lines.push(person);lines.push('Tgl      : '+day+'/'+month+'/'+year+', '+hh+'.'+mm+'.'+ss);lines.push('--------------------------------');lines.push('================================');if(type==='order'){(x.items||[]).forEach(it=>{const qty=Math.max(0,Number(it.qty)||0);const name=receiptAscii(it.name||'Item');const pack=Number(it.price)||0;const subtotal=Number(it.subtotal??(pack*qty));const fmt=v=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Number(v)||0);lines.push(name);lines.push('  '+qty+' x Rp\u00a0'+fmt(pack)+'      = Rp\u00a0'+fmt(subtotal));});lines.push('--------------------------------');lines.push('            TOTAL       : Rp\u00a0'+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Number(x.total)||0));lines.push('--------------------------------');}else{lines.push('Omset: '+receiptAmount(x.turnover));lines.push('Penghasilan: '+receiptAmount(x.income));lines.push('--------------------------------');lines.push('            TOTAL SETOR : '+receiptAmount(x.amount));lines.push('--------------------------------');}return lines.join('\n')}
async function shareRecord(type,rid){
  const x=type==='order'?state.orders.find(t=>t.id===rid):state.deposits.find(t=>t.id===rid);
  if(!x)return toast('Transaksi tidak ditemukan.','bad');
  const message=shareReceiptText(type,x);
  const title=type==='order'?'Nota order':'Nota setor';
  const person=state.personnel.find(p=>String(p.id)===String(x.personnelId));
  const openUniversalShare=async()=>{
    try{
      if(typeof navigator!=='undefined'&&typeof navigator.share==='function'){
        await navigator.share({title,text:message});
        return;
      }
      if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(message);
        toast('Teks nota disalin. Silakan bagikan lewat aplikasi yang diinginkan.');
        return;
      }
      openModal('Teks nota',`<textarea class="input" rows="10" readonly>${esc(message)}</textarea><div class="form-actions"><button class="btn btn-primary" onclick="copyText(${JSON.stringify(message)},'Teks nota disalin')">Salin teks nota</button></div>`);
    }catch(e){if(!e||e.name!=='AbortError')toast('Tidak dapat membagikan nota.','bad')}
  };
  const rawPhone=String(person?.phone||'').trim();
  if(!rawPhone){toast('Nomor personil kosong. Membuka pilihan berbagi umum.');await openUniversalShare();return}
  let phone=rawPhone.replace(/\D/g,'');
  if(phone.startsWith('0'))phone='62'+phone.slice(1);else if(phone.startsWith('8'))phone='62'+phone;
  if(phone.length<8||phone.length>15){toast('Nomor personil tidak valid. Membuka pilihan berbagi umum.','bad');await openUniversalShare();return}
  /* Tautan WhatsApp universal: Android akan menyerahkannya ke aplikasi yang menangani nomor tersebut. */
  const wa='https://wa.me/'+phone+'?text='+encodeURIComponent(message);
  window.location.href=wa;
}

function receiptDateTime(x){const bits=String(x.date||todayWIB()).slice(0,10).split('-').map(Number);const dt=x.createdAt?new Date(x.createdAt):new Date();const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(dt);const hh=parts.find(v=>v.type==='hour')?.value||'00',mm=parts.find(v=>v.type==='minute')?.value||'00';const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];const day=String(bits[2]||dt.getDate()).padStart(2,'0'),month=months[(bits[1]||dt.getMonth()+1)-1]||months[0],year=bits[0]||dt.getFullYear();return `${day} ${month} ${year}, ${hh}.${mm}`}
function receiptAmount(v){return 'Rp '+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Number(v)||0)}
function receiptAscii(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'?')}
function receiptLine(left,right,width=32){left=receiptAscii(left);right=receiptAscii(right);if(right.length>=width)right=right.slice(0,width-1);const maxLeft=Math.max(1,width-right.length-1);if(left.length>maxLeft)left=left.slice(0,maxLeft-1)+'~';return left+' '.repeat(Math.max(1,width-left.length-right.length))+right}
function receiptColumnLine(label,symbol,amount,width,amountWidth){label=receiptAscii(label);amount=receiptAscii(amount);const aw=Math.min(Math.max(1,amountWidth),width-4);const leftWidth=width-aw-3;if(label.length>leftWidth)label=label.slice(0,Math.max(1,leftWidth-1))+'~';const match=amount.match(/^Rp\s*(.*)$/);const currency=match?'Rp ':'';const value=match?match[1]:amount;const valueWidth=Math.max(1,aw-currency.length);const amountField=(currency+value.padStart(valueWidth)).slice(-aw);return label.padEnd(leftWidth)+' '+symbol+' '+amountField}
function receiptText(type,x,width=32){width=Math.max(32,Math.min(48,Number(width)||32));const lines=[];lines.push('Tgl      : '+receiptDateTime(x));const person=receiptAscii(personName(x.personnelId));const personWidth=width-11;const firstPerson=person.slice(0,personWidth);lines.push('Personil : '+firstPerson);let restPerson=person.slice(personWidth);while(restPerson.length){lines.push('           '+restPerson.slice(0,personWidth));restPerson=restPerson.slice(personWidth)}lines.push('='.repeat(width));if(type==='order'){const entries=(x.items||[]).map(it=>({label:`${receiptAscii(it.name||'Item')} ${Math.max(0,Number(it.qty)||0)} x`,amount:receiptAmount(Number(it.subtotal??((Number(it.price)||0)*(Math.max(0,Number(it.qty)||0)))))}));const totalAmount=receiptAmount(x.total);const amountWidth=Math.max(totalAmount.length,...entries.map(e=>e.amount.length),1);entries.forEach(e=>lines.push(receiptColumnLine(e.label,'=',e.amount,width,amountWidth)));lines.push('-'.repeat(width));lines.push(receiptColumnLine('TOTAL',':',totalAmount,width,amountWidth));}else{const entries=[{label:'Omset',amount:receiptAmount(x.turnover)},{label:'Penghasilan',amount:receiptAmount(x.income)}];const totalAmount=receiptAmount(x.amount);const amountWidth=Math.max(totalAmount.length,...entries.map(e=>e.amount.length),1);entries.forEach(e=>lines.push(receiptColumnLine(e.label,':',e.amount,width,amountWidth)));lines.push('-'.repeat(width));lines.push(receiptColumnLine('TOTAL SETOR',':',totalAmount,width,amountWidth));}lines.push('');lines.push('');lines.push('');return lines.join('\n')+'\n'}

function makeEscPosReceipt(type,x){const encoder=new TextEncoder(),lines=receiptText(type,x).split('\n'),out=[0x1b,0x40,0x1b,0x61,0x00,0x1b,0x21,0x00];for(const line of lines){const bold=line.startsWith('TOTAL');if(bold)out.push(0x1b,0x45,0x01);out.push(...encoder.encode(line+'\n'));if(bold)out.push(0x1b,0x45,0x00)}out.push(0x1b,0x64,0x03);return new Uint8Array(out);}
async function findPrinterWriteCharacteristic(server){let services=[];try{services=await server.getPrimaryServices()}catch(e){}const prefer=['0000ffe0-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb','6e400001-b5a3-f393-e0a9-e50e24dcca9e','49535343-fe7d-4ae5-8fa9-9fafd205e455'];for(const id of prefer){const svc=services.find(s=>String(s.uuid).toLowerCase()===id);if(!svc)continue;try{const chars=await svc.getCharacteristics();const c=chars.find(v=>v.properties.writeWithoutResponse||v.properties.write);if(c)return c}catch(e){}}return null}
async function writeBluetoothChunks(ch,data){const chunkSize=20;for(let i=0;i<data.length;i+=chunkSize){const part=data.slice(i,Math.min(i+chunkSize,data.length));if(ch.properties.writeWithoutResponse&&typeof ch.writeValueWithoutResponse==='function')await ch.writeValueWithoutResponse(part);else if(ch.properties.write&&typeof ch.writeValueWithResponse==='function')await ch.writeValueWithResponse(part);else if(typeof ch.writeValue==='function')await ch.writeValue(part);else throw new Error('Karakteristik printer tidak mendukung penulisan data.');await new Promise(resolve=>setTimeout(resolve,18))}}
async function printRecord(type,rid){const x=type==='order'?state.orders.find(t=>t.id===rid):state.deposits.find(t=>t.id===rid);if(!x)return;const browserSupported=!!(window.isSecureContext&&navigator.bluetooth&&navigator.bluetooth.requestDevice);if(!browserSupported){openModal('Printer Bluetooth 58 mm',`<div class="panel"><b>Web Bluetooth tidak tersedia di browser ini.</b><p>Gunakan Google Chrome di Android dan buka aplikasi melalui URL HTTPS. Fitur pencarian perangkat mendukung printer Bluetooth Low Energy (BLE) dengan profil GATT yang kompatibel.</p><p>Bila printer Anda Bluetooth Classic / SPP, browser tidak dapat mengirim langsung melalui Web Bluetooth.</p></div><div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button><button class="btn btn-primary" onclick="printRecordBrowser('${type}',${JSON.stringify(String(rid))})">Cetak via browser</button></div>`);return}let device=null;try{toast('Pilih perangkat printer Bluetooth…');device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_PRINTER_SERVICES});if(!device.gatt)throw new Error('Perangkat yang dipilih tidak menyediakan layanan Bluetooth GATT.');toast('Menghubungkan ke '+(device.name||'printer')+'…');const server=await device.gatt.connect();const ch=await findPrinterWriteCharacteristic(server);if(!ch){try{device.gatt.disconnect()}catch(e){}openModal('Profil printer tidak cocok',`<div class="panel"><b>${esc(device.name||'Printer Bluetooth')} terhubung, tetapi profil cetaknya tidak dikenali.</b><p>Aplikasi mencari profil printer BLE umum (FFE0/FFE1, 18F0/2AF1, Nordic UART, dan profil serial sejenis). Banyak printer 58 mm memakai Bluetooth Classic / SPP sehingga tidak dapat dicetak langsung menggunakan Web Bluetooth.</p></div><div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button><button class="btn btn-primary" onclick="printRecordBrowser('${type}',${JSON.stringify(String(rid))})">Cetak via browser</button></div>`);return}const payload=makeEscPosReceipt(type,x);await writeBluetoothChunks(ch,payload);try{device.gatt.disconnect()}catch(e){}toast('Nota berhasil dikirim ke '+(device.name||'printer Bluetooth')+'.')}catch(err){if(device?.gatt?.connected){try{device.gatt.disconnect()}catch(e){}}if(err?.name==='NotFoundError'||err?.name==='AbortError'){toast('Pemilihan printer dibatalkan.','bad');return}openModal('Cetak nota gagal',`<div class="panel"><b>${esc(err?.message||'Printer gagal menerima data.')}</b><p>Pastikan printer menyala, telah diisi kertas, dan mendukung Bluetooth BLE/GATT dengan perintah ESC/POS. Untuk printer Bluetooth Classic / SPP, gunakan aplikasi penghubung printer atau cetak melalui dialog browser.</p></div><div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button><button class="btn btn-primary" onclick="printRecordBrowser('${type}',${JSON.stringify(String(rid))})">Cetak via browser</button></div>`,'wide')}}
function printRecordBrowser(type,rid){const x=type==='order'?state.orders.find(t=>t.id===rid):state.deposits.find(t=>t.id===rid);if(!x)return;const text=receiptText(type,x).split('\n');const body=text.map((line,i)=>`<div class="${i===0||line.startsWith('TOTAL')||line.startsWith('TOTAL SETOR')?'pr-bold':''} ${line==='='.repeat(32)||line==='-'.repeat(32)?'pr-rule':''}">${esc(line)||'&nbsp;'}</div>`).join('');document.getElementById('modalRoot').innerHTML=`<div class="print-fallback-area">${body}</div>`;closeModalForPrint();setTimeout(()=>window.print(),100);setTimeout(()=>{document.getElementById('modalRoot').innerHTML=''},1500)}

ch==='limits'){title='Batas personil';body=`<form onsubmit="saveLimits(event)"><div class="field"><label>Batas nominal saldo akhir (Rp)</label><input id="maxBalance" type="number" min="0" value="${Number(state.settings.maxBalance)||0}" required><div class="hint">Saldo personil yang melampaui angka ini mendapat peringatan.</div></div><div class="field" style="margin-top:13px"><label>Batas waktu tidak setor (hari)</label><input id="daysNoDeposit" type="number" min="0" max="365" value="${Number(state.settings.daysWithoutDeposit)||0}" required><div class="hint">Jika melewati jumlah hari ini sejak setor terakhir, status akan ditandai terlambat.</div></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan batas</button></div></form>`}else if(which==='password'){title='Ubah sandi admin';body=`<form onsubmit="savePassword(event)"><div class="field"><label>Sandi lama</label><input id="oldPassword" type="password" required value="${force?esc(old):''}" autocomplete="current-password"></div><div class="field" style="margin-top:12px"><label>Sandi baru</label><input id="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter"></div><div class="field" style="margin-top:12px"><label>Ulangi sandi baru</label><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></div><div class="field" style="margin-top:14px"><label>Email admin untuk pemulihan</label><input id="adminRecoveryEmail" type="email" inputmode="email" autocomplete="email" value="${esc(state.settings.adminRecoveryEmail||'')}" placeholder="admin@contoh.com"><div class="hint">Email ini menerima kode pemulihan melalui Gmail yang dikirim oleh Google Apps Script. Pemilik proyek perlu mengotorisasi pengiriman email.</div></div><div class="field" style="margin-top:12px"><label>Nomor HP admin untuk SMS / WhatsApp</label><input id="adminRecoveryPhone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(state.settings.adminRecoveryPhone||'')}" placeholder="Contoh: 08xxxxxxxxxx"><div class="hint">Nomor ini menjadi tujuan SMS atau WhatsApp Business. Kedua layanan memerlukan konfigurasi API pada Script Properties.</div><button type="button" class="btn btn-primary btn-xs" style="margin-top:8px" onclick="saveAdminRecoveryPhone()">Simpan kontak pemulihan</button></div>${force?`<div class="warning-box" style="margin-top:12px">Sandi bawaan terdeteksi. Ubah sandi terlebih dahulu sebelum memakai aplikasi.</div>`:''}<div class="form-actions"><button type="button" class="btn btn-ghost" onclick="${force?'logout()':'closeModal()'}">${force?'Keluar':'Batal'}</button><button class="btn btn-primary">Ubah sandi</button></div></form>`}else if(which==='cloud'){title='Cloud & backup';const url=state.settings.cloudUrl||'';const personLink=getPersonnelAppLink(url);body=`<div class="field"><label>URL Web App / koneksi backend</label><input id="cloudUrl" type="url" value="${esc(url)}" placeholder="https://script.google.com/macros/s/.../exec"><div class="hint">URL ini adalah koneksi backend Google Apps Script. Link cloud hanya bisa dibuat dari situs aplikasi online (GitHub Pages HTTPS), bukan dari file yang dibuka melalui Downloads. Setelah URL disimpan di situs online, buka link yang dihasilkan; gunakan link CLOUD AKTIF yang sama di semua HP.</div></div><div class="field" style="margin-top:13px"><label>Link aplikasi (Admin & Personil)</label><div style="display:flex;gap:8px"><input id="personAppLink" value="${esc(personLink||'Simpan URL Web App terlebih dahulu')}" readonly><button type="button" class="btn btn-soft btn-xs" onclick="copyText(document.getElementById('personAppLink').value,'Link aplikasi personil disalin')">Copy</button><button type="button" class="btn btn-primary btn-xs" onclick="openCloudAppLink()">Buka link</button></div><div class="hint">Bagikan link yang sama kepada Admin dan semua Personil. Pilih peran di halaman login; Personil cukup memasukkan kode aktivasi.</div></div><div class="form-actions" style="justify-content:flex-start"><button type="button" class="btn btn-soft btn-xs" onclick="saveCloudUrl()">Simpan URL</button><button type="button" class="btn btn-soft btn-xs" onclick="testCloud()">☁️ Tes cloud</button><button type="button" class="btn btn-primary btn-xs" onclick="sendCloud()">↑ Kirim cloud</button><button type="button" class="btn btn-ghost btn-xs" onclick="pullCloud()">↓ Tarik cloud</button></div><div class="line-divider"></div><div class="field"><label>Kode Code.gs untuk salin-tempel</label><textarea class="input code-area" id="gsOneLine" rows="4" readonly>${esc(SCRIPT_GS_ONELINE)}</textarea><div class="form-actions" style="margin-top:8px"><button type="button" class="btn btn-soft btn-xs" onclick="copyText(document.getElementById('gsOneLine').value,'Kode Code.gs disalin')"><span class="jm-action-3d copy" aria-hidden="true">▣</span> Copy kode 1 baris</button></div><div class="hint">Berkas Code.gs lengkap juga tersedia di paket aplikasi; gunakan versi file untuk pemeliharaan. Kode satu baris ini disediakan untuk kebutuhan salin-tempel. Gunakan file Code.gs lengkap jika memungkinkan.</div></div><div class="line-divider"></div><div class="form-actions" style="justify-content:flex-start"><button type="button" class="btn btn-ghost btn-xs" onclick="backupJSON()">⬇ Backup JSON</button><label class="btn btn-ghost btn-xs" for="restoreFile">⬆ Restore JSON</label><input id="restoreFile" type="file" accept="application/json,.json" class="hidden" onchange="restoreJSON(event)"></div><div class="hint" style="margin-top:8px">Backup menyimpan daftar item, personil, order, setor, dan pengaturan. Simpan file di lokasi aman.</div>`}else{title='Info aplikasi';body=infoHTML()}openModal(title,body,which==='cloud')}

async function saveCloudUrl(){const input=document.getElementById('cloudUrl');const next=validCloudUrl(input.value.trim());if(!next){toast('URL harus berupa HTTPS Web App Apps Script yang berakhir /exec.','bad');return}const previous=state.settings.cloudUrl||'',publicAppLink=getPersonnelAppLink(next);try{if(hasNativeGas()){state.settings.cloudUrl=next;await syncSave();try{localStorage.setItem(CLOUD_URL_KEY,next)}catch(_){}const link=document.getElementById('personAppLink');if(link)link.value=publicAppLink||(location.protocol==='https:'?'Link online belum dapat dibuat.':'Buka situs online aplikasi terlebih dahulu.');toast('URL backend disimpan. Link aplikasi sama untuk Admin dan Personil.');return}if(activeCloudUrl&&next===activeCloudUrl&&sessionToken&&currentUser){state.settings.cloudUrl=next;await syncSave()}else if(!activeCloudUrl){state.settings.cloudUrl=next;saveLocal()}try{localStorage.setItem(CLOUD_URL_KEY,next)}catch(_){}const link=document.getElementById('personAppLink');if(link)link.value=publicAppLink||(location.protocol==='https:'?'Link online belum dapat dibuat.':'Buka situs online aplikasi terlebih dahulu.');if(!publicAppLink&&!hasNativeGas()){toast('URL tersimpan di perangkat ini, tetapi link cloud bersama tidak bisa dibuat dari file Downloads. Buka situs online aplikasi di GitHub Pages, lalu simpan URL backend di sana.','bad')}else if(activeCloudUrl&&next!==activeCloudUrl){toast('Link diperbarui. Buka ulang link itu untuk beralih ke backend baru; data tidak dikirim otomatis.')}else if(!activeCloudUrl){toast('URL tersimpan. Salin link online di bawah dan buka link itu untuk login ke cloud.')}else{toast('URL backend disimpan. Link yang sama dipakai Admin dan Personil.')}}catch(err){state.settings.cloudUrl=previous;toast(err.message||'Gagal menyimpan URL backend.','bad')}}
async function testCloud(){try{const u=validCloudUrl(document.getElementById('cloudUrl').value.trim()||activeCloudUrl||state.settings.cloudUrl);if(!u)return toast('Masukkan URL Web App dahulu.','bad');if(hasNativeGas()&&u===activeCloudUrl){const r=await gasCall('cloudTest',sessionToken);toast('Cloud OK · '+r.message);if(r.spreadsheetUrl)openModal('Tes cloud berhasil',`<p class="card-meta">${esc(r.message)}</p><p><a href="${esc(r.spreadsheetUrl)}" target="_blank" rel="noopener">Buka spreadsheet database ↗</a></p>`)}else if(activeCloudUrl&&u===activeCloudUrl&&sessionToken){const r=await gasCall('cloudTest',sessionToken);toast('Cloud OK · '+r.message);if(r.spreadsheetUrl)openModal('Tes cloud berhasil',`<p class="card-meta">${esc(r.message)}</p><p><a href="${esc(r.spreadsheetUrl)}" target="_blank" rel="noopener">Buka spreadsheet database ↗</a></p>`)}else{const r=await cloudPostCall(u,'getBootInfo',[]);toast('Koneksi backend berhasil · '+(r.webAppUrl||u))}}catch(err){toast('Tes cloud gagal: '+(err.message||String(err)),'bad')}}
async function sendCloud(){if(!hasGas()){state.settings.cloudUrl=document.getElementById('cloudUrl').value.trim();saveLocal();return toast('Mode lokal: data demo disimpan di perangkat, belum dikirim ke cloud.','bad')}try{state.settings.cloudUrl=document.getElementById('cloudUrl').value.trim()||state.settings.cloudUrl;const r=await gasCall('adminSaveState',sessionToken,state);if(r.state)state=r.state;toast('Data berhasil dikirim ke cloud.')}catch(err){toast('Kirim cloud gagal: '+err.message,'bad')}}
async function pullCloud(){if(!hasGas())return toast('Tarik cloud tersedia setelah aplikasi dipasang melalui Apps Script.','bad');try{const r=await gasCall('getAppState',sessionToken);state=r.state;if(r.webAppUrl)state.settings.cloudUrl=state.settings.cloudUrl||r.webAppUrl;render();closeModal();toast('Data cloud berhasil ditarik.')}catch(err){toast('Tarik cloud gagal: '+err.message,'bad')}}

function formatIdrCsv(value){return 'Rp. '+(Number(value)||0).toLocaleString('id-ID',{maximumFractionDigits:0});}
function exportReport(){
  const csvEscape=value=> '"'+String(value??'').replace(/"/g,'""')+'"';
  const downloadCsv=(rows,filename,message)=>{
    const csv=rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);toast(message);
  };
  const inPeriod=x=>(!reportFrom||String(x.date||'').slice(0,10)>=reportFrom)&&(!reportTo||String(x.date||'').slice(0,10)<=reportTo)&&(reportPerson==='all'||x.personnelId===reportPerson);
  const filteredOrders=state.orders.filter(inPeriod);
  const filteredDeps=state.deposits.filter(inPeriod);

  if(reportTaskType==='general'){
    const people=state.personnel.filter(p=>reportPerson==='all'||p.id===reportPerson);
    const detailRows=getGeneralReportRows(filteredOrders,filteredDeps);
    const totalClosingBalance=people.reduce((sum,p)=>sum+reportBalanceAt(p.id,reportGeneralEndDate()),0);
    const rows=[
      ['NAMA PERSONIL','PER TANGGAL','SETOR','AMBIL','SALDO AKHIR'],
      ['JUMLAH','',formatIdrCsv(sumDeposits(filteredDeps)),formatIdrCsv(sumOrders(filteredOrders)),formatIdrCsv(totalClosingBalance)]
    ];
    detailRows.forEach(r=>rows.push([r.name,r.date,formatIdrCsv(r.deposited),formatIdrCsv(r.taken),formatIdrCsv(r.balance)]));
    downloadCsv(rows,'laporan-umum-'+todayWIB()+'.csv','Laporan umum beserta akumulasi diunduh.');
    return;
  }

  if(reportTaskType==='orders'){
    const totalQty=filteredOrders.reduce((sum,o)=>sum+(o.items||[]).reduce((qty,item)=>qty+(Number(item.qty)||0),0),0);
    const completed=filteredOrders.filter(o=>o.status==='selesai').length;
    const inProcess=filteredOrders.length-completed;
    const rows=[
      ['JENIS','TANGGAL','PERSONIL','RINCIAN','NOMINAL','STATUS'],
      ['JUMLAH ('+filteredOrders.length+' transaksi)','','','Total kuantitas item: '+totalQty,formatIdrCsv(sumOrders(filteredOrders)),'Selesai: '+completed+'; Proses: '+inProcess]
    ];
    filteredOrders.forEach(x=>rows.push(['Order',String(x.date||'').slice(0,10),personName(x.personnelId),(x.items||[]).map(i=>i.name+' x '+i.qty).join('; '),formatIdrCsv(x.total),x.status]));
    downloadCsv(rows,'laporan-order-'+todayWIB()+'.csv','Laporan order beserta akumulasi diunduh.');
    return;
  }

  const totalTurnover=filteredDeps.reduce((sum,d)=>sum+(Number(d.turnover)||0),0);
  const totalIncome=filteredDeps.reduce((sum,d)=>sum+(Number(d.income)||0),0);
  const accepted=filteredDeps.filter(d=>d.status==='diterima').length;
  const waiting=filteredDeps.length-accepted;
  const rows=[
    ['JENIS','TANGGAL','PERSONIL','RINCIAN','NOMINAL','STATUS'],
    ['JUMLAH ('+filteredDeps.length+' transaksi)','','','Omset: '+formatIdrCsv(totalTurnover)+'; Penghasilan: '+formatIdrCsv(totalIncome),formatIdrCsv(sumDeposits(filteredDeps)),'Diterima: '+accepted+'; Menunggu: '+waiting]
  ];
  filteredDeps.forEach(x=>rows.push(['Setor',String(x.date||'').slice(0,10),personName(x.personnelId),'Omset '+formatIdrCsv(x.turnover)+'; Penghasilan '+formatIdrCsv(x.income),formatIdrCsv(x.amount),x.status]));
  downloadCsv(rows,'laporan-setor-'+todayWIB()+'.csv','Laporan setor beserta akumulasi diunduh.');
}

function jmObservePageRender(){
  const who=jmPageIdentity();
  if(!who){jmPageTrail=[];jmTrailIdentity='';jmLastRenderedPage=null;return;}
  if(who!==jmTrailIdentity){jmTrailIdentity=who;jmPageTrail=[];jmLastRenderedPage=page;return;}

    if(!jmSuppressNextPageTrail){jmPageTrail.push(jmLastRenderedPage);if(jmPageTrail.length>30)jmPageTrail.shift();}
    jmSuppressNextPageTrail=false;

  }
}

  const adminPages=['overview','tasks','items','personnel','reports','settings'];
  const personnelPages=['overview','order','deposit'];
  if(!(currentUser.role==='admin'?adminPages:personnelPages).includes(previousPage))return;
  jmSuppressNextPageTrail=true;
  page=previousPage;
  persistSession();
  render();
  window.scrollTo({top:0,behavior:'auto'});
}

/* Aktivitas personil berbasis interaksi: tidak ada polling cloud. Kirim satu penanda maksimal tiap 5 menit, hanya saat personil benar-benar berinteraksi. */
function jmTrackPersonnelActivity(event){if(!currentUser||currentUser.role!=='personnel')return;const now=Date.now(),person=state.personnel.find(p=>p.id===currentUser.id);if(person)person.lastActivityAt=new Date(now).toISOString();if(!hasGas()||!sessionToken){if(now-lastPersonnelActivitySent>=PERSONNEL_ACTIVITY_TOUCH_MS){lastPersonnelActivitySent=now;saveLocal()}return;}const target=event&&event.target&&event.target.closest?event.target.closest('button,input,select,textarea,a,[role=button]'):null;if(target&&target.closest('form')&&(target.matches('button[type=submit],input[type=submit]')))return;if(personnelActivityTouchBusy||now-lastPersonnelActivitySent<PERSONNEL_ACTIVITY_TOUCH_MS)return;lastPersonnelActivitySent=now;personnelActivityTouchBusy=true;gasCall('personnelTouchActivity',sessionToken).then(r=>{const p=state.personnel.find(x=>x.id===currentUser?.id);if(p&&r&&r.lastActivityAt)p.lastActivityAt=r.lastActivityAt}).catch(()=>{lastPersonnelActivitySent=Date.now()-PERSONNEL_ACTIVITY_TOUCH_MS+15000}).finally(()=>{personnelActivityTouchBusy=false})}
document.addEventListener('pointerdown',jmTrackPersonnelActivity,{passive:true});document.addEventListener('keydown',jmTrackPersonnelActivity);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')jmTrackPersonnelActivity({target:document.activeElement})});
/* Pembaruan waktu relatif ini berjalan lokal di browser saja dan tidak menghubungi Apps Script. */
setInterval(function(){if(!currentUser||currentUser.role!=='admin')return;const now=Date.now();if(page==='overview'&&!document.querySelector('.modal-backdrop'))render();document.querySelectorAll('.personnel-activity-age').forEach(function(el){const stamp=Number(el.getAttribute('data-last-activity')||0);if(!stamp||now-stamp>=PERSONNEL_ACTIVITY_WINDOW_MS){const card=el.closest('[data-personnel-activity-card]');if(card)card.remove();return;}el.textContent=personnelActivityRelative(new Date(stamp).toISOString(),now);});const grid=document.querySelector('.personnel-activity-list');if(grid&&!grid.querySelector('[data-personnel-activity-card]'))grid.innerHTML='<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">Tidak ada aktivitas personil dalam 24 jam terakhir</div><div class="empty-sub">Personil akan muncul kembali saat login atau melakukan aktivitas.</div></div>';},60000);

/* Entry riwayat penjaga: saat Back/gesture browser terjadi, tetap di aplikasi. */
function jmInstallHistoryGuard(){
  try{history.pushState({__jmAppGuard:true,stamp:Date.now()},'',location.href);}catch(_){}
}
window.addEventListener('popstate',function(){
  jmGoBackInsideApp();
  jmInstallHistoryGuard();
});
/* Di halaman Ringkasan, empat usap tepi dalam 10 detik meminta konfirmasi keluar (logout). */
let jmOverviewExitSwipeCount=0, jmOverviewExitLastSwipeAt=0;
function jmHandleEdgeSwipe(){
  if(document.querySelector('.modal-backdrop')){jmGoBackInsideApp();return;}
  if(currentUser&&page==='overview'){
    const now=Date.now();
    if(now-jmOverviewExitLastSwipeAt>10000)jmOverviewExitSwipeCount=0;
    jmOverviewExitLastSwipeAt=now;
    jmOverviewExitSwipeCount++;
    if(jmOverviewExitSwipeCount>=4){
      jmOverviewExitSwipeCount=0;
      if(confirm('Keluar dari aplikasi JM Operasional? Anda akan kembali ke halaman login.'))logout();
    }
    return;
  }
  jmOverviewExitSwipeCount=0;
  jmGoBackInsideApp();
}
/* Isyarat usap ke dalam dari tepi kiri atau tepi kanan. */
document.addEventListener('touchstart',function(e){
  if(!e.touches||e.touches.length!==1){jmEdgeTouchStart=null;return;}
  const t=e.touches[0], width=window.innerWidth||document.documentElement.clientWidth;
  const edge=(t.clientX<=30)?'left':(t.clientX>=width-30?'right':'');
  jmEdgeTouchStart=edge?{x:t.clientX,y:t.clientY,edge,backTriggered:false}:null;
},{passive:true});
document.addEventListener('touchmove',function(e){
  const start=jmEdgeTouchStart;
  if(!start||!e.touches||e.touches.length!==1)return;
  const t=e.touches[0], dx=t.clientX-start.x, dy=t.clientY-start.y;
  const inward=start.edge==='left'?dx>=65:dx<=-65;
  if(inward&&Math.abs(dx)>Math.abs(dy)*1.25){start.backTriggered=true;if(e.cancelable)e.preventDefault();}
},{passive:false});
document.addEventListener('touchend',function(e){
  const start=jmEdgeTouchStart;jmEdgeTouchStart=null;
  if(!start||!e.changedTouches||!e.changedTouches.length)return;
  const t=e.changedTouches[0], dx=t.clientX-start.x, dy=t.clientY-start.y;
  const inward=start.edge==='left'?dx>=65:dx<=-65;
  if(inward&&Math.abs(dx)>Math.abs(dy)*1.25){if(e.cancelable)e.preventDefault();jmHandleEdgeSwipe();}
},{passive:false});
/* Pasang penjaga sebelum pemulihan sesi; kegagalan pushState tidak menghentikan aplikasi. */
jmInstallHistoryGuard();
restoreSession();
</script></body></html>
