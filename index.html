function receiptDateTime(x){const bits=String(x.date||todayWIB()).slice(0,10).split('-').map(Number);const dt=x.createdAt?new Date(x.createdAt):new Date();const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(dt);const hh=parts.find(v=>v.type==='hour')?.value||'00',mm=parts.find(v=>v.type==='minute')?.value||'00';const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];const day=String(bits[2]||dt.getDate()).padStart(2,'0'),month=months[(bits[1]||dt.getMonth()+1)-1]||months[0],year=bits[0]||dt.getFullYear();return `${day} ${month} ${year}, ${hh}.${mm}`}
function receiptAmount(v){return 'Rp '+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Number(v)||0)}
function receiptAscii(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'?')}
function receiptLine(left,right,width=32){left=receiptAscii(left);right=receiptAscii(right);if(right.length>=width)right=right.slice(0,width-1);const maxLeft=Math.max(1,width-right.length-1);if(left.length>maxLeft)left=left.slice(0,maxLeft-1)+'~';return left+' '.repeat(Math.max(1,width-left.length-right.length))+right}
function receiptText(type,x){const width=32,lines=[];lines.push('Tgl      : '+receiptDateTime(x));const person=receiptAscii(personName(x.personnelId));const firstPerson=person.slice(0,21);lines.push('Personil : '+firstPerson);let restPerson=person.slice(21);while(restPerson.length){lines.push('           '+restPerson.slice(0,21));restPerson=restPerson.slice(21)}lines.push('='.repeat(width));if(type==='order'){(x.items||[]).forEach(it=>{const name=receiptAscii(it.name||'Item');const qty=Math.max(0,Number(it.qty)||0);const amount=Number(it.subtotal??((Number(it.price)||0)*qty));lines.push(receiptLine(`${name} ${qty} x`,'= '+receiptAmount(amount),width));});lines.push('-'.repeat(width));lines.push(receiptLine('TOTAL',': '+receiptAmount(x.total),width));}else{lines.push(receiptLine('Omset',' : '+receiptAmount(x.turnover),width));lines.push(receiptLine('Penghasilan',' : '+receiptAmount(x.income),width));lines.push('-'.repeat(width));lines.push(receiptLine('TOTAL SETOR',': '+receiptAmount(x.amount),width));}lines.push('');lines.push('');lines.push('');return lines.join('\n')+'\n'}
function makeEscPosReceipt(type,x){const encoder=new TextEncoder(),lines=receiptText(type,x).split('\n'),out=[0x1b,0x40,0x1b,0x61,0x00,0x1b,0x21,0x00];for(const line of lines){const bold=line.startsWith('TOTAL');if(bold)out.push(0x1b,0x45,0x01);out.push(...encoder.encode(line+'\n'));if(bold)out.push(0x1b,0x45,0x00)}out.push(0x1b,0x64,0x03);return new Uint8Array(out);}
async function findPrinterWriteCharacteristic(server){let services=[];try{services=await server.getPrimaryServices()}catch(e){}const prefer=['0000ffe0-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb','6e400001-b5a3-f393-e0a9-e50e24dcca9e','49535343-fe7d-4ae5-8fa9-9fafd205e455'];for(const id of prefer){const svc=services.find(s=>String(s.uuid).toLowerCase()===id);if(!svc)continue;try{const chars=await svc.getCharacteristics();const c=chars.find(v=>v.properties.writeWithoutResponse||v.properties.write);if(c)return c}catch(e){}}return null}
async function writeBluetoothChunks(ch,data){const chunkSize=20;for(let i=0;i<data.length;i+=chunkSize){const part=data.slice(i,Math.min(i+chunkSize,data.length));if(ch.properties.writeWithoutResponse&&typeof ch.writeValueWithoutResponse==='function')await ch.writeValueWithoutResponse(part);else if(ch.properties.write&&typeof ch.writeValueWithResponse==='function')await ch.writeValueWithResponse(part);else if(typeof ch.writeValue==='function')await ch.writeValue(part);else throw new Error('Karakteristik printer tidak mendukung penulisan data.');await new Promise(resolve=>setTimeout(resolve,18))}}
async function printRecord(type,rid){const x=type==='order'?state.orders.find(t=>t.id===rid):state.deposits.find(t=>t.id===rid);if(!x)return;const browserSupported=!!(window.isSecureContext&&navigator.bluetooth&&navigator.bluetooth.requestDevice);if(!browserSupported){openModal('Printer Bluetooth 58 mm',`<div class="panel"><b>Web Bluetooth tidak tersedia di browser ini.</b><p>Gunakan Google Chrome di Android dan buka aplikasi melalui URL HTTPS. Fitur pencarian perangkat mendukung printer Bluetooth Low Energy (BLE) dengan profil GATT yang kompatibel.</p><p>Bila printer Anda Bluetooth Classic / SPP, browser tidak dapat mengirim langsung melalui Web Bluetooth.</p></div><div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button><button class="btn btn-primary" onclick="printRecordBrowser('${type}',${JSON.stringify(String(rid))})">Cetak via browser</button></div>`);return}let device=null;try{toast('Pilih perangkat printer Bluetooth…');device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_PRINTER_SERVICES});if(!device.gatt)throw new Error('Perangkat yang dipilih tidak menyediakan layanan Bluetooth GATT.');toast('Menghubungkan ke '+(device.name||'printer')+'…');const server=await device.gatt.connect();const ch=await findPrinterWriteCharacteristic(server);if(!ch){try{device.gatt.disconnect()}catch(e){}openModal('Profil printer tidak cocok',`<div class="panel"><b>${esc(device.name||'Printer Bluetooth')} terhubung, tetapi profil cetaknya tidak dikenali.</b><p>Aplikasi mencari profil printer BLE umum (FFE0/FFE1, 18F0/2AF1, Nordic UART, dan profil serial sejenis). Banyak printer 58 mm memakai Bluetooth Classic / SPP sehingga tidak dapat dicetak langsung menggunakan Web Bluetooth.</p></div><div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button><button class="btn btn-primary" onclick="printRecordBrowser('${type}',${JSON.stringify(String(rid))})">Cetak via browser</button></div>`);return}const payload=makeEscPosReceipt(type,x);await writeBluetoothChunks(ch,payload);try{device.gatt.disconnect()}catch(e){}toast('Nota berhasil dikirim ke '+(device.name||'printer Bluetooth')+'.')}catch(err){if(device?.gatt?.connected){try{device.gatt.disconnect()}catch(e){}}if(err?.name==='NotFoundError'||err?.name==='AbortError'){toast('Pemilihan printer dibatalkan.','bad');return}openModal('Cetak nota gagal',`<div class="panel"><b>${esc(err?.message||'Printer gagal menerima data.')}</b><p>Pastikan printer menyala, telah diisi kertas, dan mendukung Bluetooth BLE/GATT dengan perintah ESC/POS. Untuk printer Bluetooth Classic / SPP, gunakan aplikasi penghubung printer atau cetak melalui dialog browser.</p></div><div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button><button class="btn btn-primary" onclick="printRecordBrowser('${type}',${JSON.stringify(String(rid))})">Cetak via browser</button></div>`,'wide')}}
function printRecordBrowser(type,rid){const x=type==='order'?state.orders.find(t=>t.id===rid):state.deposits.find(t=>t.id===rid);if(!x)return;const text=receiptText(type,x).split('\n');const body=text.map((line,i)=>`<div class="${i===0||line.startsWith('TOTAL')||line.startsWith('TOTAL SETOR')?'pr-bold':''} ${line==='='.repeat(32)||line==='-'.repeat(32)?'pr-rule':''}">${esc(line)||'&nbsp;'}</div>`).join('');document.getElementById('modalRoot').innerHTML=`<div class="print-fallback-area">${body}</div>`;closeModalForPrint();setTimeout(()=>window.print(),100);setTimeout(()=>{document.getElementById('modalRoot').innerHTML=''},1500)}
function closeModalForPrint(){const bd=document.querySelector('#modalRoot .modal-backdrop');if(bd)bd.remove()}
// Sesuai alur video: metrik Total Order/Total Setor membuka daftar status, bukan popup admin Detail personil.
function openPersonMetric(type){openPersonStatusList(type)}
function copyText(text,msg='Disalin'){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>fallbackCopy(text,msg))}else fallbackCopy(text,msg)}
function fallbackCopy(text,msg){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('Gagal menyalin.','bad')}ta.remove()}
function getPersonnelAppLink(base){const raw=String(base||'').trim();if(!raw)return '';try{const u=new URL(raw);u.searchParams.set('role','personnel');return u.toString()}catch(e){return raw+(raw.includes('?')?'&':'?')+'role=personnel'}}
function openSettingModal(which,force=false,old=''){modalData.setting=which;let title='',body='';if(which==='outlet'){title='Pengaturan outlet';body=`<form onsubmit="saveOutlet(event)"><div class="field"><label>Nama outlet</label><input id="outletName" value="${esc(state.settings.outletName||'')}" required></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan</button></div></form>`}else if(which==='navigation'){title='Navigasi menu admin';const vis=state.settings.visibleMenus||{};body=`<form onsubmit="saveNavigation(event)"><p class="hint">Hilangkan centang untuk menyembunyikan menu dari navigasi admin.</p>${[['overview','Ringkasan','◈'],['tasks','Tugas','📋'],['items','Item','📦'],['personnel','Personil','🧑‍🤝‍🧑'],['reports','Laporan','📈']].map(m=>`<label class="checkline"><input type="checkbox" name="navMenu" value="${m[0]}" ${vis[m[0]]!==false?'checked':''}> <span>${m[2]} &nbsp; ${m[1]}</span></label>`).join('')}<div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan navigasi</button></div></form>`}else if(which==='limits'){title='Batas personil';body=`<form onsubmit="saveLimits(event)"><div class="field"><label>Batas nominal saldo akhir (Rp)</label><input id="maxBalance" type="number" min="0" value="${Number(state.settings.maxBalance)||0}" required><div class="hint">Saldo personil yang melampaui angka ini mendapat peringatan.</div></div><div class="field" style="margin-top:13px"><label>Batas waktu tidak setor (hari)</label><input id="daysNoDeposit" type="number" min="0" max="365" value="${Number(state.settings.daysWithoutDeposit)||0}" required><div class="hint">Jika melewati jumlah hari ini sejak setor terakhir, status akan ditandai terlambat.</div></div><div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan batas</button></div></form>`}else if(which==='password'){title='Ubah sandi admin';body=`<form onsubmit="savePassword(event)"><div class="field"><label>Sandi lama</label><input id="oldPassword" type="password" required value="${force?esc(old):''}" autocomplete="current-password"></div><div class="field" style="margin-top:12px"><label>Sandi baru</label><input id="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter"></div><div class="field" style="margin-top:12px"><label>Ulangi sandi baru</label><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></div>${force?`<div class="warning-box" style="margin-top:12px">Sandi bawaan terdeteksi. Ubah sandi terlebih dahulu sebelum memakai aplikasi.</div>`:''}<div class="form-actions"><button type="button" class="btn btn-ghost" onclick="${force?'logout()':'closeModal()'}">${force?'Keluar':'Batal'}</button><button class="btn btn-primary">Ubah sandi</button></div></form>`}else if(which==='cloud'){title='Cloud & backup';const url=state.settings.cloudUrl||'';const personLink=getPersonnelAppLink(url);body=`<div class="field"><label>URL Web App / koneksi backend</label><input id="cloudUrl" type="url" value="${esc(url)}" placeholder="https://script.google.com/macros/s/.../exec"><div class="hint">URL deployment ini menjadi koneksi aplikasi cloud. Personil tidak perlu memasukkan URL backend.</div></div><div class="field" style="margin-top:13px"><label>Link aplikasi untuk personil</label><div style="display:flex;gap:8px"><input id="personAppLink" value="${esc(personLink||'Simpan URL Web App terlebih dahulu')}" readonly><button type="button" class="btn btn-soft btn-xs" onclick="copyText(document.getElementById('personAppLink').value,'Link aplikasi personil disalin')">Copy</button></div><div class="hint">Link ini membuka langsung login Personil. Personil cukup memasukkan kode aktivasi.</div></div><div class="form-actions" style="justify-content:flex-start"><button type="button" class="btn btn-soft btn-xs" onclick="saveCloudUrl()">Simpan URL</button><button type="button" class="btn btn-soft btn-xs" onclick="testCloud()">☁️ Tes cloud</button><button type="button" class="btn btn-primary btn-xs" onclick="sendCloud()">↑ Kirim cloud</button><button type="button" class="btn btn-ghost btn-xs" onclick="pullCloud()">↓ Tarik cloud</button></div><div class="line-divider"></div><div class="field"><label>Kode Code.gs satu baris</label><textarea class="input code-area" id="gsOneLine" rows="4" readonly>${esc(SCRIPT_GS_ONELINE)}</textarea><div class="form-actions" style="margin-top:8px"><button type="button" class="btn btn-soft btn-xs" onclick="copyText(document.getElementById('gsOneLine').value,'Kode Code.gs disalin')">▣ Copy kode 1 baris</button></div><div class="hint">Berkas Code.gs lengkap juga tersedia di paket aplikasi; gunakan versi file untuk pemeliharaan. Kode satu baris ini disediakan untuk kebutuhan salin-tempel.</div></div><div class="line-divider"></div><div class="form-actions" style="justify-content:flex-start"><button type="button" class="btn btn-ghost btn-xs" onclick="backupJSON()">⬇ Backup JSON</button><label class="btn btn-ghost btn-xs" for="restoreFile">⬆ Restore JSON</label><input id="restoreFile" type="file" accept="application/json,.json" class="hidden" onchange="restoreJSON(event)"></div><div class="hint" style="margin-top:8px">Backup menyimpan daftar item, personil, order, setor, dan pengaturan. Simpan file di lokasi aman.</div>`}else{title='Info aplikasi';body=infoHTML()}openModal(title,body,which==='cloud')}
function infoHTML(){return `<div class="card-top"><span class="card-icon">✨</span><div><div class="card-title">JM Operasional v1.0</div><div class="card-meta">Role-Based Access System · Admin & Personil</div></div></div><div class="line-divider"></div><p class="card-meta" style="line-height:1.8">Mode data: <b>${hasGas()?'Google Apps Script / Google Sheets':'localStorage browser'}</b><br>Update antar halaman pada browser yang sama memakai event storage/BroadcastChannel tanpa interval polling. Sinkronisasi cloud dipanggil ketika data berubah atau pengguna melakukan tarik cloud.<br><br>Apps Script tidak dapat mendorong perubahan instan ke semua perangkat tanpa mekanisme realtime eksternal.</p>`}
async function saveOutlet(e){e.preventDefault();state.settings.outletName=document.getElementById('outletName').value.trim();try{await syncSave();closeModal();render();toast('Nama outlet disimpan.')}catch(err){toast(err.message,'bad')}}
async function saveNavigation(e){e.preventDefault();const v={};document.querySelectorAll('input[name="navMenu"]').forEach(x=>v[x.value]=x.checked);v.settings=true;state.settings.visibleMenus=v;if(page==='overview'&&!v.overview)page='tasks';try{await syncSave();closeModal();render();toast('Navigasi diperbarui.')}catch(err){toast(err.message,'bad')}}
async function saveLimits(e){e.preventDefault();state.settings.maxBalance=Number(document.getElementById('maxBalance').value);state.settings.daysWithoutDeposit=Number(document.getElementById('daysNoDeposit').value);try{await syncSave();closeModal();render();toast('Batas personil disimpan.')}catch(err){toast(err.message,'bad')}}
async function savePassword(e){e.preventDefault();const old=document.getElementById('oldPassword').value,n=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(n!==c)return toast('Konfirmasi sandi tidak cocok.','bad');try{if(hasGas()){await gasCall('changeAdminPassword',sessionToken,old,n)}else{if(old!==(state.settings.adminPassword||'admin123'))return toast('Sandi lama salah.','bad');state.settings.adminPassword=n;saveLocal()}mustChange=false;closeModal();toast('Sandi admin berhasil diubah.')}catch(err){toast(err.message||'Gagal mengubah sandi.','bad')}}
async function saveCloudUrl(){state.settings.cloudUrl=document.getElementById('cloudUrl').value.trim();try{await syncSave();const link=document.getElementById('personAppLink');if(link)link.value=getPersonnelAppLink(state.settings.cloudUrl)||'URL belum diisi';toast('URL backend disimpan; link khusus personil diperbarui.')}catch(err){toast(err.message,'bad')}}
async function testCloud(){try{if(hasGas()){const r=await gasCall('cloudTest',sessionToken);toast('Cloud OK · '+r.message);if(r.spreadsheetUrl)openModal('Tes cloud berhasil',`<p class="card-meta">${esc(r.message)}</p><p><a href="${esc(r.spreadsheetUrl)}" target="_blank" rel="noopener">Buka spreadsheet database ↗</a></p>`)}else{const u=document.getElementById('cloudUrl').value.trim();if(!u)return toast('Masukkan URL Web App dahulu.','bad');const r=await fetch(u,{method:'GET',mode:'no-cors'});toast('Permintaan tes dikirim. Status cross-origin mungkin tidak dapat dibaca pada mode lokal.')}}catch(err){toast('Tes cloud gagal: '+err.message,'bad')}}
async function sendCloud(){if(!hasGas()){state.settings.cloudUrl=document.getElementById('cloudUrl').value.trim();saveLocal();return toast('Mode lokal: data demo disimpan di perangkat, belum dikirim ke cloud.','bad')}try{state.settings.cloudUrl=document.getElementById('cloudUrl').value.trim()||state.settings.cloudUrl;const r=await gasCall('adminSaveState',sessionToken,state);if(r.state)state=r.state;toast('Data berhasil dikirim ke cloud.')}catch(err){toast('Kirim cloud gagal: '+err.message,'bad')}}
async function pullCloud(){if(!hasGas())return toast('Tarik cloud tersedia setelah aplikasi dipasang melalui Apps Script.','bad');try{const r=await gasCall('getAppState',sessionToken);state=r.state;if(r.webAppUrl)state.settings.cloudUrl=state.settings.cloudUrl||r.webAppUrl;render();closeModal();toast('Data cloud berhasil ditarik.')}catch(err){toast('Tarik cloud gagal: '+err.message,'bad')}}
function backupJSON(){const blob=new Blob([JSON.stringify({app:'JM Operasional',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='jm-operasional-backup-'+todayWIB()+'.json';a.click();URL.revokeObjectURL(u);toast('Backup JSON dibuat.')}
async function restoreJSON(e){const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text()),s=obj.state||obj;if(!s.settings||!Array.isArray(s.items)||!Array.isArray(s.personnel)||!Array.isArray(s.orders)||!Array.isArray(s.deposits))throw new Error('Struktur file tidak sesuai backup JM Operasional.');if(!confirm('Restore akan mengganti data aplikasi saat ini. Lanjutkan?'))return;state=s;await syncSave();closeModal();render();toast('Restore JSON berhasil.')}catch(err){toast('Restore gagal: '+err.message,'bad')}finally{e.target.value=''}}
function exportReport(){const rows=[['jenis','tanggal','personil','rincian','nominal','status']];state.orders.filter(x=>(!reportFrom||x.date>=reportFrom)&&(!reportTo||x.date<=reportTo)&&(reportPerson==='all'||x.personnelId===reportPerson)).forEach(x=>rows.push(['order',x.date,personName(x.personnelId),(x.items||[]).map(i=>i.name+' x '+i.qty).join('; '),x.total,x.status]));state.deposits.filter(x=>(!reportFrom||x.date>=reportFrom)&&(!reportTo||x.date<=reportTo)&&(reportPerson==='all'||x.personnelId===reportPerson)).forEach(x=>rows.push(['setor',x.date,personName(x.personnelId),'Omset '+x.turnover+'; penghasilan '+x.income,x.amount,x.status]));const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='laporan-operasional-'+todayWIB()+'.csv';a.click();URL.revokeObjectURL(url);toast('Laporan CSV diunduh.')}
restoreSession();
