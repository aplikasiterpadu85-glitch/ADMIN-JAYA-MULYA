/* Popup Tugas Admin: order ringkas tanpa scroll mendatar, Qty dua digit, dan tombol hapus di sebelah subtotal. */
.order-edit-list{display:flex;flex-direction:column;gap:8px;width:100%;min-width:0}
.order-edit-row{display:grid;grid-template-columns:minmax(0,1fr) 50px minmax(88px,auto) 32px;align-items:center;gap:8px;padding:10px;border:1px solid #dfebf6;border-radius:13px;background:linear-gradient(145deg,#fff,#f6fbff);box-shadow:0 3px 8px rgba(45,93,139,.06);min-width:0}
.order-edit-item{display:flex;flex-direction:column;gap:4px;min-width:0}
.order-edit-item b{font-size:12px;font-weight:950;color:#284f73;line-height:1.25;overflow-wrap:anywhere}
.order-edit-item span{font-size:10px;color:#8298ac;white-space:normal}
.order-edit-qty{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.order-edit-qty label,.order-edit-sub small{font-size:9px;color:#7c93a8;font-weight:850;text-transform:uppercase;letter-spacing:.35px}
.order-edit-row .qty-input.compact-qty{box-sizing:border-box;width:48px;min-width:0;height:34px;padding:5px 2px;font-size:13px;font-weight:900;border-radius:9px;background:#f8fcff}
.order-edit-sub{display:flex;flex-direction:column;gap:4px;align-items:flex-end;min-width:0}
.order-edit-sub b{font-size:11px;font-weight:950;color:#255e96;white-space:nowrap}
.order-item-delete{width:30px;height:30px;border-radius:9px;border:1px solid #ffd5dc;color:#d7354f;background:linear-gradient(145deg,#fff,#ffe9ed);font-size:20px;line-height:1;font-weight:900;display:grid;place-items:center;box-shadow:2px 3px 5px rgba(175,50,70,.1),inset 1px 1px 2px #fff}
.order-item-delete:active{transform:translateY(1px) scale(.96)}
.order-edit-empty{padding:13px;text-align:center;border:1px dashed #dfbdc3;border-radius:12px;color:#b64c5c;background:#fff8f9;font-size:12px}
.task-order-edit-form .field.full{min-width:0}
.task-order-edit-form .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
/* Popup setor: total setor paling menonjol; omset dan penghasilan menjadi informasi pendukung yang ringkas. */
.deposit-edit-summary{margin:14px 0;padding:13px;border-radius:17px;border:1px solid #f7d3d9;background:linear-gradient(145deg,#fffafb,#fff1f3);box-shadow:0 6px 15px rgba(178,51,69,.07),inset 1px 1px 2px #fff}
.deposit-edit-minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.deposit-edit-mini{min-width:0;padding:8px 9px;border-radius:11px;background:rgba(255,255,255,.82);border:1px solid #f5e3e5}
.deposit-edit-mini span{display:block;font-size:9px;font-weight:900;color:#9d8990;letter-spacing:.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deposit-edit-mini b{display:block;margin-top:4px;font-size:12px;font-weight:850;color:#6d7280;overflow-wrap:anywhere;line-height:1.25}
.deposit-edit-grand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;padding:12px 13px;border-radius:13px;background:linear-gradient(145deg,#fff0f2,#ffe0e5);border:1px solid #ffc7d0;box-shadow:0 5px 0 #efb2bd,0 8px 13px rgba(196,40,65,.12),inset 0 1px 0 #fff}
.deposit-edit-grand span{font-size:11px;font-weight:1000;color:#a82d43;letter-spacing:.5px}
.deposit-edit-grand strong{font-size:clamp(21px,5.5vw,30px);line-height:1.1;font-weight:1000;color:#d51f3e;text-align:right;overflow-wrap:anywhere}
.deposit-edit-grid .field label{font-size:10px;color:#8292a3}
.deposit-edit-grid .field input{padding:10px;font-size:12px}
.deposit-task-card{padding:12px 13px;border-radius:16px}
.deposit-task-card .card-top{align-items:center;gap:8px}
.deposit-task-card .card-icon{width:35px;height:35px;font-size:19px;border-radius:12px}
.deposit-task-card .card-title{font-size:12px;margin:0 0 3px}
.deposit-task-card .card-meta{font-size:9px}
.deposit-card-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:9px}
.deposit-card-mini{padding:7px 9px;background:#f3f8fd;border:1px solid #e8f0f7;border-radius:10px;min-width:0}
.deposit-card-mini span{display:block;font-size:9px;color:#8b9eaf;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deposit-card-mini b{display:block;font-size:11px;color:#6c8296;font-weight:850;margin-top:3px;overflow-wrap:anywhere}
.deposit-card-total{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:#fff0f2;border:1px solid #ffd6dd}
.deposit-card-total span{font-size:10px;font-weight:900;color:#b43b50}
.deposit-card-total b{font-size:16px;font-weight:1000;color:#d32643;text-align:right;overflow-wrap:anywhere}
.deposit-task-card .card-footer{margin-top:8px;padding-top:8px;gap:6px}
.deposit-task-card .card-footer .btn{padding:7px 8px;font-size:10px}
@media(max-width:430px){
  .modal:has(.task-order-edit-form),.modal:has(.deposit-edit-form){padding:13px}
  .order-edit-row{grid-template-columns:minmax(0,1fr) 45px minmax(78px,auto) 29px;gap:5px;padding:8px}
  .order-edit-row .qty-input.compact-qty{width:43px;height:32px;font-size:12px}
  .order-edit-item b{font-size:11px}
  .order-edit-sub b{font-size:10px}
  .order-item-delete{width:28px;height:28px}
  .deposit-edit-summary{padding:10px;margin:11px 0}
  .deposit-edit-grand{padding:10px}
  .deposit-edit-grand span{font-size:10px}
  .deposit-edit-grand strong{font-size:clamp(19px,5.4vw,25px)}
  .deposit-card-total b{font-size:14px}
  .deposit-task-card .card-footer .btn{flex:1;min-width:0}
}


/* Menu Tugas: kartu transaksi lebih ramping dan pembatas 3D per personil. */
.task-person-groups{display:flex;flex-direction:column;gap:14px;width:100%;min-width:0}
.task-person-group{min-width:0;padding:0 0 10px}
.task-person-divider{display:flex;align-items:center;gap:9px;min-width:0;margin:7px 0 12px;padding:8px 11px;border-radius:13px;background:linear-gradient(145deg,#eaf5ff,#dcecfb);border:1px solid #cfdfef;box-shadow:4px 5px 8px rgba(47,96,143,.12),-3px -3px 7px rgba(255,255,255,.95),inset 1px 1px 2px rgba(255,255,255,.9);color:#426786}
.task-person-divider-icon{display:grid;place-items:center;width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:linear-gradient(145deg,#fff,#cfe6fb);box-shadow:3px 4px 7px rgba(47,96,143,.16),-2px -2px 4px #fff;font-size:16px}
.task-person-divider-label{font-size:9px;letter-spacing:.8px;font-weight:1000;color:#7693ac;white-space:nowrap}
.task-person-divider b{font-size:13px;font-weight:1000;color:#204d77;overflow-wrap:anywhere}
.task-person-divider i{height:4px;flex:1;min-width:12px;border-radius:9px;background:linear-gradient(180deg,#bdd2e4 0%,#fff 52%,#c7dced 100%);box-shadow:0 2px 3px rgba(48,94,135,.12),inset 0 1px 1px rgba(255,255,255,.95)}
.task-person-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));justify-content:start;align-items:start;gap:10px;min-width:0}
.task-order-card,.deposit-task-card{width:100%;max-width:400px;padding:10px 11px;border-radius:15px;box-shadow:0 5px 0 #dbe8f4,0 8px 13px rgba(35,83,130,.09),inset 1px 1px 2px #fff;min-width:0}
.task-order-card .card-top,.deposit-task-card .card-top{gap:7px;align-items:center}
.task-order-card .card-icon,.deposit-task-card .card-icon{width:32px;height:32px;border-radius:10px;font-size:17px;box-shadow:3px 4px 7px #d9e8f6,-2px -2px 5px #fff}
.task-order-card .card-title,.deposit-task-card .card-title{font-size:12px;margin:0 0 2px;line-height:1.25}
.task-order-card .card-meta,.deposit-task-card .card-meta{font-size:9px}
.task-order-items{margin-top:8px;padding:7px 9px;border-radius:9px;background:linear-gradient(145deg,#f7fbff,#eaf4fc);border:1px solid #e0edf8;box-shadow:inset 2px 2px 4px rgba(97,141,181,.08),inset -1px -1px 2px #fff;color:#52718c;font-size:10px;line-height:1.45;overflow-wrap:anywhere}
.task-order-total{font-size:16px;line-height:1.2;font-weight:1000;color:#1c629d;text-align:right;margin:8px 0 3px}
.task-order-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:7px;padding-top:8px;border-top:1px solid #e7f0f8}
.task-order-actions .btn,.deposit-task-card .card-footer .btn{padding:7px 6px;min-width:0;width:100%;font-size:10px;white-space:nowrap}
.deposit-task-card{padding:10px 11px}
.deposit-task-card .deposit-card-summary{gap:5px;margin-top:7px}
.deposit-task-card .deposit-card-mini{padding:6px 7px;border-radius:8px}
.deposit-task-card .deposit-card-mini span{font-size:8px}
.deposit-task-card .deposit-card-mini b{font-size:10px;margin-top:2px}
.deposit-task-card .deposit-card-total{padding:7px 8px;gap:5px;border-radius:9px}
.deposit-task-card .deposit-card-total span{font-size:9px}
.deposit-task-card .deposit-card-total b{font-size:14px}
.deposit-task-card .card-footer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:7px;padding-top:7px;gap:6px}
@media(max-width:430px){.task-person-cards{grid-template-columns:minmax(0,1fr)}.task-order-card,.deposit-task-card{max-width:100%;padding:9px}.task-person-divider{margin-bottom:9px}.task-person-divider b{font-size:12px}.task-order-actions .btn,.deposit-task-card .card-footer .btn{font-size:9px;padding:7px 4px}}


/* Penyeragaman kartu: garis biru 3D untuk kondisi normal, merah tetap khusus saldo berlebih. */
.personnel-card:not(.over-limit){
  border:2px solid #a8d4fb;
  background:linear-gradient(145deg,#ffffff 0%,#f7fbff 72%,#eef8ff 100%);
  box-shadow:0 4px 0 #d7ebfd,0 9px 20px rgba(42,111,171,.13),inset 1px 1px 2px rgba(255,255,255,.98);
}
.personnel-card:not(.over-limit):hover{
  border-color:#70b7f4;
  box-shadow:0 5px 0 #c8e4fc,0 13px 24px rgba(42,111,171,.18),inset 1px 1px 2px #fff;
}
.task-person-groups{gap:12px}
.task-person-group{padding-bottom:9px}
.task-person-divider{
  margin:6px 0 10px;padding:7px 10px;border-radius:12px;
  background:linear-gradient(145deg,#f4faff 0%,#dceeff 55%,#d1e7fb 100%);
  border:1px solid #9dcaf2;
  box-shadow:0 4px 0 #c8e2fa,0 7px 13px rgba(35,105,177,.15),inset 1px 1px 2px #fff;
}
.task-person-divider-icon{
  background:linear-gradient(145deg,#ffffff,#c5e3ff);
  border:1px solid #b5d8f8;
  box-shadow:3px 4px 7px rgba(47,96,143,.18),-2px -2px 4px #fff;
}
.task-person-divider i{background:linear-gradient(180deg,#8bb9e8 0%,#f8fcff 48%,#a6cbed 100%)}
.task-person-cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,275px),310px));
  justify-content:center;align-items:start;gap:9px;min-width:0;
}
.task-order-card,.deposit-task-card{
  width:100%;max-width:310px;min-width:0;padding:8px 9px;border-radius:14px;
  border:2px solid #a7d2f8;
  background:linear-gradient(145deg,#ffffff 0%,#f7fbff 72%,#edf7ff 100%);
  box-shadow:0 4px 0 #cfe5fb,0 8px 14px rgba(35,100,160,.12),inset 1px 1px 2px #fff;
}
.task-order-card .card-top,.deposit-task-card .card-top{gap:6px;align-items:center}
.task-card-heading{flex:1;min-width:0}
.task-order-card .card-icon,.deposit-task-card .card-icon{
  width:29px;height:29px;flex:0 0 29px;border-radius:9px;font-size:15px;
  box-shadow:3px 4px 7px #d9e8f6,-2px -2px 5px #fff;
}
.task-order-card .card-title,.deposit-task-card .card-title{font-size:11px;margin:0 0 1px;line-height:1.2}
.task-order-card .card-meta,.deposit-task-card .card-meta{font-size:8px;line-height:1.2}
.task-order-card .status,.deposit-task-card .status{font-size:8px;padding:4px 6px}
.task-order-items{
  margin-top:6px;padding:5px 7px;border-radius:8px;background:linear-gradient(145deg,#f7fbff,#eaf4fc);
  border:1px solid #d0e5f8;box-shadow:inset 2px 2px 4px rgba(97,141,181,.08),inset -1px -1px 2px #fff;
  color:#52718c;font-size:9px;line-height:1.35;overflow-wrap:anywhere;
}
.task-order-total{font-size:14px;line-height:1.15;font-weight:1000;color:#1c629d;text-align:right;margin:6px 1px 2px}
.task-order-actions,.deposit-task-actions{
  display:grid;grid-template-columns:repeat(5,32px);justify-content:space-between;align-items:center;gap:5px;
  margin-top:6px;padding-top:7px;border-top:1px solid #b9d9f5;
}
.deposit-task-actions{grid-template-columns:repeat(3,32px)}
.task-icon-action{
  display:grid!important;place-items:center;width:32px;height:32px;min-width:32px;max-width:32px;
  padding:0!important;border-radius:10px;font-size:15px!important;line-height:1;
  box-shadow:3px 4px 7px rgba(59,106,151,.13),-2px -2px 4px #fff;
  border:1px solid #d1e5f7;white-space:normal;
}
.task-icon-action:hover{transform:translateY(-2px);box-shadow:0 5px 0 #d4e7f8,0 7px 10px rgba(42,100,154,.16)}
.deposit-task-card .deposit-card-summary{gap:4px;margin-top:6px}
.deposit-task-card .deposit-card-mini{padding:5px 6px;border-radius:7px;border-color:#d8e9f7}
.deposit-task-card .deposit-card-mini span{font-size:8px}
.deposit-task-card .deposit-card-mini b{font-size:9px;margin-top:2px}
.deposit-task-card .deposit-card-total{padding:6px 7px;gap:4px;border-radius:8px}
.deposit-task-card .deposit-card-total span{font-size:8px}
.deposit-task-card .deposit-card-total b{font-size:13px}
@media(max-width:430px){
  .task-person-cards{grid-template-columns:minmax(0,310px);justify-content:center}
  .task-order-card,.deposit-task-card{max-width:min(100%,310px);padding:8px}
  .task-person-divider{margin-bottom:9px;padding:7px 9px}
  .task-person-divider b{font-size:12px}
  .task-order-actions{grid-template-columns:repeat(5,31px)}
  .deposit-task-actions{grid-template-columns:repeat(3,31px)}
  .task-icon-action{width:31px;height:31px;min-width:31px;max-width:31px}
}



/* Penyempurnaan fokus menu Tugas: kartu melebar, dimensi vertikal ringkas, angka lebih menonjol. */
.task-person-groups{gap:8px}
.task-person-group{padding:0 0 4px}
.task-person-divider{width:100%;box-sizing:border-box;margin:3px 0 5px;padding:5px 12px;border-radius:11px}
.task-person-divider-icon{width:26px;height:26px;flex-basis:26px;border-radius:8px;font-size:14px}
.task-person-divider-label{font-size:8px}
.task-person-divider b{font-size:13px}
.task-person-divider i{height:3px}
.task-person-cards{display:grid;grid-template-columns:minmax(0,1fr);justify-content:stretch;gap:6px;width:100%;min-width:0}
.task-order-card,.deposit-task-card{width:100%;max-width:none;box-sizing:border-box;padding:6px 11px;border-radius:13px;border-width:2px;box-shadow:0 3px 0 #cfe5fb,0 6px 10px rgba(35,100,160,.10),inset 1px 1px 2px #fff}
.task-order-card .card-top,.deposit-task-card .card-top{gap:6px;align-items:center}
.task-order-card .card-icon,.deposit-task-card .card-icon{width:25px;height:25px;flex-basis:25px;border-radius:8px;font-size:13px;box-shadow:2px 3px 5px #d9e8f6,-1px -1px 3px #fff}
.task-order-card .card-title,.deposit-task-card .card-title{font-size:11px;margin:0;line-height:1.15}
.task-order-card .card-meta,.deposit-task-card .card-meta{font-size:8px;line-height:1.1}
.task-order-card .status,.deposit-task-card .status{font-size:8px;padding:3px 6px}
.task-order-items{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px;padding:4px 6px;border-radius:8px;font-size:10px;line-height:1.2}
.task-order-item-line{display:inline-flex;align-items:center;gap:5px;max-width:100%;min-width:0;padding:2px 5px;border-radius:7px;background:linear-gradient(145deg,#fff,#e6f3ff);border:1px solid #d0e5f8;box-shadow:1px 2px 3px rgba(42,100,154,.08)}
.task-order-item-name{font-size:10px;font-weight:750;color:#436581;overflow-wrap:anywhere;min-width:0}
.task-order-item-qty{display:inline-grid;place-items:center;flex:0 0 auto;min-width:25px;padding:2px 5px;border-radius:6px;background:linear-gradient(145deg,#d5ebff,#b9ddff);color:#064b8b;font-size:13px;line-height:1.1;font-weight:1000;box-shadow:0 2px 0 #9cc9f0, inset 1px 1px 1px #fff}
.task-order-total{font-size:18px;line-height:1.1;font-weight:1000;color:#124f89;text-align:right;margin:4px 1px 1px}
.task-order-actions,.deposit-task-actions{display:flex;justify-content:flex-end;align-items:center;gap:5px;margin-top:4px;padding-top:5px;border-top:1px solid #b9d9f5}
.task-icon-action{width:25px;height:25px;min-width:25px;max-width:25px;padding:0!important;border-radius:8px;font-size:12px!important;line-height:1;box-shadow:2px 3px 5px rgba(59,106,151,.12),-1px -1px 3px #fff}
.task-icon-action:hover{transform:translateY(-1px);box-shadow:0 3px 0 #d4e7f8,0 4px 7px rgba(42,100,154,.14)}
.deposit-task-card .deposit-card-summary{gap:4px;margin-top:4px}
.deposit-task-card .deposit-card-mini{padding:4px 6px;border-radius:7px}
.deposit-task-card .deposit-card-mini span{font-size:8px}
.deposit-task-card .deposit-card-mini b{font-size:10px;margin-top:1px}
.deposit-task-card .deposit-card-total{padding:4px 7px;gap:4px;border-radius:8px}
.deposit-task-card .deposit-card-total span{font-size:8px}
.deposit-task-card .deposit-card-total b{font-size:18px;line-height:1.1;font-weight:1000;color:#ce1f3b}
.deposit-task-card .card-footer{display:flex;justify-content:flex-end;gap:5px;margin-top:4px;padding-top:5px;border-top:1px solid #b9d9f5}
.order-edit-item b{font-size:24px!important;font-weight:1000!important;color:#073d78!important;line-height:1.12;letter-spacing:-.35px;text-shadow:0 1px 0 #fff}
@media(max-width:430px){
  .task-person-cards{grid-template-columns:minmax(0,1fr);justify-content:stretch}
  .task-order-card,.deposit-task-card{max-width:none;padding:5px 9px}
  .task-person-divider{margin:2px 0 4px;padding:4px 10px}
  .task-person-divider b{font-size:12px}
  .task-order-actions,.deposit-task-actions{gap:4px;margin-top:3px;padding-top:4px}
  .task-icon-action{width:24px;height:24px;min-width:24px;max-width:24px;font-size:11px!important}
  .task-order-item-name{font-size:10px}
  .task-order-item-qty{font-size:13px;min-width:24px}
  .task-order-total{font-size:17px}
  .deposit-task-card .deposit-card-total b{font-size:17px}
  .order-edit-item b{font-size:22px!important}
}


/* Final task-card treatment: personnel name belongs inside each transaction card; no detached name dividers. */
.task-person-cards-flat{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px;width:100%;min-width:0;margin-top:8px}
.task-person-cards-flat .task-order-card,.task-person-cards-flat .deposit-task-card{display:block;width:100%;max-width:none;min-width:0;box-sizing:border-box;margin:0;padding:8px 12px;border:1.5px solid #b8dafa;border-radius:13px;background:linear-gradient(145deg,#fff 0%,#f8fcff 72%,#eef8ff 100%);box-shadow:0 3px 0 #d1e7fa,0 5px 10px rgba(35,100,160,.09),inset 1px 1px 2px #fff}
.task-compact-head{display:flex;align-items:center;justify-content:flex-start;gap:8px;min-width:0;margin:0}
.task-person-cards-flat .task-card-heading{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.task-person-cards-flat .task-order-card .card-title,.task-person-cards-flat .deposit-task-card .card-title{margin:0;color:#45657f;font-size:11px;font-weight:850;line-height:1.2}
.task-person-cards-flat .task-order-card .card-meta,.task-person-cards-flat .deposit-task-card .card-meta{margin:0;color:#1e5485;font-size:13px;line-height:1.25;font-weight:950;overflow-wrap:anywhere}

   Override lebar 100% yang diwarisi dari .task-order-actions .btn. */
.task-order-actions > .task-confirm-action.btn {
  width:auto!important;
  min-width:0!important;
  max-width:fit-content!important;
  flex:0 0 auto!important;
  box-sizing:border-box!important;
  padding:0 7px!important;
  height:28px!important;
  min-height:28px!important;
  font-size:10px!important;
  line-height:1!important;
  gap:4px!important;
  margin:0!important;
  white-space:nowrap!important;
}
.task-order-actions > .task-confirm-action.btn span:first-child {
  font-size:12px!important;
  line-height:1!important;
}
/* Empat tombol aksi lama tetap sejajar di kanan; tidak melebar mengikuti aturan .btn. */
.task-order-actions > .task-existing-actions {
  width:auto!important;
  min-width:0!important;
  max-width:calc(100% - 75px)!important;
  margin-left:auto!important;
}
.task-order-actions > .task-existing-actions > .task-icon-action.btn {
  width:27px!important;
  min-width:27px!important;
  max-width:27px!important;
  flex:0 0 27px!important;
}
@media (max-width:365px) {
  .task-order-actions > .task-confirm-action.btn {
    padding:0 5px!important;
    font-size:9px!important;
    gap:3px!important;
    height:26px!important;
    min-height:26px!important;
  }
  .task-order-actions > .task-existing-actions > .task-icon-action.btn {
    width:24px!important;
    min-width:24px!important;
    max-width:24px!important;
    flex-basis:24px!important;
  }
}

/* V30: hanya tombol Edit pada kartu Tugas Admin; aksi lainnya tetap. */
.task-order-actions .task-existing-actions > .task-icon-action:has(>.jm-action-3d.edit),
.deposit-task-actions > .task-icon-action:has(>.jm-action-3d.edit),
.deposit-task-actions .task-existing-actions > .task-icon-action:has(>.jm-action-3d.edit){
  width:30px!important;min-width:30px!important;max-width:30px!important;
  height:30px!important;flex:0 0 30px!important;padding:0!important;
  border:1px solid #7bb5ed!important;border-radius:9px!important;
  background:linear-gradient(145deg,#ffffff 0%,#dbf0ff 48%,#8ec2f4 100%)!important;
  box-shadow:inset 1px 1px 1px #fff,0 3px 0 #6da3d8,2px 5px 9px rgba(26,84,142,.27)!important;
  overflow:visible!important;position:relative;z-index:1;
}
.task-order-actions .task-existing-actions > .task-icon-action > .jm-action-3d.edit,
.deposit-task-actions .task-icon-action > .jm-action-3d.edit{

  min-width:26px!important;width:26px!important;height:26px!important;
  padding:0!important;border-radius:7px!important;font-size:19px!important;
  line-height:1!important;transform:none!important;
  background:linear-gradient(145deg,#fff9dc,#f9da8a 60%,#dba545)!important;

  box-shadow:inset 1px 1px 1px #fff9eb,0 2px 0 #b88739,1px 3px 5px rgba(76,63,24,.22)!important;
}
.task-order-actions .task-existing-actions > .task-icon-action:has(>.jm-action-3d.edit):hover,
.deposit-task-actions .task-icon-action:has(>.jm-action-3d.edit):hover{

}

  .task-order-actions .task-existing-actions > .task-icon-action:has(>.jm-action-3d.edit){
    width:26px!important;min-width:26px!important;max-width:26px!important;

<style id="jm-v32-task-check-button">
/* V32: ganti ikon Edit pada Admin > Tugas menjadi tombol teks CEK yang ramah lansia.
   Aksi tetap membuka modal detail/edit order atau setor yang sama seperti sebelumnya. */
.task-order-actions .task-check-action,
.deposit-task-actions .task-check-action{
  display:inline-flex!important;align-items:center!important;justify-content:center!important;
  box-sizing:border-box!important;flex:0 0 auto!important;width:auto!important;
  min-width:47px!important;max-width:none!important;height:28px!important;min-height:28px!important;
  margin:0!important;padding:0 9px!important;border:1px solid #d8a12d!important;border-radius:10px!important;
  color:#704500!important;background:linear-gradient(145deg,#fff8d8 0%,#ffdf72 52%,#f4b72d 100%)!important;
  font-size:11px!important;line-height:1!important;font-weight:1000!important;letter-spacing:.25px!important;
  white-space:nowrap!important;text-shadow:0 1px 0 rgba(255,255,255,.8)!important;
  box-shadow:inset 1px 1px 1px rgba(255,255,255,.95),0 4px 0 #bd8318,0 6px 9px rgba(157,104,17,.22)!important;
  cursor:pointer!important;transform:translateY(0);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
}
/* Menjaga tinggi tombol sejajar dengan tombol Terima pada kartu Setor. */
.deposit-task-actions .task-check-action{height:34px!important;min-height:34px!important;padding:0 10px!important;font-size:12px!important;}
.task-order-actions .task-check-action:hover,
.deposit-task-actions .task-check-action:hover{
  transform:translateY(-2px)!important;filter:saturate(1.08)!important;
  box-shadow:inset 1px 1px 1px rgba(255,255,255,.98),0 6px 0 #bd8318,0 8px 12px rgba(157,104,17,.26)!important;
}
.task-order-actions .task-check-action:active,
.deposit-task-actions .task-check-action:active{
  transform:translateY(2px)!important;
  box-shadow:inset 1px 2px 3px rgba(151,99,12,.18),0 1px 0 #bd8318!important;
}
@media(max-width:365px){
  .task-order-actions .task-check-action{min-width:43px!important;height:26px!important;min-height:26px!important;padding:0 7px!important;font-size:10px!important;}
  .deposit-task-actions .task-check-action{min-width:43px!important;height:30px!important;min-height:30px!important;padding:0 7px!important;font-size:10px!important;}
  .task-order-actions>.task-existing-actions{gap:3px!important;}
}
</style>

  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
  outline:0!important;
  color:#104b99!important;
  text-shadow:0 1px 0 rgba(255,255,255,.92), 1px 2px 0 rgba(8,35,94,.45), 2px 4px 3px rgba(18,31,54,.35)!important;
  filter:grayscale(1) sepia(1) saturate(7) hue-rotate(174deg) brightness(.78) drop-shadow(1px 3px 1px rgba(28,40,68,.45))!important;
  transform:translateY(-2px)!important;
  transition:transform .18s ease,filter .18s ease!important;
}
.bottom-nav.admin-nav .nav-item.active .nav-icon,
.bottom-nav.personnel-nav .nav-item.active .nav-icon{
  transform:translateY(-5px) scale(1.10)!important;
  filter:grayscale(1) sepia(1) saturate(7) hue-rotate(174deg) brightness(.78) drop-shadow(2px 5px 2px rgba(20,33,60,.52))!important;
}
/* Merah tegas khusus ikon Order Personil. */
.bottom-nav.personnel-nav .nav-item[data-page="order"] .nav-icon,
.bottom-nav.personnel-nav .nav-item[data-page="order"].active .nav-icon{
  color:#d40b25!important;
  text-shadow:0 1px 0 rgba(255,233,233,.9),1px 2px 0 rgba(117,4,18,.5),2px 4px 3px rgba(100,5,20,.4)!important;
  filter:grayscale(1) sepia(1) saturate(9) hue-rotate(302deg) brightness(.9) drop-shadow(1px 3px 1px rgba(95,6,20,.52))!important;
}
/* Warna masing-masing menu agar jelas di atas latar emas. */
.bottom-nav.admin-nav .nav-item[data-page="tasks"] .nav-icon{filter:grayscale(1) sepia(1) saturate(8) hue-rotate(305deg) brightness(.83) drop-shadow(1px 3px 1px #81322f80)!important}
.bottom-nav.admin-nav .nav-item[data-page="items"] .nav-icon{filter:grayscale(1) sepia(1) saturate(7) hue-rotate(95deg) brightness(.72) drop-shadow(1px 3px 1px #28533280)!important}
.bottom-nav.admin-nav .nav-item[data-page="personnel"] .nav-icon{filter:grayscale(1) sepia(1) saturate(8) hue-rotate(215deg) brightness(.8) drop-shadow(1px 3px 1px #51307580)!important}
.bottom-nav.admin-nav .nav-item[data-page="reports"] .nav-icon{filter:grayscale(1) sepia(1) saturate(8) hue-rotate(155deg) brightness(.7) drop-shadow(1px 3px 1px #234b5b80)!important}
.bottom-nav.admin-nav .nav-item[data-page="settings"] .nav-icon{filter:grayscale(1) sepia(1) saturate(4) hue-rotate(185deg) brightness(.55) drop-shadow(1px 3px 1px #34353c80)!important}
.bottom-nav.personnel-nav .nav-item[data-page="deposit"] .nav-icon{filter:grayscale(1) sepia(1) saturate(7) hue-rotate(99deg) brightness(.67) drop-shadow(1px 3px 1px #265b3280)!important}
.bottom-nav.admin-nav .nav-item:active .nav-icon,
.bottom-nav.personnel-nav .nav-item:active .nav-icon{transform:translateY(0) scale(.96)!important}
</style>
<style id="jm-v72-cart-red">

.bottom-nav.personnel-nav .nav-item[data-page="order"] .nav-icon,
.bottom-nav.personnel-nav .nav-item[data-page="order"].active .nav-icon{filter:none!important;color:#d50020!important;background:transparent!important;box-shadow:none!important}
.bottom-nav.personnel-nav .nav-item[data-page="order"] .jm-red-cart{display:block;width:31px;height:31px;overflow:visible;filter:drop-shadow(1px 2px 0 #7b0918) drop-shadow(1px 4px 2px rgba(87,13,21,.48))}
.bottom-nav.personnel-nav .nav-item[data-page="order"].active .jm-red-cart{filter:drop-shadow(1px 2px 0 #7b0918) drop-shadow(2px 5px 3px rgba(87,13,21,.6))}
</style>

const SCRIPT_GS_ONELINE = "function doGet(e) { if (e && e.parameter && String(e.parameter.jm_health || '') === '1') { return ContentService.createTextOutput('JM Operasional cloud backend aktif.').setMimeType(ContentService.MimeType.TEXT); } try { return HtmlService.createHtmlOutputFromFile('Index').setTitle('JM Operasional').addMetaTag('viewport', 'width=device-width, initial-scale=1'); } catch (err) { return HtmlService.createHtmlOutput('<!doctype html><html><head><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"></head><body style=\"font:16px Arial,sans-serif;max-width:680px;margin:40px auto;padding:20px;color:#234\"><h2>JM Operasional · Backend Cloud</h2><p>Backend aktif. Untuk memakai aplikasi, buka link GitHub Pages JM Operasional yang benar.</p><p>Halaman ini hanya pemeriksaan backend, bukan halaman login aplikasi.</p></body></html>').setTitle('JM Operasional · Backend'); } } function init_() { var p=PropertiesService.getScriptProperties(); if(!p.getProperty('DB_ID')) { var ss=SpreadsheetApp.create('JM Operasional — Database'); p.setProperty('DB_ID',ss.getId()); var sh=ss.getSheets()[0]; sh.setName('APP_DATA'); sh.getRange('A1').setValue('JM_OPERASIONAL_DB'); saveState_(emptyState_()); } if(!p.getProperty('ADMIN_HASH')) p.setProperty('ADMIN_HASH',hash_('admin123')); } function hash_(s) { return Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,String(s),Utilities.Charset.UTF_8).map(function(b){var v=(b<0?b+256:b).toString(16);return v.length===1?'0'+v:v;}).join(''); } function emptyState_() { return {settings:{outletName:'JM Operasional',cloudUrl:'',maxBalance:5000000,daysWithoutDeposit:2,visibleMenus:{overview:true,tasks:true,items:true,personnel:true,reports:true}},items:[],personnel:[],orders:[],deposits:[]}; } function db_() { init_(); return SpreadsheetApp.openById(PropertiesService.getScriptProperties().getProperty('DB_ID')).getSheetByName('APP_DATA'); } function readState_() { var sh=db_(), last=sh.getLastColumn(); if(last<2) return emptyState_(); var cells=sh.getRange(1,2,1,last-1).getValues()[0], raw=''; for(var i=0;i<cells.length;i++){if(cells[i]===''||cells[i]===null)break;raw+=String(cells[i]);} if(!raw)return emptyState_(); try{return JSON.parse(raw);}catch(e){var depth=0,inString=false,escapeNext=false; for(var j=0;j<raw.length;j++){var ch=raw.charAt(j); if(inString){if(escapeNext)escapeNext=false;else if(ch==='\\\\')escapeNext=true;else if(ch==='\\\"')inString=false;continue;} if(ch==='\\\"'){inString=true;continue;} if(ch==='{'||ch==='[')depth++;else if(ch==='}'||ch===']'){depth--;if(depth===0){try{return JSON.parse(raw.slice(0,j+1));}catch(ignore){return emptyState_();}}}} return emptyState_();} } function saveState_(state) { var sh=db_(), raw=JSON.stringify(state), chunks=[]; for(var i=0;i<raw.length;i+=40000) chunks.push(raw.slice(i,i+40000)); var clearCols=Math.max(sh.getLastColumn(),chunks.length+1,2); sh.getRange(1,1,1,clearCols).clearContent(); sh.getRange(1,1).setValue('JM_OPERASIONAL_DB'); if(chunks.length) sh.getRange(1,2,1,chunks.length).setValues([chunks]); return {ok:true,updatedAt:new Date().toISOString()}; } function cleanState_(){var s=readState_(); if(!s.settings)s.settings=emptyState_().settings; if(!s.items)s.items=[];if(!s.personnel)s.personnel=[];if(!s.orders)s.orders=[];if(!s.deposits)s.deposits=[];return s;} function createSession_(role,personnelId) {var token=Utilities.getUuid()+Utilities.getUuid().replace(/-/g,'');var now=Date.now(),session={role:role,personnelId:personnelId||'',createdAt:now,expiresAt:now+30*24*60*60*1000};var p=PropertiesService.getScriptProperties(),all=p.getProperties();Object.keys(all).forEach(function(k){if(k.indexOf('SESS_')===0){try{var old=JSON.parse(all[k]);if(!old.expiresAt||old.expiresAt<now)p.deleteProperty(k);}catch(e){p.deleteProperty(k);}}});var raw=JSON.stringify(session);p.setProperty('SESS_'+token,raw);CacheService.getScriptCache().put('sess_'+token,raw,21600);return token;} function session_(token) {if(!token)throw function hasNativeGas(){return typeof google!=='undefined'&&!!(google.script&&google.script.run)}

function id(){return 'jm-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
function todayWIB(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function fmtDate(d){if(!d)return '—';try{return new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'short',year:'numeric'}).format(new Date(String(d).slice(0,10)+'T12:00:00+07:00'))}catch(e){return d}}

function fmtDateTimeWIB(dateValue,createdAt){const date=fmtDate(dateValue);if(!createdAt)return date;try{return date+', '+fmtClockWIB(new Date(createdAt))}catch(e){return date}}

const PERSONNEL_ACTIVITY_WINDOW_MS=24*60*60*1000,PERSONNEL_ACTIVITY_TOUCH_MS=5*60*1000;let lastPersonnelActivitySent=0,personnelActivityTouchBusy=false;function personnelActivityStamp(p){return p&&(p.lastActivityAt||p.lastLoginAt)||''}function personnelActivityTime(p){const t=Date.parse(personnelActivityStamp(p));return Number.isFinite(t)?t:0}function personnelActivityRecent(p,now=Date.now()){const t=personnelActivityTime(p);return !!t&&now-t<PERSONNEL_ACTIVITY_WINDOW_MS&&now>=t-60000}function personnelActivityRelative(stamp,now=Date.now()){const t=Date.parse(stamp||'');if(!Number.isFinite(t)||t<=0)return 'Belum ada aktivitas tercatat';const ms=Math.max(0,now-t);if(ms<60000)return 'Baru saja';if(ms<3600000)return Math.floor(ms/60000)+' menit lalu';if(ms<86400000)return Math.floor(ms/3600000)+' jam lalu';return Math.floor(ms/86400000)+' hari lalu'}function recentPersonnelActivity(){const now=Date.now();return state.personnel.filter(p=>personnelActivityRecent(p,now)).sort((a,b)=>personnelActivityTime(b)-personnelActivityTime(a))}function personBalanceLimit(p){const custom=p?.specialBalanceLimit;if(custom!==null&&custom!==undefined&&String(custom).trim()!==''){const value=Number(custom);if(Number.isFinite(value)&&value>=0)return value;}const common=Number(state.settings.maxBalance);return Number.isFinite(common)&&common>0?common:Infinity}

function currentPerson(){return state.personnel.find(p=>p.id===currentUser?.id)}
async function logout(){try{if(hasGas()&&sessionToken)await gasCall('personnelLogout',sessionToken)}catch(e){}if(currentUser?.role==='personnel'){const p=state.personnel.find(x=>x.id===currentUser.id);if(p)p.active=false;if(!hasGas())saveLocal()}clearPersistedSession();sessionToken='';currentUser=null;page='overview';renderLogin();toast('Anda telah keluar.')}
function renderApp(){document.body.classList.remove('login-screen-active');const admin=currentUser.role==='admin';const subtitle=admin?'Panel pengelolaan outlet':'Ruang kerja personil';const p=currentPerson();const title=admin?(pageTitle(page)):(page==='overview'?'Ringkasan saldo':page==='order'?'Order barang':'Setor penjualan');const menus=admin?[['overview','RINGKASAN','◈'],['tasks','TUGAS','📋'],['items','ITEM','📦'],['personnel','PERSONIL','🧑‍🤝‍🧑'],['reports','LAPORAN','📈'],['settings','PENGATURAN','⚙️']].filter(m=>m[0]==='settings'||state.settings.visibleMenus?.[m[0]]!==false):[['overview','RINGKASAN','◈'],['order','ORDER',`<svg class="jm-red-cart" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="20" r="1.65" fill="#a00618"/><circle cx="19" cy="20" r="1.65" fill="#a00618"/><path d="M2 3h2.8l2.3 12.1a2 2 0 0 0 2 1.6h9.5a2 2 0 0 0 1.95-1.6L22 7H6" fill="none" stroke="#d50020" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M8.2 9h11.1" fill="none" stroke="#ff6d79" stroke-width="1.45" stroke-linecap="round"/></svg>`],['deposit','SETOR','💸']];const n=notices();document.getElementById('app').innerHTML=`<div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark"><img src="${JM_LOGO_DATA}" alt="Logo JM"></div><div><div class="brand-name">${esc(state.settings.outletName||'JM Operasional')}</div><div class="brand-sub">OPERASIONAL · ${admin?'ADMIN':'PERSONIL'}</div></div></div><div class="top-actions"><div class="pill"><span class="dot"></span> ${hasGas()?'CLOUD':'MODE LOKAL'}</div><div class="user-chip"><div class="avatar">${admin?'👑':'🧑‍💼'}</div><div><b>${esc(currentUser.name)}</b><small>${admin?'Pengelola':'Personil outlet'}</small></div></div><button class="icon-btn logout-btn" title="Keluar" aria-label="Keluar dari aplikasi" onclick="logout()"><svg class="logout-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path></svg></button></div></header><div class="welcome"><div><h1>${title}</h1><p>${subtitle} · ${admin?'Pantau aktivitas dan proses transaksi.':'Kelola saldo, order barang, dan setor Anda.'}</p></div><div class="date-chip">📅 ${fmtDate(todayWIB())} · ${fmtClockWIB()}</div></div><main class="main-content">${admin?renderAdminPage():renderPersonnelPage()}</main></div><nav class="bottom-nav ${admin?'admin-nav':'personnel-nav'}"><div class="nav-inner">${menus.map(m=>`<button data-page="${m[0]}" class="nav-item ${page===m[0]?'active':''}" onclick="setPage('${m[0]}')"><span class="nav-icon">${m[2]}</span><span class="nav-label">${m[1]}</span>${admin&&m[0]==='tasks'&&n.tasks?`<span class="nav-badge">${n.tasks}</span>`:''}</button>`).join('')}</div></nav>`;scheduleWIBDayRollover()}

async function jmSaveDashboardDisplay(e){e.preventDefault();const snapshot=cloneAppStateForRollback();const vis={};document.querySelectorAll('input[name="jmDashVisible"]').forEach(el=>vis[el.value]=el.checked);state.settings.dashboardVisibility=vis;try{await syncSave();closeModal();render();toast('Pengaturan tampilan Ringkasan disimpan.')}catch(err){state=snapshot;toast(err.message||'Gagal menyimpan pengaturan tampilan.','bad')}}
function jmOpenDashboardDisplay(){const options=[['over','Notif saldo melebihi batas'],['late','Notif tidak setor'],['tasks','Notif tugas masuk'],['active','Personil aktif'],['graph','Grafik']];openModal('Tampilan notifikasi & grafik',`<form onsubmit="jmSaveDashboardDisplay(event)"><p class="hint">Centang untuk menampilkan. Hapus centang untuk menyembunyikan dari Ringkasan Admin.</p>${options.map(([key,label])=>`<label class="checkline"><input type="checkbox" name="jmDashVisible" value="${key}" ${jmDashboardVisible(key)?'checked':''}><span>${label}</span></label>`).join('')}<div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan pengaturan</button></div></form>`)}
// Filter grafik Ringkasan Admin; tidak mengubah filter laporan atau transaksi.
let jmGraphType='deposits', jmGraphScope='all', jmGraphPerson='', jmGraphMonth=todayWIB().slice(0,7);
function jmUpdateOverviewGraph(field,value){
 if(field==='type'&&['deposits','orders'].includes(value))jmGraphType=value;
 if(field==='scope'&&['all','person'].includes(value)){jmGraphScope=value;if(value==='person'&&!jmGraphPerson&&state.personnel.length)jmGraphPerson=String(state.personnel[0].id)}
 if(field==='person')jmGraphPerson=value;
 if(field==='month'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(value))jmGraphMonth=value;
 const host=document.getElementById('jmOverviewGraph');if(host)host.innerHTML=jmRenderOverviewGraph();
}
function jmRenderOverviewGraph(){
 const month=/^\d{4}-(0[1-9]|1[0-2])$/.test(jmGraphMonth)?jmGraphMonth:todayWIB().slice(0,7);
 const parts=month.split('-').map(Number),days=new Date(Date.UTC(parts[0],parts[1],0)).getUTCDate();
 const people=state.personnel||[];
 const validPerson=people.some(p=>String(p.id)===String(jmGraphPerson));
 if(!validPerson)jmGraphPerson=people.length?String(people[0].id):'';
 const rows=jmGraphType==='orders'?(state.orders||[]):(state.deposits||[]);
 const sums=Array(days).fill(0);let count=0;
 rows.forEach(r=>{const d=String(r.date||'').slice(0,10),day=Number(d.slice(8,10));if(d.slice(0,7)!==month||day<1||day>days)return;if(jmGraphScope==='person'&&String(r.personnelId)!==String(jmGraphPerson))return;sums[day-1]+=Math.max(0,Number(jmGraphType==='orders'?r.total:r.amount)||0);count++});
 const max=Math.max(1,...sums),total=sums.reduce((a,b)=>a+b,0);
 const label=jmGraphType==='orders'?'Order':'Setor';
 const options=people.map(p=>`<option value="${esc(String(p.id))}" ${String(p.id)===String(jmGraphPerson)?'selected':''}>${esc(p.name)}</option>`).join('');
 const plotWidth=Math.max(850,days*37+72),plotLeft=70,plotRight=20,plotTop=22,baseline=191,plotH=baseline-plotTop;
 const chartMax=max<=1?1:max*1.1;
 const shortNominal=n=>{const a=Math.abs(n);return a>=1e9?(n/1e9).toLocaleString('id-ID',{maximumFractionDigits:1})+' M':a>=1e6?(n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt':a>=1e3?(n/1e3).toLocaleString('id-ID',{maximumFractionDigits:0})+' rb':String(Math.round(n))};
 const grid=[0,1,2,3,4].map(i=>{const v=chartMax*i/4,y=baseline-plotH*i/4;return `<line x1="${plotLeft}" y1="${y}" x2="${plotWidth-plotRight}" y2="${y}" stroke="${i===0?'#abc6db':'#e1edf5'}" stroke-width="1"/><text x="${plotLeft-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#42617e">${shortNominal(v)}</text>`}).join('');
 const step=(plotWidth-plotLeft-plotRight)/days;
 // Batang isometrik 3D: sisi depan, samping, dan bidang atas, dengan nominal pada puncaknya.
 const graphDefs=`<defs><linearGradient id="jmBarFront" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${jmGraphType==='orders'?'#2462c3':'#12895d'}"/><stop offset=".48" stop-color="${jmGraphType==='orders'?'#80bbff':'#58e1ac'}"/><stop offset="1" stop-color="${jmGraphType==='orders'?'#428ce6':'#23b783'}"/></linearGradient></defs>`;
 const bars=sums.map((v,i)=>{
  const x=plotLeft+i*step+step*.13,w=step*.64,h=v/chartMax*plotH,y=baseline-h,day=String(i+1).padStart(2,'0');
  const dx=6,dy=5,front=jmGraphType==='orders'?'#4389e9':'#26b885',side=jmGraphType==='orders'?'#1d56a3':'#087b59',top=jmGraphType==='orders'?'#a7d4ff':'#9af3cd';
  const number=v>0?`<text x="${(x+(w+dx)/2).toFixed(2)}" y="${Math.max(12,y-dy-6).toFixed(2)}" text-anchor="middle" font-size="10" font-weight="800" fill="#214a71" stroke="#fafdff" stroke-width="2.3" paint-order="stroke">${shortNominal(v)}</text>`:'';
  const block=v>0?`<g class="jm-graph-bar3d"><polygon points="${x+w},${y} ${x+w+dx},${y-dy} ${x+w+dx},${baseline-dy} ${x+w},${baseline}" fill="${side}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="url(#jmBarFront)"/><polygon points="${x},${y} ${x+dx},${y-dy} ${x+w+dx},${y-dy} ${x+w},${y}" fill="${top}"/><title>${day}-${month.slice(5)}-${month.slice(0,4)}: ${rupiah(v)}</title></g>${number}`:'';
  return `${block}<text x="${(x+(w+dx)/2).toFixed(2)}" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#42617e">${day}</text>`;
 }).join('');
 return `<div class="jm-graph-heading"><div><strong>Grafik ${label} Bulanan</strong><small>Nominal transaksi per tanggal</small></div><span class="status blue">${count} transaksi</span></div>
 <div class="jm-graph-filters"><div class="field"><label>Jenis transaksi</label><div class="jm-graph-tabs"><button type="button" class="${jmGraphType==='deposits'?'active':''}" onclick="jmUpdateOverviewGraph('type','deposits')">Setor</button><button type="button" class="${jmGraphType==='orders'?'active':''}" onclick="jmUpdateOverviewGraph('type','orders')">Order</button></div></div>
 <div class="field"><label>Tampilkan</label><div class="jm-graph-tabs"><button type="button" class="${jmGraphScope==='all'?'active':''}" onclick="jmUpdateOverviewGraph('scope','all')">Semua</button><button type="button" class="${jmGraphScope==='person'?'active':''}" onclick="jmUpdateOverviewGraph('scope','person')">Personil</button></div></div>
 <div class="field"><label>Bulan</label><input type="month" value="${month}" onchange="jmUpdateOverviewGraph('month',this.value)"></div>
 ${jmGraphScope==='person'?`<div class="field jm-graph-person"><label>Pilih personil</label><select onchange="jmUpdateOverviewGraph('person',this.value)">${options||'<option value="">Belum ada personil</option>'}</select></div>`:''}</div>
 <div class="jm-graph-totals"><div><small>Total ${label.toLowerCase()} bulan ini</small><b>${rupiah(total)}</b></div><div><small>Jumlah transaksi</small><b>${count}</b></div></div>
 <div class="jm-graph-plot"><div class="jm-graph-scroll" aria-label="Geser grafik untuk melihat tanggal lebih awal"><div class="jm-graph-scroll-inner"><svg width="${plotWidth}" height="225" viewBox="0 0 ${plotWidth} 225" role="img" aria-label="Grafik ${label.toLowerCase()} harian ${month}, total ${rupiah(total)}">${graphDefs}${grid}${bars}</svg></div></div></div>
 <div class="jm-graph-foot">${count?'Geser grafik untuk melihat semua tanggal. Angka kecil di puncak batang menunjukkan nominal harian.':'Belum ada transaksi pada filter dan bulan yang dipilih.'}</div>`;
}
function renderAdminOverview(){const n=notices(),today=todayWIB(),todayOrders=state.orders.filter(o=>String(o.date||'').slice(0,10)===today),todayDeposits=state.deposits.filter(d=>String(d.date||'').slice(0,10)===today);const orderTotal=sumOrders(todayOrders),depositTotal=sumDeposits(todayDeposits),balanceTotal=state.personnel.reduce((s,p)=>s+balances(p),0);return `<div class="metric-grid jm-v36-admin-metrics"><button class="metric primary" onclick="openMetric('balance')"><div class="metric-top"><span class="metric-label">Saldo semua personil</span><span class="metric-emoji">💎</span></div><div class="metric-value">${rupiah(balanceTotal)}</div><div class="metric-foot">Akumulasi saldo akhir seluruh personil · Klik untuk detail</div></button><button class="metric" onclick="openMetric('orders')"><div class="metric-top"><span class="metric-label">Total order hari ini</span><span class="metric-emoji">📦</span></div><div class="metric-value">${rupiah(orderTotal)}</div><div class="metric-foot">${todayOrders.length} transaksi · ${fmtDate(today)} WIB · klik untuk detail</div></button><button class="metric" onclick="openMetric('deposits')"><div class="metric-top"><span class="metric-label">Total setor hari ini</span><span class="metric-emoji">💸</span></div><div class="metric-value">${rupiah(depositTotal)}</div><div class="metric-foot">${todayDeposits.length} transaksi · ${fmtDate(today)} WIB · klik untuk detail</div></button></div>${(['late','over','tasks','active'].some(k=>jmDashboardVisible(k)&&n[k]>0))?`<div class="notify-title"><span class="icon-3d">🔔</span><div><h3>Notifikasi</h3><span>Perlu perhatian dari admin</span></div></div><div class="notify-grid jm-v36-notify-grid">${jmDashboardVisible('late')&&n.late>0?`<button class="notice alert" onclick="openNotice('late')"><span class="icon-3d">⏰</span><span class="notice-main"><p class="notice-title">Peringatan tidak setor</p><div class="notice-sub">Melewati batas waktu</div></span><span class="notice-count">${n.late}</span></button>`:''}${jmDashboardVisible('over')&&n.over>0?`<button class="notice alert" onclick="openNotice('over')"><span class="icon-3d">⚠️</span><span class="notice-main"><p class="notice-title">Saldo melebihi batas</p><div class="notice-sub">Periksa saldo personil</div></span><span class="notice-count">${n.over}</span></button>`:''}${jmDashboardVisible('tasks')&&n.tasks>0?`<button class="notice jm-v38-tasks-shake" onclick="setPage('tasks')"><span class="icon-3d">📋</span><span class="notice-main"><p class="notice-title">Tugas masuk</p><div class="notice-sub">Order & setor menunggu</div></span><span class="notice-count">${n.tasks}</span></button>`:''}${jmDashboardVisible('active')&&n.active>0?`<button class="notice ok" onclick="openNotice('active')"><span class="icon-3d">🟢</span><span class="notice-main"><p class="notice-title">Aktivitas personil</p><div class="notice-sub">Aktivitas dalam 24 jam terakhir</div></span><span class="notice-count">${n.active}</span></button>`:''}</div>` : ''}`}

const jmOriginalRenderAdminOverview=renderAdminOverview;
renderAdminOverview=function(){return jmOriginalRenderAdminOverview()+(jmDashboardVisible("graph")?`<section class="panel jm-graph-panel jm-v36-admin-graph" id="jmOverviewGraph">${jmRenderOverviewGraph()}</section>`:"")};

function recentActivity(){const arr=[...state.orders.map(x=>({...x,type:'order'})),...state.deposits.map(x=>({...x,type:'deposit'}))].sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date))).slice(0,4);if(!arr.length)return emptyBlock('🪄','Belum ada aktivitas','Order dan setor yang masuk akan tampil di sini.');return `<div class="list-grid">${arr.map(x=>`<div class="data-card"><div class="card-top"><span class="card-icon">${x.type==='order'?'📦':'💸'}</span><div style="flex:1"><div class="card-title">${x.type==='order'?'Order':'Setor'} · ${esc(personName(x.personnelId))}</div><div class="card-meta">${fmtDate(x.date)} · #${esc(String(x.id).slice(-6))}</div></div><span class="status ${x.status==='diterima'||x.status==='selesai'?'green':'blue'}">${x.status==='masuk'?'Cek out':x.status==='menunggu'?'Menunggu':x.status==='selesai'?'Selesai':'Diterima'}</span></div><div class="card-total">${rupiah(x.type==='order'?x.total:x.amount)}</div></div>`).join('')}</div>`}
function taskIncomingTimestamp(x){const raw=String(x&&x.createdAt||'').trim();if(raw){const parsed=Date.parse(raw);if(Number.isFinite(parsed))return parsed;}const day=String(x&&x.date||'').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(day))return 0;const fallback=Date.parse(day+'T12:00:00+07:00');return Number.isFinite(fallback)?fallback:0}
function taskHistoryIsRecent(x){const stamp=taskIncomingTimestamp(x);return stamp>0&&(Date.now()-stamp)<=2*24*60*60*1000}
function sortTasksByIncomingDate(list,oldestFirst){return list.slice().sort((a,b)=>{const ta=taskIncomingTimestamp(a),tb=taskIncomingTimestamp(b);return oldestFirst?(ta-tb):(tb-ta)})}
function renderTasks(){const orderMode=taskType==='orders';const statusList=orderMode?state.orders:state.deposits;const rawArr=statusList.filter(x=>x.status===taskStatus);const isHistory=orderMode?taskStatus==='selesai':taskStatus==='diterima';const arr=isHistory?sortTasksByIncomingDate(rawArr.filter(taskHistoryIsRecent),false):sortTasksByIncomingDate(rawArr,true);const orderWaiting=state.orders.filter(x=>x.status==='masuk').length,depositWaiting=state.deposits.filter(x=>x.status==='menunggu').length;const cardsHTML=arr.map(x=>orderMode?orderCard(x,taskStatus==='masuk'):depositCard(x,taskStatus==='menunggu')).join('');const emptyTitle=isHistory?'Belum ada riwayat dalam 2 hari terakhir':(orderMode?'Tidak ada order di antrean ini':'Tidak ada setor di antrean ini');const emptyText=isHistory?'Riwayat yang masuk lebih dari 2 hari tidak ditampilkan di tab ini.':'Transaksi baru dari personil akan tampil di sini.';return `<div class="section-head"><div><div class="eyebrow">WORKFLOW</div><h2>Proses transaksi masuk</h2><p>Antrean terurut dari transaksi paling awal; riwayat menampilkan transaksi terbaru di atas dan hanya 2 hari terakhir.</p></div></div><div class="tabs task-tabs"><button class="tab ${orderMode?'active':''}" onclick="setTaskType('orders')"><span>📦 Order masuk</span>${orderWaiting>0?`<b class="task-count">${orderWaiting}</b>`:''}</button><button class="tab ${!orderMode?'active':''}" onclick="setTaskType('deposits')"><span>💸 Setor masuk</span>${depositWaiting>0?`<b class="task-count">${depositWaiting}</b>`:''}</button></div>${orderMode?`<div class="subtabs task-subtabs"><button class="subtab ${taskStatus==='masuk'?'active':''}" onclick="setTaskStatus('masuk')">Cek out ${state.orders.filter(x=>x.status==='masuk').length>0?`<b>${state.orders.filter(x=>x.status==='masuk').length}</b>`:''}</button><button class="subtab ${taskStatus==='selesai'?'active':''}" onclick="setTaskStatus('selesai')">Selesai</button></div>`:`<div class="subtabs task-subtabs"><button class="subtab ${taskStatus==='menunggu'?'active':''}" onclick="setTaskStatus('menunggu')">Menunggu diterima ${state.deposits.filter(x=>x.status==='menunggu').length>0?`<b>${state.deposits.filter(x=>x.status==='menunggu').length}</b>`:''}</button><button class="subtab ${taskStatus==='diterima'?'active':''}" onclick="setTaskStatus('diterima')">Sudah diterima</button></div>`}${arr.length?`<div class="task-person-cards task-person-cards-flat">${cardsHTML}</div>`:emptyBlock(orderMode?'📦':'💸',emptyTitle,emptyText)}`}

15.4c-.1 1.4-1.2 2.3-2.6 2.3H9.4c-1.4 0-2.5-.9-2.6-2.3L5.2 9.4Z" fill="url(#jmTrashGrad)" stroke="#a71120" stroke-width="1.3"/><path d="M11 13v9M17 13v9" stroke="#ffd8d8" stroke-width="2.1" stroke-linecap="round"/><path d="M3.5 8.5h21" stroke="#a71120" stroke-width="4.5" stroke-linecap="round"/><path d="M4 7.4h20" stroke="#ff7175" stroke-width="2.8" stroke-linecap="round"/></svg></span></button>`:``}</div></article>`}
function renderItemCards(search=inventoryItemSearch){const query=String(search||'').trim().toLocaleLowerCase('id');const sorted=state.items.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'id',{sensitivity:'base'}));const filtered=sorted.filter(i=>String(i.name||'').toLocaleLowerCase('id').includes(query));if(!state.items.length)return emptyBlock('📦','Daftar item masih kosong','Tambahkan item pertama untuk mulai menerima order.');if(!filtered.length)return emptyBlock('🔎','Item tidak ditemukan','Coba kata kunci nama item yang lain.');return `<div class="list-grid item-grid">${filtered.map(i=>`<article class="data-card item-card"><div class="card-top item-card-head"><span class="card-icon">📦</span><div class="item-card-main"><div class="card-title item-name">${esc(i.name)}</div><div class="card-total item-price">${rupiah(i.price)}</div></div></div><div class="item-card-actions"><button class="btn btn-soft btn-xs" onclick="openItemModal('${i.id}')"><span class="jm-action-3d edit" aria-hidden="true">✏️</span> Edit</button><button class="btn btn-danger btn-xs" title="Hapus item" aria-label="Hapus item" onclick="deleteRecord('item','${i.id}')"><span class="jm-trash-3d" aria-hidden="true"><svg viewBox="0 0 28 30" width="23" height="25" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="jmTrashGradInventory" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8888"/><stop offset=".45" stop-color="#fa333b"/><stop offset="1" stop-color="#ad101f"/></linearGradient></defs><path d="M8 7V4.7C8 3.8 8.7 3 9.7 3h8.6c1 0 1.7.8 1.7 1.7V7" stroke="#b10e22" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M5.2 9.4h17.6l-1.6 15.4c-.1 1.4-1.2 2.3-2.6 2.3H9.4c-1.4 0-2.5-.9-2.6-2.3L5.2 9.4Z" fill="url(#jmTrashGradInventory)" stroke="#a71120" stroke-width="1.3"/><path d="M11 13v9M17 13v9" stroke="#ffd8d8" stroke-width="2.1" stroke-linecap="round"/><path d="M3.5 8.5h21" stroke="#a71120" stroke-width="4.5" stroke-linecap="round"/><path d function filterInventoryItems(value){inventoryItemSearch=value;const list=document.getElementById('inventoryItemList');if(list)list.innerHTML=renderItemCards(inventoryItemSearch)}
function renderItems(){return `<div class="section-head"><div><div class="eyebrow">INVENTORY</div><h2>Item / barang</h2><p>Atur daftar barang dan harga order personil.</p></div><button class="btn btn-primary" onclick="openItemModal()">＋ Tambah item</button></div><div class="field" style="margin:0 0 13px"><label for="inventoryItemSearch">Cari nama item</label><input id="inventoryItemSearch" type="search" value="${esc(inventoryItemSearch)}" placeholder="Ketik nama item..." oninput="filterInventoryItems(this.value)" autocomplete="off"></div><div id="inventoryItemList">${renderItemCards(inventoryItemSearch)}</div>`}
function renderPersonnel(){const q=String(personnelSearch||'').trim().toLowerCase();const orderedPersonnel=[...state.personnel].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'id',{sensitivity:'base'}));const filtered=orderedPersonnel.filter(p=>[p.name,p.phone,p.address,p.stall,p.category,p.activationCode,p.uplineId?personName(p.uplineId):''].filter(Boolean).join(' ').toLowerCase().includes(q));return `<div class="section-head"><div><div class="eyebrow">TEAM</div><h2>Personil outlet</h2><p>${state.personnel.length} personil terdaftar</p></div><button class="btn btn-primary" onclick="openPersonModal()">＋ Personil</button></div><div class="personnel-search"><span>🔎</span><input id="personnelSearchInput" type="search" value="${esc(personnelSearch)}" placeholder="Cari nama, lapak, kategori, atau kode aktivasi..." autocomplete="off" oninput="filterPersonnelCards(this.value)"><button type="button" class="search-clear ${q?'':'hidden'}" onclick="clearPersonnelSearch()" aria-label="Hapus pencarian"><span class="jm-trash-3d" aria-hidden="true"><svg viewBox="0 0 28 30" width="23" height="25" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="jmTrashGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8888"/><stop offset=".45" stop-color="#fa333b"/><stop offset="1" stop-color="#ad101f"/></linearGradient></defs><path d="M8 7V4.7C8 3.8 8.7 3 9.7 3h8.6c1 0 1.7.8 1.7 1.7V7" stroke="#b10e22" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M5.2 9.4h17.6l-1.6 15.4c-.1 1.4-1.2 2.3-2.6 2.3H9.4c-1.4 0-2.5-.9-2.6-2.3L5.2 9.4Z" fill="url(#jmTrashGrad)" stroke="#a71120" stroke-width="1.3"/><path d="M11 13v9M17 13v9" stroke="#ffd8d8" stroke-width="2.1" stroke-linecap="round"/><path d="M3.5 8.5h21" stroke="#a71120" stroke-width="4.5" stroke-linecap="round"/><path d="M4 7.4h20" stroke="#ff7175" stroke-width="2.8" stroke-linecap="round"/></svg></span></button></div><div id="personnelSearchCount" class="search-count">Menampilkan ${filtered.length} dari ${state.personnel.length} personil</div>${state.personnel.length?`<div class="list-grid personnel-grid" id="personnelListGrid">${orderedPersonnel.map(p=>`<article class="data-card clickable personnel-card ${balances(p)>personBalanceLimit(p)?'over-limit':''} ${[p.name,p.phone,p.address,p.stall,p.category,p.activationCode,p.uplineId?personName(p.uplineId):''].filter(Boolean).join(' ').toLowerCase().includes(q)?'':'hidden'}" data-personnel-search="${esc([p.name,p.phone,p.address,p.stall,p.category,p.activationCode,p.uplineId?personName(p.uplineId):''].filter(Boolean).join(' ').toLowerCase())}" onclick="openPersonDetail('${p.id}')"><div class="card-top"><span class="card-icon">${p.category==='downline'?'🧑‍🤝‍🧑':p.category==='upline'?'🧑‍💼':'👤'}</span><div style="flex:1;min-width:0"><div class="card-title">${esc(p.name)}</div><div class="card-meta">${esc(p.stall||'Lapak belum diisi')} · ${esc(p.category||'umum')}</div></div><span class="status ${p.active?'green':'blue'}">${p.active?'Aktif':'Offline'}</span></div><div class="personnel-balance ${balances(p)>personBalanceLimit(p)?'limit-exceeded':''}"><span>Saldo akhir</span><b>${rupiah(balances(p))}</b></div>${balances(p)>personBalanceLimit(p)?'<div class="personnel-limit-warning">⚠️ Saldo akhir melewati batas admin</div>':''}<div class="card-footer" onclick="event.stopPropagation()"><button class="btn btn-primary btn-xs" onclick="openPersonModal('${p.id}')"><span class="jm-action-3d edit" aria-hidden="true">✏️</span> Edit</button><button class="btn btn-ghost btn-xs" onclick="copyText('${esc(p.activationCode)}','Kode aktivasi disalin')"><span class="jm-action-3d copy" aria-hidden="true">▣</span> Copy kode</button><button class="btn btn-ghost btn-xs" onclick="sharePersonnelWhatsApp('${p.id}')"><span class="jm-action-3d wa" aria-hidden="true">🟢</span> WhatsApp</button><button class="btn btn-danger btn-xs" title="Hapus personil" aria-label="Hapus personil" onclick="deleteRecord('person','${p.id}')"><span class="jm-trash-3d" aria-hidden="true"><svg viewBox="0 0 28 30" width="23" height="25" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="jmTrashGradPersonnel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8888"/><stop offset=".45" stop-color="#fa333b"/><stop offset="1" stop-color="#ad101f"/></linearGradient></defs><path d="M8 7V4.7C8 3.8 8.7 3 9.7 3h8.6c1 0 1.7.8 1.7 1.7V7" stroke="#b10e22" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M5.2 9.4h17.6l-1.6 15.4c-.1 1.4-1.2 2.3-2.6 2.3H9.4c-1.4 0-2.5-.9-2.6-2.3L5.2 9.4Z" fill="url(#jmTrashGradPersonnel)" stroke="#a71120" stroke-width="1.3"/><path d="M11 13v9M17 13v9" stroke="#ffd8d8" stroke-width="2.1" stroke-linecap="round"/><path d="M3.5 8.5h21" stroke="#a71120" stroke-width="4.5" stroke-linecap="round"/><path d="M4 7.4h20" stroke="#ff7175" stroke-width="2.8" stroke-linecap="round"/></svg></span></button></div></article>`).join('')}</div><div id="personnelSearchEmpty" class="empty ${filtered.length?'hidden':''}"><span class="big">🔎</span><b>Personil tidak ditemukan</b><span>Coba kata kunci nama, lapak, atau kode aktivasi lain.</span></div>`:emptyBlock('🧑‍🤝‍🧑','Belum ada personil','Tambahkan personil dan buat kode aktivasi untuk login.')}`}
function filterPersonnelCards(value){personnelSearch=String(value||'');const q=personnelSearch.trim().toLowerCase();let shown=0;document.querySelectorAll('.personnel-card').forEach(card=>{const match=(card.dataset.personnelSearch||'').includes(q);card.classList.toggle('hidden',!match);if(match)shown++});const total=state.personnel.length;const count=document.getElementById('personnelSearchCount');if(count)count.textContent=`Menampilkan ${shown} dari ${total} personil`;const empty=document.getElementById('personnelSearchEmpty');if(empty)empty.classList.toggle('hidden',shown>0);const clear=document.querySelector('.search-clear');if(clear)clear.classList.toggle('hidden',!q)}
async function clearPersonnelSearch(){const accepted=await askDeleteConfirmation('Kosongkan pencarian?','Kolom pencarian personil akan dikosongkan.');if(!accepted)return;personnelSearch='';const input=document.getElementById('personnelSearchInput');if(input){input.value='';input.focus()}filterPersonnelCards('')}
function toggleReportTaskFilter(){reportTaskFilterOpen=!reportTaskFilterOpen;render()}
function setReportTaskType(type){if(!['orders','deposits','general'].includes(type))return;reportTaskType=type;reportTaskFilterOpen=false;render()}

function reportGeneralEndDate(){if(reportTo)return String(reportTo).slice(0,10);const ds=[...state.orders,...state.deposits].map(x=>String(x.date||'').slice(0,10)).filter(Boolean).sort();const today=todayWIB();return ds.length&&ds[ds.length-1]>today?ds[ds.length-1]:today}
function reportBalanceAt(personnelId,cutoffDate){const p=state.personnel.find(x=>x.id===personnelId);if(!p)return 0;const cutoff=String(cutoffDate||'').slice(0,10);const taken=state.orders.filter(x=>x.personnelId===personnelId&&String(x.date||'').slice(0,10)&&String(x.date||'').slice(0,10)<=cutoff).reduce((n,x)=>n+(Number(x.total)||0),0);const deposited=state.deposits.filter(x=>x.personnelId===personnelId&&String(x.date||'').slice(0,10)&&String(x.date||'').slice(0,10)<=cutoff).reduce((n,x)=>n+(Number(x.amount)||0),0);return (Number(p.openingBalance)||0)+taken-deposited}
function getGeneralReportRows(filteredOrders,filteredDeps){const end=reportGeneralEndDate(),people=state.personnel.filter(p=>reportPerson==='all'||p.id===reportPerson).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'id',{sensitivity:'base'}));return people.map(p=>{const deposited=filteredDeps.filter(x=>x.personnelId===p.id).reduce((n,x)=>n+(Number(x.amount)||0),0),taken=filteredOrders.filter(x=>x.personnelId===p.id).reduce((n,x)=>n+(Number(x.total)||0),0);return {name:p.name||'',personnelId:p.id,date:end,deposited,taken,balance:reportBalanceAt(p.id,end)}})}
function renderReports(){
const filteredOrders=state.orders.filter(x=>(!reportFrom||x.date>=reportFrom)&&(!reportTo||x.date<=reportTo)&&(reportPerson==='all'||x.personnelId===reportPerson));
const filteredDeps=state.deposits.filter(x=>(!reportFrom||x.date>=reportFrom)&&(!reportTo||x.date<=reportTo)&&(reportPerson==='all'||x.personnelId===reportPerson));
const isOrder=reportTaskType==='orders';const isGeneral=reportTaskType==='general';
const count=isOrder?filteredOrders.length:filteredDeps.length;
const total=isOrder?sumOrders(filteredOrders):sumDeposits(filteredDeps);
const totalOrderQty=filteredOrders.reduce((sum,o)=>sum+(o.items||[]).reduce((qty,item)=>qty+(Number(item.qty)||0),0),0);
const orderDone=filteredOrders.filter(o=>o.status==='selesai').length;
const orderProcess=filteredOrders.length-orderDone;
const totalTurnover=filteredDeps.reduce((sum,d)=>sum+(Number(d.turnover)||0),0);
const totalIncome=filteredDeps.reduce((sum,d)=>sum+(Number(d.income)||0),0);
const depositAccepted=filteredDeps.filter(d=>d.status==='diterima').length;
const depositPending=filteredDeps.length-depositAccepted;const generalPeople=state.personnel.filter(p=>reportPerson==='all'||p.id===reportPerson);const generalEndDate=reportGeneralEndDate();const generalRows=getGeneralReportRows(filteredOrders,filteredDeps);const generalBalance=generalPeople.reduce((n,p)=>n+reportBalanceAt(p.id,generalEndDate),0);
const taskFilter=`<div class="report-task-filter"><button type="button" class="report-task-toggle" aria-expanded="${reportTaskFilterOpen?'true':'false'}" onclick="toggleReportTaskFilter()"><span class="report-task-toggle-main"><small>Filter TUGAS</small><b>${isOrder?'📦 Order':isGeneral?'📊 Umum':'💸 Setor'}</b></span><span class="report-task-chevron">${reportTaskFilterOpen?'▴':'▾'}</span></button>${reportTaskFilterOpen?`<div class="tabs report-task-tabs" role="tablist" aria-label="Filter tugas"><button type="button" role="tab" aria-selected="${isOrder?'true':'false'}" class="tab ${isOrder?'active':''}" onclick="setReportTaskType('orders')">📦 Order</button><button type="button" role="tab" aria-selected="${reportTaskType==='deposits'?'true':'false'}" class="tab ${reportTaskType==='deposits'?'active':''}" onclick="setReportTaskType('deposits')">💸 Setor</button><button type="button" role="tab" aria-selected="${isGeneral?'true':'false'}" class="tab ${isGeneral?'active':''}" onclick="setReportTaskType('general')">📊 Umum</button></div>`:''}</div>`;
const summaryCards=isGeneral?`<div class="total-mini"><span>Jumlah personil</span><b>${generalPeople.length} personil</b></div><div class="total-mini"><span>Total setor</span><b>${rupiah(sumDeposits(filteredDeps))}</b></div><div class="total-mini"><span>Total ambil</span><b>${rupiah(sumOrders(filteredOrders))}</b></div><div class="total-mini"><span>Saldo akhir · ${fmtDate(generalEndDate)}</span><b>${rupiah(generalBalance)}</b></div>`:isOrder?
`<div class="total-mini"><span>Jumlah order</span><b>${count} transaksi</b></div><div class="total-mini"><span>Total kuantitas item</span><b>${totalOrderQty} item</b></div><div class="total-mini"><span>Total nominal order</span><b>${rupiah(total)}</b></div><div class="total-mini"><span>Status order</span><b>${orderDone} selesai · ${orderProcess} proses</b></div>`:
`<div class="total-mini"><span>Jumlah setoran</span><b>${count} transaksi</b></div><div class="total-mini"><span>Total omset</span><b>${rupiah(totalTurnover)}</b></div><div class="total-mini"><span>Total penghasilan</span><b>${rupiah(totalIncome)}</b></div><div class="total-mini"><span>Total nominal setor</span><b>${rupiah(total)}</b></div><div class="total-mini"><span>Status setor</span><b>${depositAccepted} diterima · ${depositPending} menunggu</b></div>`;
const orderPanel=`<div class="panel"><div class="panel-title"><h3>Order</h3><small>${filteredOrders.length} transaksi</small></div>${filteredOrders.length?`<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Personil</th><th>Item</th><th>Status</th><th>Total</th></tr></thead><tbody>${filteredOrders.map(o=>`<tr><td>${fmtDate(o.date)}</td><td>${esc(personName(o.personnelId))}</td><td>${(o.items||[]).map(i=>esc(i.name)+' × '+i.qty).join(', ')}</td><td>${o.status==='selesai'?'Selesai':'Cek out'}</td><td><b>${rupiah(o.total)}</b></td></tr>`).join('')}</tbody></table></div>`:emptyBlock('📦','Tidak ada order pada periode ini','Ubah filter tanggal atau personil.')}</div>`;

let jmBarcodeStream=null,jmBarcodeRaf=0,jmBarcodeScanning=false,jmTaskVariantPending=false;
let jmBarcodeZxingControls=null,jmBarcodeScriptPromise=null;
function jmBarcodeTryZxingLoad(){
  if(window.ZXing&&window.ZXing.BrowserMultiFormatReader)return Promise.resolve(true);
  if(jmBarcodeScriptPromise)return jmBarcodeScriptPromise;
  jmBarcodeScriptPromise=new Promise(resolve=>{
    const tag=document.createElement('script');
    tag.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    tag.async=true;
    tag.onload=()=>resolve(!!(window.ZXing&&window.ZXing.BrowserMultiFormatReader));
    tag.onerror=()=>resolve(false);
    document.head.appendChild(tag);
  });
  return jmBarcodeScriptPromise;
}
function jmBarcodeCleanCode(v){return String(v||'').replace(/[\s.,]+/g,'').trim()}
function jmBarcodeApplyCode(code,mode){
  if(!jmBarcodeScanning||jmTaskVariantPending)return false;
  const val=jmBarcodeCleanCode(code);if(!val)return false;
  const now=Date.now();
  if(mode==='task'&&val===jmBarcodeApplyCode.prev&&now-jmBarcodeApplyCode.when<2600)return false;
  jmBarcodeApplyCode.prev=val;jmBarcodeApplyCode.when=now;
  jmBarcodeResult(val,mode);return true;
}
async function jmBarcodeStartZxing(video,mode,node){
  if(!await jmBarcodeTryZxingLoad()||!jmBarcodeScanning||document.getElementById('jmBarcodeOverlay')!==node)return false;
  try{
    const reader=new ZXing.BrowserMultiFormatReader();
    // ZXing memeriksa bingkai video secara berulang, termasuk beberapa kode non-EAN.
    const onResult=(result,error)=>{if(result&&result.text&&jmBarcodeScanning&&document.getElementById('jmBarcodeOverlay')===node){jmBarcodeApplyCode(result.text,mode)}};
    if(typeof reader.decodeFromVideoElementContinuously==='function'){
      reader.decodeFromVideoElementContinuously(video,onResult);
    }else if(typeof reader.decodeFromVideoElement==='function'){
      const p=reader.decodeFromVideoElement(video,onResult);
      if(p&&typeof p.catch==='function')p.catch(()=>{});
    }else{return false}
    jmBarcodeZxingControls=reader;
    return true;
  }catch(e){return false}
}
function jmBarcodeZoom(value){
  const track=jmBarcodeStream&&jmBarcodeStream.getVideoTracks()[0];
  if(!track||!track.applyConstraints)return;
  track.applyConstraints({advanced:[{zoom:Number(value)}]}).catch(()=>{});
}

function closeBarcodeScanner(){if(jmBarcodeZxingControls){try{jmBarcodeZxingControls.reset()}catch(e){}jmBarcodeZxingControls=null;}jmTaskVariantPending=false;jmBarcodeScanning=false;if(jmBarcodeRaf)cancelAnimationFrame(jmBarcodeRaf);jmBarcodeRaf=0;if(jmBarcodeStream){jmBarcodeStream.getTracks().forEach(t=>t.stop());jmBarcodeStream=null;}document.getElementById('jmBarcodeOverlay')?.remove()}
function jmBarcodeResult(code,mode){
  const clean=jmBarcodeCleanCode(code);
  if(!clean){toast('Kode barcode belum terbaca.','bad');return}
  if(mode==='task'){jmOrderCheckScan(clean);return;}
  if(mode==='admin'){
    const field=document.getElementById('itemBarcode');
    if(field){field.value=clean;closeBarcodeScanner();toast('Barcode terbaca. Simpan item untuk menghubungkannya.')}
    return;
  }
  const found=state.items.filter(i=>jmBarcodeCleanCode(i.barcode)===clean);
  closeBarcodeScanner();
  const search=document.getElementById('itemSearchInput');
  const box=document.getElementById('suggestions');
  if(!search||!box)return;
  if(!found.length){
    search.value='';itemSearch='';box.classList.add('hidden');box.innerHTML='';
    toast('Barcode belum terdaftar. Cari dengan nama barang atau hubungi Admin.','bad');return;
  }
  // Tampilkan SEMUA varian dengan barcode identik. Pilihan tetap lewat addOrderItem() bawaan aplikasi.
  search.value=found.length===1?found[0].name:clean;
  itemSearch=search.value;
  box.classList.remove('hidden');
  box.innerHTML=(found.length>1?'<div class="jm-barcode-variants-label">'+found.length+' varian ditemukan — pilih item yang sesuai:</div>':'')+
    found.map(i=>`<button type="button" class="suggestion" onclick="addOrderItem('${i.id}')"><span>${esc(i.name)}<br><small>${rupiah(i.price)} · Barcode cocok</small></span><b>＋ Pilih</b></button>`).join('');
  toast(found.length>1?found.length+' varian ditemukan. Pilih varian yang sesuai.':'Barang ditemukan. Tekan Pilih untuk menambahkan ke Order.');
}
async function openBarcodeScanner(mode){
  closeBarcodeScanner();
  const node=document.createElement('div');
  node.id='jmBarcodeOverlay';node.className='jm-barcode-overlay';

  }

function generateActivationCode(name,excludeId=''){const used=new Set(state.personnel.filter(p=>p.id!==excludeId).map(p=>String(p.activationCode||'').trim().toUpperCase()));const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ',odd='13579',even='02468';for(let attempt=0;attempt<2000;attempt++){const pool=letters.split(''),pick=()=>pool.splice(activationRandomInt(pool.length),1)[0];const code='JM-'+pick()+pick()+pick()+'-'+odd[activationRandomInt(5)]+even[activationRandomInt(5)]+odd[activationRandomInt(5)];if(!used.has(code))return code}return ''}

  let appLink=getPersonnelAppLink(state.settings.cloudUrl||activeCloudUrl||'');
  if(appLink){try{const u=new URL(appLink);u.searchParams.set('role','personnel');u.hash='personnel';appLink=u.toString()}catch(e){}}
  const message='Halo '+p.name+', berikut link aplikasi JM Operasional untuk login personil:\n'+(appLink||'(Link aplikasi belum tersedia)')+'\nKode aktivasi: '+String(p.activationCode||'')+'\nSilakan buka link dan masukkan kode aktivasi tersebut.';

  if(phone.length<8||phone.length>15){toast('Nomor personil tidak valid. Membuka pilihan berbagi umum.','bad');sharePersonnelUniversal(message,p.name);return}

  const wa='https://wa.me/'+phone+'?text='+encodeURIComponent(message);
  window.location.href=wa;
}

// V54: ucapan untuk item baru yang berhasil dipindai; tidak diperlukan perubahan GS.
function jmSpeakBarcodeMatch(test=false){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
    toast('Browser tidak mendukung suara ucapan.','bad');return false;
  }
  try{
    const synth=window.speechSynthesis;
    synth.cancel();
    const utter=new SpeechSynthesisUtterance('Barang cocok');
    utter.lang='id-ID';utter.volume=1;utter.rate=1;utter.pitch=1;
    const voices=synth.getVoices();
    const indo=voices.find(v=>String(v.lang||'').toLowerCase().startsWith('id'));
    if(indo)utter.voice=indo;
    utter.onerror=()=>{if(test)toast('Suara tidak dapat diputar. Periksa volume media dan dukungan suara browser.','bad')};
    synth.speak(utter);
    return true;
  }catch(e){if(test)toast('Suara gagal diputar: '+(e.message||e),'bad');return false;}
}

function jmOrderCheckScan(code){
 const raw=String(code||'').trim(),orderId=modalData.orderId,items=modalData.orderEditItems||[];
 const overlay=document.getElementById('jmBarcodeOverlay'),help=document.getElementById('jmBarcodeHelp'),panel=document.getElementById('jmTaskScanVariants');
 if(!overlay||!help||!panel||!orderId||jmTaskVariantPending)return;
 const registered=state.items.filter(it=>jmBarcodeCleanCode(it.barcode)===jmBarcodeCleanCode(raw));
 const matches=items.map((it,idx)=>({it,idx})).filter(({it})=>registered.some(cat=>String(cat.id)===String(it.itemId)));
 panel.innerHTML='';
 if(!registered.length){help.textContent='Barcode tidak terdaftar dalam daftar item. Silakan scan barang lainnya.';return}
 if(!matches.length){help.textContent='Barcode terdaftar, tetapi item ini tidak ada dalam Order yang sedang dicek.';return}
 const mark=(idx)=>{
   const alreadyChecked=!!modalData.orderCheckFlags?.[idx];
   jmOrderCheckToggle(idx,true);
   if(!alreadyChecked)jmSpeakBarcodeMatch();
   help.textContent=alreadyChecked?'✓ '+items[idx].name+' sudah dicek sebelumnya. Silakan scan item lain.':'✓ '+items[idx].name+' sudah dicek. Lanjutkan scan item berikutnya.';
   panel.innerHTML='';jmTaskVariantPending=false;
 };
 // Barcode unik dapat langsung dicek seperti V55.
 if(registered.length===1&&matches.length===1){mark(matches[0].idx);return}
 // Barcode digunakan lebih dari satu item terdaftar: wajib memilih varian.
 jmTaskVariantPending=true;
 help.textContent='Barcode memiliki '+registered.length+' varian terdaftar. Pilih item yang sesuai dengan pesanan:';
 const title=document.createElement('div');title.className='jm-scan-variant-title';title.textContent='Pilih varian barang ('+registered.length+' terdaftar):';panel.appendChild(title);
 registered.forEach(cat=>{
   const orderRows=matches.filter(({it})=>String(it.itemId)===String(cat.id));
   if(!orderRows.length){
     const unavailable=document.createElement('div');unavailable.className='jm-scan-variant-unavailable';
     unavailable.textContent=cat.name+' — '+rupiah(cat.price)+' · Tidak ada dalam Order ini';panel.appendChild(unavailable);return;
   }
   orderRows.forEach(({it,idx})=>{
     const btn=document.createElement('button');btn.type='button';
     btn.textContent=(modalData.orderCheckFlags?.[idx]?'✓ ':'□ ')+it.name+' — '+rupiah(it.price)+(modalData.orderCheckFlags?.[idx]?' · Sudah dicek':' · Pilih & cek');
     btn.addEventListener('click',()=>mark(idx));panel.appendChild(btn);
   });
 });
 const cancel=document.createElement('button');cancel.type='button';cancel.className='jm-scan-variant-cancel';cancel.textContent='Batal pilih · Lanjut scan';
 cancel.addEventListener('click',()=>{jmTaskVariantPending=false;panel.innerHTML='';help.textContent='Pilihan dibatalkan. Silakan scan item berikutnya.';});panel.appendChild(cancel);
}
