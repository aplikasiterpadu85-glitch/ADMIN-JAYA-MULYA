n-primary">Simpan batas</button></div></form>`}else if(which==='password'){title='Ubah sandi admin';body=`<form onsubmit="savePassword(event)"><div class="field"><label>Sandi lama</label><input id="oldPassword" type="password" required value="${force?esc(old):''}" autocomplete="current-password"></div><div class="field" style="margin-top:12px"><label>Sandi baru</label><input id="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter"></div><div class="field" style="margin-top:12px"><label>Ulangi sandi baru</label><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></div><div class="field" style="margin-top:14px"><label>Email admin untuk pemulihan</label><input id="adminRecoveryEmail" type="email" inputmode="email" autocomplete="email" value="${esc(state.settings.adminRecoveryEmail||'')}" placeholder="admin@contoh.com"><div class="hint">Email ini menerima kode pemulihan melalui Gmail yang dikirim oleh Google Apps Script. Pemilik proyek perlu mengotorisasi pengiriman email.</div></div><div class="field" style="margin-top:12px"><label>Nomor HP admin untuk SMS / WhatsApp</label><input id="adminRecoveryPhone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(state.settings.adminRecoveryPhone||'')}" placeholder="Contoh: 08xxxxxxxxxx"><div class="hint">Nomor ini menjadi tujuan SMS atau WhatsApp Business. Kedua layanan memerlukan konfigurasi API pada Script Properties.</div><button type="button" class="btn btn-primary btn-xs" style="margin-top:8px" onclick="saveAdminRecoveryPhone()">Simpan kontak pemulihan</button></div>${force?`<div class="warning-box" style="margin-top:12px">Sandi bawaan terdeteksi. Ubah sandi terlebih dahulu sebelum memakai aplikasi.</div>`:''}<div class="form-actions"><button type="button" class="btn btn-ghost" onclick="${force?'logout()':'closeModal()'}">${force?'Keluar':'Batal'}</button><button class="btn btn-primary">Ubah sandi</button></div></form>`}else if(which==='cloud'){title='Cloud & backup';const url=state.settings.cloudUrl||'';const personLink=getPersonnelAppLink(url);body=`<div class="field"><label>URL Web App / koneksi backend</label><input id="cloudUrl" type="url" value="${esc(url)}" placeholder="https://script.google.com/macros/s/.../exec"><div class="hint">URL ini adalah koneksi backend Google Apps Script. Link cloud hanya bisa dibuat dari situs aplikasi online (GitHub Pages HTTPS), bukan dari file yang dibuka melalui Downloads. Setelah URL disimpan di situs online, buka link yang dihasilkan; gunakan link CLOUD AKTIF yang sama di semua HP.</div></div><div class="field" style="margin-top:13px"><label>Link aplikasi (Admin & Personil)</label><div style="display:flex;gap:8px"><input id="personAppLink" value="${esc(personLink||'Simpan URL Web App terlebih dahulu')}" readonly><button type="button" class="btn btn-soft btn-xs" onclick="copyText(document.getElementById('personAppLink').value,'Link aplikasi personil disalin')">Copy</button><button type="button" class="btn btn-primary btn-xs" onclick="openCloudAppLink()">Buka link</button></div><div class="hint">Bagikan link yang sama kepada Admin dan semua Personil. Pilih peran di halaman login; Personil cukup memasukkan kode aktivasi.</div></div><div class="form-actions" style="justify-content:flex-start"><button type="button" class="btn btn-soft btn-xs" onclick="saveCloudUrl()">Simpan URL</button><button type="button" class="btn btn-soft btn-xs" onclick="testCloud()">☁️ Tes cloud</button><button type="button" class="btn btn-primary btn-xs" onclick="sendCloud()">↑ Kirim cloud</button><button type="button" class="btn btn-ghost btn-xs" onclick="pullCloud()">↓ Tarik cloud</button></div><div class="line-divider"></div><div class="field"><label>Kode Code.gs untuk salin-tempel</label><textarea class="input code-area" id="gsOneLine" rows="4" readonly>${esc(SCRIPT_GS_ONELINE)}</textarea><div class="form-actions" style="margin-top:8px"><button type="button" class="btn btn-soft btn-xs" onclick="copyText(document.getElementById('gsOneLine').value,'Kode Code.gs disalin')"><span class="jm-action-3d copy" aria-hidden="true">▣</span> Copy kode 1 baris</button></div><div class="hint">Berkas Code.gs lengkap juga tersedia di paket aplikasi; gunakan versi file untuk pemeliharaan. Kode satu baris ini disediakan untuk kebutuhan salin-tempel. Gunakan file Code.gs lengkap jika memungkinkan.</div></div><div class="line-divider"></div><div class="form-actions" style="justify-content:flex-start"><button type="button" class="btn btn-ghost btn-xs" onclick="backupJSON()">⬇ Backup JSON</button><label class="btn btn-ghost btn-xs" for="restoreFile">⬆ Restore JSON</label><input id="restoreFile" type="file" accept="application/json,.json" class="hidden" onchange="restoreJSON(event)"></div><div class="hint" style="margin-top:8px">Backup menyimpan daftar item, personil, order, setor, dan pengaturan. Simpan file di lokasi aman.</div>`}else{title='Info aplikasi';body=infoHTML()}openModal(title,body,which==='cloud')}
function infoHTML(){return `<div class="card-top"><span class="card-icon">✨</span><div><div class="card-title">JM Operasional v1.0</div><div class="card-meta">Role-Based Access System · Admin & Personil</div></div></div><div class="line-divider"></div><p class="card-meta" style="line-height:1.8">Mode data: <b>${hasGas()?'Google Apps Script / Google Sheets':'localStorage browser'}</b><br>Update antar halaman pada browser yang sama memakai event storage/BroadcastChannel tanpa interval polling. Sinkronisasi cloud dipanggil ketika data berubah atau pengguna melakukan tarik cloud.<br><br>Apps Script tidak dapat mendorong perubahan instan ke semua perangkat tanpa mekanisme realtime eksternal.</p>`}
async function saveOutlet(e){e.preventDefault();const snapshot=cloneAppStateForRollback();state.settings.outletName=document.getElementById('outletName').value.trim();try{await syncSave();closeModal();render();toast('Nama outlet disimpan.')}catch(err){state=snapshot;toast(err.message||'Gagal menyimpan nama outlet.','bad')}}
async function saveNavigation(e){e.preventDefault();const snapshot=cloneAppStateForRollback(),previousPage=page;const v={};document.querySelectorAll('input[name="navMenu"]').forEach(x=>v[x.value]=x.checked);v.settings=true;state.settings.visibleMenus=v;if(page==='overview'&&!v.overview)page='tasks';try{await syncSave();closeModal();render();toast('Navigasi diperbarui.')}catch(err){state=snapshot;page=previousPage;toast(err.message||'Gagal menyimpan navigasi.','bad')}}
async function saveLimits(e){e.preventDefault();const snapshot=cloneAppStateForRollback();state.settings.maxBalance=Number(document.getElementById('maxBalance').value);state.settings.daysWithoutDeposit=Number(document.getElementById('daysNoDeposit').value);try{await syncSave();closeModal();render();toast('Batas personil disimpan.')}catch(err){state=snapshot;toast(err.message||'Gagal menyimpan batas personil.','bad')}}
async function saveAdminRecoveryPhone(){const phoneInput=document.getElementById('adminRecoveryPhone'),emailInput=document.getElementById('adminRecoveryEmail');if(!phoneInput||!emailInput)return;const phone=phoneInput.value.trim(),email=emailInput.value.trim();if(phone&&!/^\+?[0-9()\-\s]{8,20}$/.test(phone))return toast('Periksa format nomor HP admin.','bad');if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Format email pemulihan tidak valid.','bad');const snapshot=cloneAppStateForRollback();state.settings.adminRecoveryPhone=phone;state.settings.adminRecoveryEmail=email;try{await syncSave();toast('Email dan nomor HP pemulihan disimpan.');openSettingModal('password')}catch(err){state=snapshot;toast(err.message||'Gagal menyimpan kontak pemulihan.','bad')}}
async function savePassword(e){e.preventDefault();const old=document.getElementById('oldPassword').value,n=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(n!==c)return toast('Konfirmasi sandi tidak cocok.','bad');try{if(hasGas()){await gasCall('changeAdminPassword',sessionToken,old,n)}else{if(old!==(state.settings.adminPassword||'admin123'))return toast('Sandi lama salah.','bad');state.settings.adminPassword=n;saveLocal()}mustChange=false;closeModal();toast('Sandi admin berhasil diubah.')}catch(err){toast(err.message||'Gagal mengubah sandi.','bad')}}
async function saveCloudUrl(){const input=document.getElementById('cloudUrl');const next=validCloudUrl(input.value.trim());if(!next){toast('URL harus berupa HTTPS Web App Apps Script yang berakhir /exec.','bad');return}const previous=state.settings.cloudUrl||'',publicAppLink=getPersonnelAppLink(next);try{if(hasNativeGas()){state.settings.cloudUrl=next;await syncSave();try{localStorage.setItem(CLOUD_URL_KEY,next)}catch(_){}const link=document.getElementById('personAppLink');if(link)link.value=publicAppLink||(location.protocol==='https:'?'Link online belum dapat dibuat.':'Buka situs online aplikasi terlebih dahulu.');toast('URL backend disimpan. Link aplikasi sama untuk Admin dan Personil.');return}if(activeCloudUrl&&next===activeCloudUrl&&sessionToken&&currentUser){state.settings.cloudUrl=next;await syncSave()}else if(!activeCloudUrl){state.settings.cloudUrl=next;saveLocal()}try{localStorage.setItem(CLOUD_URL_KEY,next)}catch(_){}const link=document.getElementById('personAppLink');if(link)link.value=publicAppLink||(location.protocol==='https:'?'Link online belum dapat dibuat.':'Buka situs online aplikasi terlebih dahulu.');if(!publicAppLink&&!hasNativeGas()){toast('URL tersimpan di perangkat ini, tetapi link cloud bersama tidak bisa dibuat dari file Downloads. Buka situs online aplikasi di GitHub Pages, lalu simpan URL backend di sana.','bad')}else if(activeCloudUrl&&next!==activeCloudUrl){toast('Link diperbarui. Buka ulang link itu untuk beralih ke backend baru; data tidak dikirim otomatis.')}else if(!activeCloudUrl){toast('URL tersimpan. Salin link online di bawah dan buka link itu untuk login ke cloud.')}else{toast('URL backend disimpan. Link yang sama dipakai Admin dan Personil.')}}catch(err){state.settings.cloudUrl=previous;toast(err.message||'Gagal menyimpan URL backend.','bad')}}
async function testCloud(){try{const u=validCloudUrl(document.getElementById('cloudUrl').value.trim()||activeCloudUrl||state.settings.cloudUrl);if(!u)return toast('Masukkan URL Web App dahulu.','bad');if(hasNativeGas()&&u===activeCloudUrl){const r=await gasCall('cloudTest',sessionToken);toast('Cloud OK · '+r.message);if(r.spreadsheetUrl)openModal('Tes cloud berhasil',`<p class="card-meta">${esc(r.message)}</p><p><a href="${esc(r.spreadsheetUrl)}" target="_blank" rel="noopener">Buka spreadsheet database ↗</a></p>`)}else if(activeCloudUrl&&u===activeCloudUrl&&sessionToken){const r=await gasCall('cloudTest',sessionToken);toast('Cloud OK · '+r.message);if(r.spreadsheetUrl)openModal('Tes cloud berhasil',`<p class="card-meta">${esc(r.message)}</p><p><a href="${esc(r.spreadsheetUrl)}" target="_blank" rel="noopener">Buka spreadsheet database ↗</a></p>`)}else{const r=await cloudPostCall(u,'getBootInfo',[]);toast('Koneksi backend berhasil · '+(r.webAppUrl||u))}}catch(err){toast('Tes cloud gagal: '+(err.message||String(err)),'bad')}}
async function sendCloud(){if(!hasGas()){state.settings.cloudUrl=document.getElementById('cloudUrl').value.trim();saveLocal();return toast('Mode lokal: data demo disimpan di perangkat, belum dikirim ke cloud.','bad')}try{state.settings.cloudUrl=document.getElementById('cloudUrl').value.trim()||state.settings.cloudUrl;const r=await gasCall('adminSaveState',sessionToken,state);if(r.state)state=r.state;toast('Data berhasil dikirim ke cloud.')}catch(err){toast('Kirim cloud gagal: '+err.message,'bad')}}
async function pullCloud(){if(!hasGas())return toast('Tarik cloud tersedia setelah aplikasi dipasang melalui Apps Script.','bad');try{const r=await gasCall('getAppState',sessionToken);state=r.state;if(r.webAppUrl)state.settings.cloudUrl=state.settings.cloudUrl||r.webAppUrl;render();closeModal();toast('Data cloud berhasil ditarik.')}catch(err){toast('Tarik cloud gagal: '+err.message,'bad')}}
function backupJSON(){const blob=new Blob([JSON.stringify({app:'JM Operasional',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='jm-operasional-backup-'+todayWIB()+'.json';a.click();URL.revokeObjectURL(u);toast('Backup JSON dibuat.')}
async function restoreJSON(e){const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text()),s=obj.state||obj;if(!s.settings||!Array.isArray(s.items)||!Array.isArray(s.personnel)||!Array.isArray(s.orders)||!Array.isArray(s.deposits))throw new Error('Struktur file tidak sesuai backup JM Operasional.');if(!confirm('Restore akan mengganti data aplikasi saat ini. Lanjutkan?'))return;state=s;await syncSave();closeModal();render();toast('Restore JSON berhasil.')}catch(err){toast('Restore gagal: '+err.message,'bad')}finally{e.target.value=''}}
function formatIdrCsv(value){return 'Rp. '+(Number(value)||0).toLocaleString('id-ID',{maximumFractionDigits:0});}
function exportReport(){
  const csvEscape=value=> '"'+String(value??'').replace(/"/g,'""')+'"';
  const downloadCsv=(rows,filename,message)=>{
    const csv=rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);toast(message);
  };
  const inPeriod=x=>(!reportFrom||String(x.date||'').slice(0,10)>=reportFrom)&&(!reportTo||String(x.date||'').slice(0,10)<=reportTo)&&(reportPerson==='all'||x.personnelId===reportPerson);
  const filteredOrders=state.orders.filter(inPeriod);
  const filteredDeps=state.deposits.filter(inPeriod);

  if(reportTaskType==='general'){
    const people=state.personnel.filter(p=>reportPerson==='all'||p.id===reportPerson);
    const detailRows=getGeneralReportRows(filteredOrders,filteredDeps);
    const totalClosingBalance=people.reduce((sum,p)=>sum+reportBalanceAt(p.id,reportGeneralEndDate()),0);
    const rows=[
      ['NAMA PERSONIL','PER TANGGAL','SETOR','AMBIL','SALDO AKHIR'],
      ['JUMLAH','',formatIdrCsv(sumDeposits(filteredDeps)),formatIdrCsv(sumOrders(filteredOrders)),formatIdrCsv(totalClosingBalance)]
    ];
    detailRows.forEach(r=>rows.push([r.name,r.date,formatIdrCsv(r.deposited),formatIdrCsv(r.taken),formatIdrCsv(r.balance)]));
    downloadCsv(rows,'laporan-umum-'+todayWIB()+'.csv','Laporan umum beserta akumulasi diunduh.');
    return;
  }

  if(reportTaskType==='orders'){
    const totalQty=filteredOrders.reduce((sum,o)=>sum+(o.items||[]).reduce((qty,item)=>qty+(Number(item.qty)||0),0),0);
    const completed=filteredOrders.filter(o=>o.status==='selesai').length;
    const inProcess=filteredOrders.length-completed;
    const rows=[
      ['JENIS','TANGGAL','PERSONIL','RINCIAN','NOMINAL','STATUS'],
      ['JUMLAH ('+filteredOrders.length+' transaksi)','','','Total kuantitas item: '+totalQty,formatIdrCsv(sumOrders(filteredOrders)),'Selesai: '+completed+'; Proses: '+inProcess]
    ];
    filteredOrders.forEach(x=>rows.push(['Order',String(x.date||'').slice(0,10),personName(x.personnelId),(x.items||[]).map(i=>i.name+' x '+i.qty).join('; '),formatIdrCsv(x.total),x.status]));
    downloadCsv(rows,'laporan-order-'+todayWIB()+'.csv','Laporan order beserta akumulasi diunduh.');
    return;
  }

  const totalTurnover=filteredDeps.reduce((sum,d)=>sum+(Number(d.turnover)||0),0);
  const totalIncome=filteredDeps.reduce((sum,d)=>sum+(Number(d.income)||0),0);
  const accepted=filteredDeps.filter(d=>d.status==='diterima').length;
  const waiting=filteredDeps.length-accepted;
  const rows=[
    ['JENIS','TANGGAL','PERSONIL','RINCIAN','NOMINAL','STATUS'],
    ['JUMLAH ('+filteredDeps.length+' transaksi)','','','Omset: '+formatIdrCsv(totalTurnover)+'; Penghasilan: '+formatIdrCsv(totalIncome),formatIdrCsv(sumDeposits(filteredDeps)),'Diterima: '+accepted+'; Menunggu: '+waiting]
  ];
  filteredDeps.forEach(x=>rows.push(['Setor',String(x.date||'').slice(0,10),personName(x.personnelId),'Omset '+formatIdrCsv(x.turnover)+'; Penghasilan '+formatIdrCsv(x.income),formatIdrCsv(x.amount),x.status]));
  downloadCsv(rows,'laporan-setor-'+todayWIB()+'.csv','Laporan setor beserta akumulasi diunduh.');
}

// Ekspor XLSX asli (Open XML) agar kompatibel dengan Excel; baris JUMLAH tebal dan merah.
function exportReportExcel(){
  const inPeriod=x=>(!reportFrom||String(x.date||'').slice(0,10)>=reportFrom)&&(!reportTo||String(x.date||'').slice(0,10)<=reportTo)&&(reportPerson==='all'||x.personnelId===reportPerson);
  const filteredOrders=state.orders.filter(inPeriod);
  const filteredDeps=state.deposits.filter(inPeriod);
  let rows=[],filename='';
  if(reportTaskType==='general'){
    const detailRows=getGeneralReportRows(filteredOrders,filteredDeps);
    const people=state.personnel.filter(p=>reportPerson==='all'||p.id===reportPerson);
    const totalClosingBalance=people.reduce((sum,p)=>sum+reportBalanceAt(p.id,reportGeneralEndDate()),0);
    rows=[['NAMA PERSONIL','PER TANGGAL','SETOR','AMBIL','SALDO AKHIR'],['JUMLAH','',formatIdrCsv(sumDeposits(filteredDeps)),formatIdrCsv(sumOrders(filteredOrders)),formatIdrCsv(totalClosingBalance)]];

    filename='laporan-umum-'+todayWIB()+'.xlsx';
  }else if(reportTaskType==='orders'){
    const totalQty=filteredOrders.reduce((sum,o)=>sum+(o.items||[]).reduce((qty,item)=>qty+(Number(item.qty)||0),0),0);
    const completed=filteredOrders.filter(o=>o.status==='selesai').length;
    const inProcess=filteredOrders.length-completed;
    rows=[['JENIS','TANGGAL','PERSONIL','RINCIAN','NOMINAL','STATUS'],['JUMLAH ('+filteredOrders.length+' transaksi)','','','Total kuantitas item: '+totalQty,formatIdrCsv(sumOrders(filteredOrders)),'Selesai: '+completed+'; Proses: '+inProcess]];
    filteredOrders.forEach(x=>rows.push(['Order',String(x.date||'').slice(0,10),personName(x.personnelId),(x.items||[]).map(i=>i.name+' x '+i.qty).join('; '),formatIdrCsv(x.total),x.status]));
    filename='laporan-order-'+todayWIB()+'.xlsx';
  }else{
    const totalTurnover=filteredDeps.reduce((sum,d)=>sum+(Number(d.turnover)||0),0);
    const totalIncome=filteredDeps.reduce((sum,d)=>sum+(Number(d.income)||0),0);
    const accepted=filteredDeps.filter(d=>d.status==='diterima').length;
    const waiting=filteredDeps.length-accepted;
    rows=[['JENIS','TANGGAL','PERSONIL','RINCIAN','NOMINAL','STATUS'],['JUMLAH ('+filteredDeps.length+' transaksi)','','','Omset: '+formatIdrCsv(totalTurnover)+'; Penghasilan: '+formatIdrCsv(totalIncome),formatIdrCsv(sumDeposits(filteredDeps)),'Diterima: '+accepted+'; Menunggu: '+waiting]];
    filteredDeps.forEach(x=>rows.push(['Setor',String(x.date||'').slice(0,10),personName(x.personnelId),'Omset '+formatIdrCsv(x.turnover)+'; Penghasilan '+formatIdrCsv(x.income),formatIdrCsv(x.amount),x.status]));
    filename='laporan-setor-'+todayWIB()+'.xlsx';
  }

  const xmlEscape=value=>String(value??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  const colName=n=>{let v=n,out='';while(v>0){const r=(v-1)%26;out=String.fromCharCode(65+r)+out;v=Math.floor((v-1)/26);}return out;};
  const sheetRows=rows.map((row,ri)=>'<row r="'+(ri+1)+'"'+(ri===1?' ht="22" customHeight="1"':'')+'>'+row.map((value,ci)=>'<c r="'+colName(ci+1)+(ri+1)+'"'+(ri===1?' s="1"':'')+' t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(value)+'</t></is></c>').join('')+'</row>').join('');
  const colCount=Math.max(1,...rows.map(r=>r.length)),lastCol=colName(colCount);
  const colsXml=Array.from({length:colCount},(_,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+([28,14,20,34,22,24][i]||18)+'" customWidth="1"/>').join('');
  const sheetXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<dimension ref="A1:'+lastCol+rows.length+'"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols>'+colsXml+'</cols><sheetData>'+sheetRows+'</sheetData><pageMargins left="0.25" right="0.25" top="0.5" bottom="0.5" header="0.2" footer="0.2"/></worksheet>';
  const workbookXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+

/* Pengaman aksi: mencegah klik/submit ganda dan memberi status proses pada tombol. */
const JM_BUSY_ACTION_LABELS={loginAdmin:'Memeriksa login…',loginPersonnel:'Memeriksa kode…',logout:'Sedang keluar…',requestAdminRecovery:'Memeriksa metode…',sendAdminRecoveryCode:'Mengirim kode…',submitAdminPasswordReset:'Menyimpan sandi…',submitOrder:'Mengirim order…',submitDeposit:'Mengirim setor…',saveItem:'Menyimpan item…',importPersonnelContact:'Membuka kontak…',savePerson:'Menyimpan personil…',saveOrderEdit:'Menyimpan perubahan order…',saveDepositEdit:'Menyimpan perubahan setor…',completeOrder:'Menandai order selesai…',acceptDeposit:'Menerima setor…',deleteRecord:'Menghapus data…',shareRecord:'Menyiapkan nota…',printRecord:'Menyiapkan cetak…',saveOutlet:'Menyimpan outlet…',saveNavigation:'Menyimpan navigasi…',saveLimits:'Menyimpan batas…',saveAdminRecoveryPhone:'Menyimpan kontak…',savePassword:'Menyimpan sandi…',saveCloudUrl:'Menyimpan URL…',testCloud:'Menguji koneksi…',sendCloud:'Mengirim data…',pullCloud:'Mengambil data…',restoreJSON:'Memulihkan data…'};

shed=false;const finish=()=>{if(finished)return;finished=true;if(form)JM_BUSY_FORMS.delete(form);JM_BUSY_KEYS.delete(key);snapshots.forEach(s=>{if(!s.el)return;s.el.disabled=s.disabled;s.el.innerHTML=s.html;if(s.ariaBusy===null)s.el.removeAttribute('aria-busy');else s.el.setAttribute('aria-busy',s.ariaBusy);if(s.busy===null)s.el.removeAttribute('data-jm-busy');else s.el.setAttribute('data-jm-busy',s.busy)})};let result;try{result=original.apply(this,args)}catch(err){finish();throw err}if(result&&typeof result.then==='function')return result.finally(finish);finish();return result};wrapped.__jmBusyWrapped=true;window[name]=wrapped}
document.addEventListener('click',function(ev){const b=ev.target&&ev.target.closest?ev.target.closest('button'):null;if(!b)return;jmLastClickedButton=b;setTimeout(()=>{if(jmLastClickedButton===b)jmLastClickedButton=null},0)},true);
Object.keys(JM_BUSY_ACTION_LABELS).forEach(name=>jmWrapBusyAction(name,JM_BUSY_ACTION_LABELS[name]));

/* Navigasi usap tepi: kembali di dalam aplikasi, jangan keluar dari halaman */
let jmPageTrail = [], jmTrailIdentity = '', jmLastRenderedPage = null;
let jmSuppressNextPageTrail = false, jmLastBackActionAt = 0, jmEdgeTouchStart = null;
function jmPageIdentity(){
  if(!currentUser)return '';
  return String(currentUser.role||'')+':'+String(currentUser.id||currentUser.name||'');
}
function jmObservePageRender(){
  const who=jmPageIdentity();
  if(!who){jmPageTrail=[];jmTrailIdentity='';jmLastRenderedPage=null;return;}
  if(who!==jmTrailIdentity){jmTrailIdentity=who;jmPageTrail=[];jmLastRenderedPage=page;return;}
  if(jmLastRenderedPage===null){jmLastRenderedPage=page;return;}
  if(page!==jmLastRenderedPage){
    if(!jmSuppressNextPageTrail){jmPageTrail.push(jmLastRenderedPage);if(jmPageTrail.length>30)jmPageTrail.shift();}
    jmSuppressNextPageTrail=false;
    jmLastRenderedPage=page;
  }
}
function jmGoBackInsideApp(){
  const now=Date.now();
  if(now-jmLastBackActionAt<500)return;
  jmLastBackActionAt=now;
  if(!currentUser)return;
  const overlay=document.querySelector('.modal-backdrop');
  if(overlay){try{if(typeof closeModal==='function'){closeModal();return;}}catch(_){}}
  const who=jmPageIdentity();
  if(who!==jmTrailIdentity){jmTrailIdentity=who;jmPageTrail=[];jmLastRenderedPage=page;return;}
  const previousPage=jmPageTrail.pop();
  if(!previousPage)return;
  const adminPages=['overview','tasks','items','personnel','reports','settings'];
  const personnelPages=['overview','order','deposit'];
  if(!(currentUser.role==='admin'?adminPages:personnelPages).includes(previousPage))return;
  jmSuppressNextPageTrail=true;
  page=previousPage;
  persistSession();
  render();
  window.scrollTo({top:0,behavior:'auto'});
}

/* Aktivitas personil berbasis interaksi: tidak ada polling cloud. Kirim satu penanda maksimal tiap 5 menit, hanya saat personil benar-benar berinteraksi. */
function jmTrackPersonnelActivity(event){if(!currentUser||currentUser.role!=='personnel')return;const now=Date.now(),person=state.personnel.find(p=>p.id===currentUser.id);if(person)person.lastActivityAt=new Date(now).toISOString();if(!hasGas()||!sessionToken){if(now-lastPersonnelActivitySent>=PERSONNEL_ACTIVITY_TOUCH_MS){lastPersonnelActivitySent=now;saveLocal()}return;}const target=event&&event.target&&event.target.closest?event.target.closest('button,input,select,textarea,a,[role=button]'):null;if(target&&target.closest('form')&&(target.matches('button[type=submit],input[type=submit]')))return;if(personnelActivityTouchBusy||now-lastPersonnelActivitySent<PERSONNEL_ACTIVITY_TOUCH_MS)return;lastPersonnelActivitySent=now;personnelActivityTouchBusy=true;gasCall('personnelTouchActivity',sessionToken).then(r=>{const p=state.personnel.find(x=>x.id===currentUser?.id);if(p&&r&&r.lastActivityAt)p.lastActivityAt=r.lastActivityAt}).catch(()=>{lastPersonnelActivitySent=Date.now()-PERSONNEL_ACTIVITY_TOUCH_MS+15000}).finally(()=>{personnelActivityTouchBusy=false})}
document.addEventListener('pointerdown',jmTrackPersonnelActivity,{passive:true});document.addEventListener('keydown',jmTrackPersonnelActivity);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')jmTrackPersonnelActivity({target:document.activeElement})});
/* Pembaruan waktu relatif ini berjalan lokal di browser saja dan tidak menghubungi Apps Script. */
setInterval(function(){if(!currentUser||currentUser.role!=='admin')return;const now=Date.now();if(page==='overview'&&!document.querySelector('.modal-backdrop'))render();document.querySelectorAll('.personnel-activity-age').forEach(function(el){const stamp=Number(el.getAttribute('data-last-activity')||0);if(!stamp||now-stamp>=PERSONNEL_ACTIVITY_WINDOW_MS){const card=el.closest('[data-personnel-activity-card]');if(card)card.remove();return;}el.textContent=personnelActivityRelative(new Date(stamp).toISOString(),now);});const grid=document.querySelector('.personnel-activity-list');if(grid&&!grid.querySelector('[data-personnel-activity-card]'))grid.innerHTML='<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">Tidak ada aktivitas personil dalam 24 jam terakhir</div><div class="empty-sub">Personil akan muncul kembali saat login atau melakukan aktivitas.</div></div>';},60000);

/* Entry riwayat penjaga: saat Back/gesture browser terjadi, tetap di aplikasi. */
function jmInstallHistoryGuard(){
  try{history.pushState({__jmAppGuard:true,stamp:Date.now()},'',location.href);}catch(_){}
}
window.addEventListener('popstate',function(){
  jmGoBackInsideApp();
  jmInstallHistoryGuard();
});
/* Di halaman Ringkasan, empat usap tepi dalam 10 detik meminta konfirmasi keluar (logout). */
let jmOverviewExitSwipeCount=0, jmOverviewExitLastSwipeAt=0;
function jmHandleEdgeSwipe(){
  if(document.querySelector('.modal-backdrop')){jmGoBackInsideApp();return;}
  if(currentUser&&page==='overview'){
    const now=Date.now();
    if(now-jmOverviewExitLastSwipeAt>10000)jmOverviewExitSwipeCount=0;
    jmOverviewExitLastSwipeAt=now;
    jmOverviewExitSwipeCount++;
    if(jmOverviewExitSwipeCount>=4){
      jmOverviewExitSwipeCount=0;
      if(confirm('Keluar dari aplikasi JM Operasional? Anda akan kembali ke halaman login.'))logout();
    }
    return;
  }
  jmOverviewExitSwipeCount=0;
  jmGoBackInsideApp();
}
/* Isyarat usap ke dalam dari tepi kiri atau tepi kanan. */
document.addEventListener('touchstart',function(e){
  if(!e.touches||e.touches.length!==1){jmEdgeTouchStart=null;return;}
  const t=e.touches[0], width=window.innerWidth||document.documentElement.clientWidth;
  const edge=(t.clientX<=30)?'left':(t.clientX>=width-30?'right':'');
  jmEdgeTouchStart=edge?{x:t.clientX,y:t.clientY,edge,backTriggered:false}:null;
},{passive:true});
document.addEventListener('touchmove',function(e){
  const start=jmEdgeTouchStart;
  if(!start||!e.touches||e.touches.length!==1)return;
  const t=e.touches[0], dx=t.clientX-start.x, dy=t.clientY-start.y;
  const inward=start.edge==='left'?dx>=65:dx<=-65;
  if(inward&&Math.abs(dx)>Math.abs(dy)*1.25){start.backTriggered=true;if(e.cancelable)e.preventDefault();}
},{passive:false});
document.addEventListener('touchend',function(e){
  const start=jmEdgeTouchStart;jmEdgeTouchStart=null;
  if(!start||!e.changedTouches||!e.changedTouches.length)return;
  const t=e.changedTouches[0], dx=t.clientX-start.x, dy=t.clientY-start.y;
  const inward=start.edge==='left'?dx>=65:dx<=-65;
  if(inward&&Math.abs(dx)>Math.abs(dy)*1.25){if(e.cancelable)e.preventDefault();jmHandleEdgeSwipe();}
},{passive:false});
/* Pasang penjaga sebelum pemulihan sesi; kegagalan pushState tidak menghentikan aplikasi. */
jmInstallHistoryGuard();
restoreSession();
